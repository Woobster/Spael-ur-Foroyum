<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puffin Watch · Lundi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 16'%3E%3Crect width='22' height='16' fill='%23fff'/%3E%3Crect x='6' width='4' height='16' fill='%232c5597'/%3E%3Crect y='6' width='22' height='4' fill='%232c5597'/%3E%3Crect x='7' width='2' height='16' fill='%23d9493a'/%3E%3Crect y='7' width='22' height='2' fill='%23d9493a'/%3E%3C/svg%3E">
<style>
/* Layout: full-bleed 3D bird cliff seen through a camera viewfinder. HUD floats on top; Book, Gear and Map open as sheets. */
:root{
  --ink:#352f45;
  --ink-soft:#6c6580;
  --paper:rgba(251,249,253,.82);
  --paper-solid:#f7f4fa;
  --line:rgba(53,47,69,.12);
  --accent:#d9493a;      /* Merkið red */
  --accent-ink:#ffffff;
  --blue:#2c5597;        /* Merkið blue */
  --gold:#f0b23a;
  --green:#5fcf73;
  --mist:#dcd5e6;
  --white:#ffffff;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --ui:"Figtree","Segoe UI",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--mist);color:var(--ink);font-family:var(--ui)}
body{margin:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#game.drag{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none}
button{font-family:var(--ui)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* viewfinder */
.vf{position:absolute;top:calc(10px + var(--st));bottom:calc(10px + var(--sb));left:calc(10px + var(--sl));right:calc(10px + var(--sr))}
.vf i{position:absolute;width:30px;height:30px;border:3px solid rgba(255,255,255,.9);filter:drop-shadow(0 0 1.5px rgba(53,47,69,.55))}
.vf .k1{left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:10px}
.vf .k2{right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:10px}
.vf .k3{left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:10px}
.vf .k4{right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:10px}
.thirds{position:fixed;inset:0}
.thirds::before,.thirds::after{content:"";position:absolute;border:0 solid rgba(255,255,255,.2)}
.thirds::before{top:0;bottom:0;left:33.333%;right:33.333%;border-left-width:1px;border-right-width:1px}
.thirds::after{left:0;right:0;top:33.333%;bottom:33.333%;border-top-width:1px;border-bottom-width:1px}
.bracket{position:fixed;left:50%;top:50%;width:var(--b,84px);height:var(--b,84px);transform:translate(-50%,-50%);transition:width .18s,height .18s}
.bracket i{position:absolute;width:16px;height:16px;border:2.5px solid #fff;filter:drop-shadow(0 0 1.5px rgba(53,47,69,.6));transition:border-color .15s}
.bracket .k1{left:0;top:0;border-right:0;border-bottom:0}.bracket .k2{right:0;top:0;border-left:0;border-bottom:0}
.bracket .k3{left:0;bottom:0;border-right:0;border-top:0}.bracket .k4{right:0;bottom:0;border-left:0;border-top:0}
.bracket.focusing{--b:64px}
.bracket.locked i{border-color:var(--green)}
.bracket .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:10px;white-space:nowrap;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(53,47,69,.7);opacity:0;transition:opacity .2s}
.bracket .lbl.on{opacity:1}
.exif{position:absolute;left:50%;bottom:calc(122px + var(--sb));transform:translateX(-50%);font:800 11px var(--ui);letter-spacing:.12em;color:#fff;text-shadow:0 1px 3px rgba(53,47,69,.7);font-variant-numeric:tabular-nums;white-space:nowrap;transition:opacity .2s}
.exif.hide{opacity:0}

/* top-left */
.topleft{position:absolute;top:calc(18px + var(--st));left:calc(18px + var(--sl));display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:calc(100% - 90px)}
.money{display:flex;align-items:center;gap:8px;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 14px 7px 8px;border-radius:999px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;box-shadow:0 2px 10px rgba(53,47,69,.12)}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a3,var(--gold) 60%,#c98a1c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);display:grid;place-items:center;flex:none}
.coin svg{width:14px;height:14px;fill:#fff7dc}
.money small{font-size:13px;color:var(--ink-soft);font-weight:700}
.money.bump b{display:inline-block;animation:bump .2s ease-out}
@keyframes bump{50%{transform:scale(1.15)}}
.toprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.langT{pointer-events:auto;display:inline-flex;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(53,47,69,.12)}
.langT button{border:0;background:transparent;font:800 12px var(--ui);letter-spacing:.06em;color:var(--ink-soft);padding:5px 10px;border-radius:999px;cursor:pointer}
.langT button[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.areaBtn{pointer-events:auto;display:flex;align-items:baseline;gap:8px;border:0;cursor:pointer;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 6px 6px 12px;border-radius:999px;font:800 14px var(--ui);color:var(--ink);box-shadow:0 2px 10px rgba(53,47,69,.12)}
.areaBtn span{font-size:12px;font-weight:700;color:var(--ink-soft)}
.areaBtn .go{background:var(--blue);color:var(--white);padding:3px 9px;border-radius:99px;font-size:11px;letter-spacing:.06em}
.areaBtn.ready .go{background:var(--accent);animation:ready 1s ease-in-out infinite alternate}
@keyframes ready{to{transform:scale(1.08)}}
.next{display:flex;flex-direction:column;gap:4px;padding:6px 12px 8px;border-radius:12px;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(53,47,69,.12);font-size:11.5px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.next i{display:block;width:190px;height:6px;border-radius:99px;background:rgba(53,47,69,.12);overflow:hidden}
.next em{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .3s}

/* bottom controls */
.shutter{pointer-events:auto;position:absolute;left:50%;bottom:calc(22px + var(--sb));transform:translateX(-50%);width:86px;height:86px;border-radius:50%;border:0;cursor:pointer;padding:0;touch-action:none;
  background:conic-gradient(var(--ring,#fff) calc(var(--p,0) * 1turn),rgba(255,255,255,.38) 0);box-shadow:0 4px 18px rgba(53,47,69,.3)}
.shutter::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--paper-solid)}
.shutter::after{content:"";position:absolute;inset:15px;border-radius:50%;background:var(--accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);transition:transform .1s}
.shutter.down::after{transform:scale(.86)}
.shutter.locked{--ring:var(--green)}
.pill{pointer-events:auto;position:absolute;bottom:calc(36px + var(--sb));border:0;cursor:pointer;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:11px 16px 11px 12px;font:800 15px var(--ui);color:var(--ink);box-shadow:0 2px 10px rgba(53,47,69,.16);display:flex;align-items:center;gap:7px}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--white)}
#bookBtn{left:calc(18px + var(--sl))}
#gearBtn{right:calc(18px + var(--sr))}
.zoom{pointer-events:auto;position:absolute;right:calc(18px + var(--sr));top:50%;transform:translateY(-50%);width:48px;height:min(44vh,300px);display:flex;flex-direction:column;align-items:center;gap:8px;touch-action:none}
.zoom b{font:400 17px/1 var(--display);color:#fff;text-shadow:0 2px 0 rgba(53,47,69,.25),0 1px 6px rgba(53,47,69,.4);font-variant-numeric:tabular-nums}
.zoom .track{position:relative;flex:1;margin:12px 0;width:10px;border-radius:99px;background:rgba(255,255,255,.42);box-shadow:0 1px 6px rgba(53,47,69,.25);cursor:pointer}
.zoom .track::before{content:"";position:absolute;left:-18px;right:-18px;top:-10px;bottom:-10px}
.zoom .fill{position:absolute;left:0;right:0;bottom:0;border-radius:99px;background:rgba(255,255,255,.9)}
.zoom .thumb{position:absolute;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--paper-solid);box-shadow:0 2px 8px rgba(53,47,69,.35);display:grid;place-items:center}
.zoom .thumb::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
.zoom small{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(53,47,69,.6)}

/* photo result card */
.res{pointer-events:auto;position:absolute;left:50%;bottom:calc(124px + var(--sb));transform:translate(-50%,20px);opacity:0;transition:opacity .25s,transform .25s;display:flex;gap:10px;align-items:center;background:var(--paper-solid);border-radius:16px;padding:8px 14px 8px 8px;box-shadow:0 8px 30px rgba(53,47,69,.28);border:0;cursor:pointer;text-align:left;color:var(--ink);max-width:min(92vw,430px)}
.res.on{opacity:1;transform:translate(-50%,0)}
.res img{width:92px;height:62px;object-fit:cover;border-radius:10px;display:block;flex:none;background:#ccc}
.res .tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.res b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{font-size:12px;font-weight:700;color:var(--ink-soft)}
.res .row{display:flex;gap:8px;align-items:center;font-weight:800;font-size:13px}
.res .pts{color:#b9790f;font-variant-numeric:tabular-nums}
.res .tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:rgba(44,85,151,.12);color:var(--blue)}
.res .tag.new{background:var(--accent);color:#fff}
.res .tip{font-size:11.5px;font-weight:700;color:var(--ink-soft);line-height:1.3;white-space:normal}
.res.miss b{color:var(--accent)}
.stars{color:var(--gold);letter-spacing:1px;font-size:15px;line-height:1}
.stars .off{color:rgba(53,47,69,.18)}

.hint{position:absolute;left:50%;top:calc(50% + 70px);transform:translateX(-50%);background:var(--paper);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;text-align:center;box-shadow:0 4px 20px rgba(53,47,69,.15);transition:opacity .6s;max-width:min(86vw,440px)}
.hint small{display:block;font-weight:600;color:var(--ink-soft);font-size:12.5px;margin-top:4px;line-height:1.4}
.hint.gone{opacity:0}
#floaters{position:absolute;inset:0;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:24px;color:var(--white);text-shadow:0 2px 0 rgba(53,47,69,.3);white-space:nowrap;animation:floatUp 1.4s ease-out forwards}
.fl.gold{color:var(--gold);font-size:30px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.arrive{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;color:var(--white);text-shadow:0 3px 0 rgba(53,47,69,.25),0 6px 24px rgba(53,47,69,.3);animation:popIn .6s cubic-bezier(.2,1.4,.4,1) both,popOut .5s ease-in 2.6s forwards;white-space:nowrap}
.arrive b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,80px);line-height:1}
.arrive span{font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
@keyframes popIn{from{transform:translateX(-50%) scale(.2) rotate(-8deg);opacity:0}}
@keyframes popOut{to{transform:translateX(-50%) translateY(-30px) scale(.9);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .32s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
#fade{position:fixed;inset:0;background:var(--mist);opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}

/* sheets */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(53,47,69,.35);padding:16px;padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr));padding-top:max(16px,var(--st));padding-bottom:max(16px,var(--sb))}
.modal[hidden]{display:none}
.modal .sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper-solid);border-radius:20px;box-shadow:0 20px 60px rgba(53,47,69,.35);overscroll-behavior:contain}
.modal .sheet.wide{width:min(820px,100%)}
.modal header{display:flex;align-items:baseline;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper-solid);z-index:2}
.modal h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px}
.modal .sub{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em}
.modal .x{margin-left:auto;border:0;background:transparent;font-size:30px;line-height:1;cursor:pointer;color:var(--ink);padding:0 4px}
/* map */
#areas{display:flex;flex-direction:column;padding:8px 10px 12px}
.area{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;padding:12px 10px;border-radius:14px}
.area+.area{border-top:1px solid var(--line)}
.area .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--white);color:var(--blue);box-shadow:inset 0 0 0 1px var(--line)}
.area.here{background:rgba(44,85,151,.08)}
.area.here .n{background:var(--blue);color:var(--white)}
.area.locked{opacity:.55}
.area .t{min-width:0}
.area .t b{font-size:16px;font-weight:800}
.area .t small{display:block;font-size:12px;color:var(--ink-soft);font-weight:700}
.area .t p{margin:3px 0 0;font-size:12.5px;line-height:1.4}
.area .mul{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;color:var(--blue);background:rgba(44,85,151,.1);padding:2px 8px;border-radius:99px}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.times button{border:0;border-radius:10px;padding:8px 11px;font:800 13px var(--ui);background:var(--accent);color:var(--accent-ink);cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.times button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.times button.dusk{background:#4a4f7a}
.times button.cur{background:var(--blue)}
.goal{margin:0 20px 18px;padding:12px 14px;border-radius:14px;background:rgba(240,178,58,.18);font-size:13px;font-weight:700}
/* gear */
#gearList{padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px}
.up{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 8px;border-radius:12px}
.up .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--white);color:var(--blue);box-shadow:inset 0 0 0 1px var(--line)}
.up .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.up .tx{min-width:0}
.up .nm{font-weight:800;font-size:14.5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:50%;background:rgba(53,47,69,.15)}
.pips i.on{background:var(--blue)}
.up .en{font-size:12px;color:var(--ink-soft);font-weight:600;line-height:1.35}
.up .ef{font-size:12px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.up button{border:0;border-radius:10px;padding:9px 11px;min-width:82px;font:800 13px var(--ui);font-variant-numeric:tabular-nums;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15);display:flex;gap:5px;align-items:center;justify-content:center}
.up button .coin{width:16px;height:16px}.up button .coin svg{width:10px;height:10px}
.up button:disabled{background:rgba(53,47,69,.12);color:var(--ink-soft);box-shadow:none;cursor:default}
.up button.max{background:var(--gold);color:var(--ink)}
.up.flash{animation:rowflash .4s}
@keyframes rowflash{0%{background:rgba(240,178,58,.5)}}
.sheet footer{display:flex;gap:6px;padding:10px 12px 14px;border-top:1px solid var(--line)}
.sheet footer button{flex:1;border:0;border-radius:9px;padding:9px 8px;font:700 13px var(--ui);background:rgba(53,47,69,.08);color:var(--ink);cursor:pointer}
.sheet footer button.warn{background:var(--accent);color:var(--accent-ink)}
/* book */
.bookTop{padding:12px 20px 4px}
.bookTop i{display:block;height:8px;border-radius:99px;background:rgba(53,47,69,.1);overflow:hidden}
.bookTop em{display:block;height:100%;background:var(--gold);border-radius:99px}
.bookTop p{margin:8px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.spc{padding:14px 20px 16px}
.spc+.spc{border-top:1px solid var(--line)}
.spc .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.spc h3{margin:0;font:400 24px/1.1 var(--display)}
.spc .alt{font-size:13px;font-weight:800;color:var(--ink-soft)}
.spc .la{font-size:12px;font-style:italic;color:var(--ink-soft);font-weight:600}
.spc p.fact{margin:5px 0 0;font-size:13px;line-height:1.45;max-width:62ch}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:10px}
.slot{border:0;padding:0;background:var(--white);border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line),0 1px 3px rgba(53,47,69,.06);text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column}
.slot:disabled{cursor:default}
.slot .ph{aspect-ratio:3/2;background:#ebe6f0;display:grid;place-items:center;overflow:hidden;position:relative}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .ph svg{width:62%;height:72%;fill:#cdc5d8}
.slot .ph .stars{position:absolute;left:6px;bottom:5px;background:rgba(53,47,69,.55);padding:3px 6px;border-radius:99px;font-size:12px}
.slot .ph .stars .off{color:rgba(255,255,255,.35)}
.slot .cap{padding:7px 9px 9px;font-size:12.5px;font-weight:800;line-height:1.25}
.slot .cap small{display:block;font-weight:600;color:var(--ink-soft);font-size:11px;line-height:1.35;margin-top:2px}
.lb{padding:14px}
.lb img{width:100%;display:block;border-radius:14px;background:#ddd}
.lb .cap{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 4px 2px}
.lb .cap b{font-size:18px;font-weight:800}
.lb .cap small{font-size:13px;font-weight:700;color:var(--ink-soft)}
.win{text-align:center;padding:28px 24px 24px}
.win h2{font-size:38px}
.win p{font-size:15px;line-height:1.5;margin:10px auto 18px;max-width:40ch}
.win button{border:0;border-radius:12px;padding:12px 22px;font:400 20px var(--display);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.trophy{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffe9ad 55%,var(--gold));display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.7),0 8px 24px rgba(240,178,58,.4)}
.trophy svg{width:44px;height:44px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.hint{pointer-events:auto}
.hint .tutTop{display:flex;align-items:center;gap:10px;justify-content:center}
.hint .tutTop b{font-size:15.5px}
.hint .tutBar{display:flex;gap:4px;justify-content:center;margin-top:9px}
.hint .tutBar i{width:18px;height:4px;border-radius:99px;background:rgba(53,47,69,.15)}
.hint .tutBar i.on{background:var(--blue)}
.hint .skip{position:absolute;top:6px;right:8px;border:0;background:transparent;font:800 11px var(--ui);letter-spacing:.06em;color:var(--ink-soft);cursor:pointer;padding:4px 6px;text-transform:uppercase}
.hint .tutBody{padding:0 30px}
.hint.bump{animation:hintIn .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes hintIn{from{transform:translateX(-50%) scale(.85);opacity:.3}}
.tutHi{animation:tutPulse 1.1s ease-in-out infinite}
@keyframes tutPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,178,58,.0),0 4px 18px rgba(53,47,69,.3)}50%{box-shadow:0 0 0 10px rgba(240,178,58,.55),0 4px 18px rgba(53,47,69,.3)}}
.zoom.tutHi{animation:none}.zoom.tutHi .track{animation:tutPulse 1.1s ease-in-out infinite}
.helpBtn{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(53,47,69,.12);font:400 18px/1 var(--display);color:var(--blue)}
.help{padding:6px 20px 8px}
.help section+section{border-top:1px solid var(--line)}
.help section{padding:12px 0}
.help h3{margin:0 0 4px;font:400 20px/1.2 var(--display)}
.help p{margin:4px 0;font-size:13.5px;line-height:1.5}
.help ul,.help ol{margin:4px 0;padding-left:20px;font-size:13.5px;line-height:1.5}
.help li{margin:2px 0}
.help kbd{font:800 11.5px var(--ui);background:var(--white);border-radius:5px;padding:1px 6px;box-shadow:inset 0 0 0 1px var(--line),0 1px 0 var(--line)}

@media (max-width:760px){
  .next i{width:150px}
  .money{font-size:17px}
  .pill{padding:10px 13px 10px 11px;font-size:14px;bottom:calc(32px + var(--sb))}
  .pill span{display:none}
  .shutter{width:80px;height:80px}
  .zoom{height:min(34vh,240px);right:calc(12px + var(--sr))}
  .exif{bottom:calc(112px + var(--sb))}
  .res{bottom:calc(112px + var(--sb))}
  .res img{width:78px;height:54px}
}
@media (max-width:420px){.pill span{display:none}}
@media (min-width:761px){.pill span{display:inline}}
@media (prefers-reduced-motion:reduce){.fl,.arrive,#flash.go{animation-duration:.01s}}

function makeBird(id){

  const nk=s.neck||[0,0];

  const hr=s.hr;part(G.sph,mat(c.head),hr,hr,hr*1.08,0,0,0,head,true);
  if(c.face)part(G.sph,mat(c.face),hr*0.9,hr*0.72,hr*0.62,0,-hr*0.08,hr*0.5,head,false);
  if(c.cap)part(G.sph,mat(c.cap),hr*1.05,hr*0.62,hr*1.12,0,hr*0.42,-hr*0.02,head,false);
  if(c.crest){const cr=part(G.cone,mat(c.head),hr*0.5,hr*1.1,hr*0.5,0,hr*1.05,hr*0.25,head,false);cr.rotation.x=0.45;}
  for(const sd of [1,-1]){part(G.sph,c.eye?mat(c.eye):EYE,hr*0.17,hr*0.19,hr*0.17,sd*hr*0.72,hr*0.18,hr*0.52,head,false);}
  const [bwd,bln,bht]=s.beak;
  const bk=part(G.cone,mat(c.beak),bwd*2,bln,bht*2,0,-hr*0.14,hr*0.92+bln*0.45,head,false);bk.rotation.x=PI/2;
  if(c.beak2){const b2=part(G.cone,mat(c.beak2),bwd*2.1,bln*0.34,bht*2.05,0,-hr*0.14,hr*0.92+bln*0.12,head,false);b2.rotation.x=PI/2;}
  const wings=[];
  for(const sd of [1,-1]){const w=new THREE.Group();w.rotation.order='YXZ';w.position.set(sd*bw*0.8,bh*0.3,bl*0.05);pv.add(w);
    const half=Math.max(0.2,s.span/2-bw*0.8);
    part(G.box,mat(c.wing||c.back),half,0.04,s.chord,sd*half/2,0,-s.chord*0.1,w,false);
    if(c.under)part(G.box,mat(c.under),half*0.86,0.02,s.chord*0.86,sd*half*0.45,-0.026,-s.chord*0.1,w,false);
    if(c.tip)part(G.box,mat(c.tip),half*0.34,0.046,s.chord*0.85,sd*half*0.84,0,-s.chord*0.16,w,false);
    if(c.patch)part(G.box,mat(c.patch),half*0.16,0.05,s.chord*0.6,sd*half*0.6,0,-s.chord*0.12,w,false);
    wings.push(w);}
  if(s.fork){for(const sd of [1,-1]){const tl=part(G.box,mat(c.belly),0.035,0.025,s.tail,sd*0.045,bh*0.05,-bl*0.9-s.tail*0.45,pv,false);tl.rotation.y=-sd*0.22;}}
  else{const tl=part(G.box,mat(c.tail||c.back),bw*0.95,0.04,s.tail,0,bh*0.08,-bl*0.92-s.tail*0.35,pv,false);tl.rotation.x=-0.12;}
  const legs=new THREE.Group();g.add(legs);
  for(const sd of [1,-1]){part(G.cyl,mat(c.legs),0.025,s.legH,0.025,sd*bw*0.35,s.legH/2,0,legs,false);part(G.box,mat(c.legs),0.08,0.02,0.11,sd*bw*0.35,0.01,0.04,legs,false);}
  let fish=null;if(id==='puffin'){fish=new THREE.Group();head.add(fish);for(let i=0;i<4;i++){const f=part(G.box,mat('#d8dde6'),0.24,0.018,0.022,(i-1.5)*0.012,-hr*0.24-i*0.012,hr*1.02+i*0.025,fish,false);f.rotation.z=(i-1.5)*0.12;}fish.visible=false;}
  const ext=Math.sqrt((bh*Math.cos(s.up))**2+(bl*Math.sin(s.up))**2);
  g.visible=false;scene.add(g);
  return {id,S:s,g,pv,head,wings,legs,fish,standY:s.legH+ext*0.92,mode:'stand',pos:new THREE.Vector3(),vel:new THREE.Vector3(),yaw:0,spot:null,loop:null,la:0,T:0,life:rand(45,130),phase:rand(0,6),fold:1,flap:0,

/* ---------------- birds: behaviour ---------------- */
const birds=[];
const tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();
let clock=0;
function condW(id){const tm=S.time,w=S.wx;let k=1;
  if(id==='petrel')return tm==='dusk'?1:0;
  if(tm==='dusk')k*=0.55;
  if(id==='fulmar'&&w==='wind')k*=1.6;
  if(id==='tern'&&w==='rain')k*=0.4;
  if(id==='gannet'&&(w==='fog'||w==='rain'))k*=0.5;
  return k;}
function freeSpot(kind){const l=spots[kind].filter(s=>!s.taken);return l.length?l[(Math.random()*l.length)|0]:null;}
function habitOK(h){if(h==='fly')return loops.cliff.length+loops.near.length+loops.low.length>0;if(h==='far')return loops.far.length>0;if(h==='hover')return hoverPts.length>0;
  if(h==='chase')return loops.cliff.length+loops.near.length>0;if(h==='water')return spots.water.length>0;return spots[h]&&spots[h].some(s=>!s.taken);}
function pickLoop(b){const types=b.S.loops.filter(k=>loops[k]&&loops[k].length);if(!types.length)return loops.cliff[0]||loops.low[0]||loops.near[0]||loops.far[0];const k=types[(Math.random()*types.length)|0];return loops[k][(Math.random()*loops[k].length)|0];}
function loopPt(l,a,out){return out.set(l.cx+Math.cos(a)*l.rx,l.cy+Math.sin(a*2)*1.2,l.cz+Math.sin(a)*l.rz);}
function setStand(b,sp){b.mode='stand';b.spot=sp;sp.taken=b;b.pos.set(sp.x,sp.y,sp.z);b.vel.set(0,0,0);b.yaw=sp.yaw;b.fold=1;b.T=rand(14,50);b.landing=null;b.hovering=false;b.chase=null;
  if(b.id==='shag')b.spread=Math.random()<(S.wx==='sun'||S.wx==='wind'?0.55:0.35);}
function setFly(b,loop){b.mode='fly';b.loop=loop||pickLoop(b);b.la=rand(0,2*PI);b.loop.w=b.loop.w||1;b.T=rand(8,22);if(b.spot){b.spot.taken=null;b.spot=null;}b.spread=false;}
function flyInto(b,tx,ty,tz){const side=Math.random()<0.5?-1:1;b.pos.set(side*rand(85,110),ty+rand(1,6),tz+rand(-8,8));b.vel.set(-side*b.S.speed,0,0);b.mode='fly';b.g.visible=true;b.appear=1;}
function spawnBird(initial){
  const L=LOC();const w={};for(const id in L.pool){const k=L.pool[id]*condW(id);if(k>0)w[id]=k;}if(!Object.keys(w).length)return;
  const id=pick(w);const s=SP[id];const hw={};for(const h in s.habits)if(habitOK(h))hw[h]=s.habits[h];if(!Object.keys(hw).length)return;
  const h=pick(hw);const b=makeBird(id);birds.push(b);b.g.visible=true;b.appear=initial?0:1;
  if(h==='slope'||h==='ledge'||h==='shore'||h==='wall'){const sp=freeSpot(h);
    if(initial||h==='wall'){setStand(b,sp);b.appear=0;if(id==='puffin')b.fish=Math.random()<fishP()*0.6;}
    else{b.landing=sp;sp.taken=b;flyInto(b,sp.x,sp.y+4,sp.z);b.T=0;b.loop=pickLoop(b);if(id==='puffin')b.fish=Math.random()<fishP();}}
  else if(h==='water'){const ws=spots.water[(Math.random()*spots.water.length)|0];if(initial){b.mode='water';b.water={x:ws.x,z:ws.z};b.pos.set(ws.x,0,ws.z);b.yaw=rand(0,2*PI);b.T=rand(10,40);b.appear=0;}
    else{b.landing={x:ws.x,y:0.1,z:ws.z,kind:'water'};flyInto(b,ws.x,3,ws.z);b.loop=pickLoop(b);b.T=0;}}
  else if(h==='far'){const l=loops.far[(Math.random()*loops.far.length)|0];setFly(b,l);loopPt(l,b.la,b.pos);b.vel.set(0,0,0);b.T=1e9;}
  else if(h==='hover'){b.hoverPt=hoverPts[(Math.random()*hoverPts.length)|0];if(initial){b.mode='fly';b.pos.set(b.hoverPt.x+rand(-3,3),b.hoverPt.y,b.hoverPt.z);}else flyInto(b,b.hoverPt.x,b.hoverPt.y,b.hoverPt.z);b.mode='fly';b.loop=null;b.T=rand(5,10);}
  else if(h==='chase'){const L2=LOC();const preyId=L2.pool.kittiwake?'kittiwake':(L2.pool.tern?'tern':'puffin');const pr=makeBird(preyId);birds.push(pr);pr.g.visible=true;const lp=loops.cliff[0]?loops.cliff[(Math.random()*loops.cliff.length)|0]:loops.near[0];
    setFly(pr,lp);pr.T=rand(14,22);if(initial){loopPt(lp,pr.la,pr.pos);}else flyInto(pr,lp.cx,lp.cy,lp.cz);pr.hovering=false;pr.hoverPt=null;pr.prey=true;
    b.mode='fly';b.chase=pr;b.loop=lp;b.T=rand(12,20);b.pos.copy(pr.pos).add(tmp.set(rand(-4,4),rand(0,2),rand(-4,4)));b.vel.copy(pr.vel);}
  else{setFly(b);if(initial){loopPt(b.loop,b.la,b.pos);}else flyInto(b,b.loop.cx,b.loop.cy,b.loop.cz);}
}
function fishP(){return {morning:.4,midday:.16,evening:.48,dusk:.2}[S.time];}
function removeBird(b){b.gone=true;if(b.spot)b.spot.taken=null;if(b.landing&&b.landing.taken===b)b.landing.taken=null;scene.remove(b.g);}
function takeOff(b){const sp=b.spot;setFly(b);b.vel.set(Math.sin(b.yaw)*3,3.2,Math.cos(b.yaw)*3);if(b.id==='puffin')b.fish=false;if(sp)b.pos.y+=0.05;}
function startLeave(b){b.leaving=true;b.landing=null;b.hovering=false;b.chase=null;b.T=1e9;if(b.mode!=='fly'){if(b.mode==='stand')takeOff(b);else{b.mode='fly';b.vel.set(0,3,b.S.speed*0.5);}}
  b.exitX=(b.pos.x>0?1:-1)*150;}
function steer(b,tgt,dt,spd){tmp2.subVectors(tgt,b.pos);const d=tmp2.length()||1;tmp2.multiplyScalar(spd/d);b.vel.lerp(tmp2,1-Math.exp(-b.S.agil*dt));b.pos.addScaledVector(b.vel,dt);return d;}
function updateBird(b,dt){
  const s=b.S;b.phase+=dt;
  if(b.appear<1){b.appear=Math.min(1,b.appear+dt*2.5);}
  if(b.mode!=='under'){b.life-=dt;if(b.life<=0&&!b.leaving&&b.id!=='gannet')startLeave(b);}
  let flapAmp=0,flapHz=s.flapHz,fold=1,bodyPitch=0;const now=clock;
  if(b.mode==='stand'){
    const sp=b.spot;b.pos.set(sp.x,sp.y,sp.z);b.T-=dt;b.idle-=dt;
    if(b.idle<=0){b.idle=rand(1.5,5);b.look=rand(-0.9,0.9);if(Math.random()<0.18)b.stretch=0.9;}
    b.lookT+=(b.look-b.lookT)*(1-Math.exp(-6*dt));b.head.rotation.y=b.lookT;b.head.rotation.x=s.up*0.85+Math.sin(now*2+b.seed)*0.04;
    if(b.stretch>0){b.stretch-=dt;fold=0.35;flapAmp=0.4;flapHz=2;}
    if(b.spread){fold=0;flapAmp=0.08;flapHz=1.5;}
    bodyPitch=-s.up;
    if(b.T<=0&&!(b.id==='petrel'&&S.time==='dusk'&&Math.random()<0.5)){if(Math.random()<0.6||b.id==='shag'){b.T=rand(10,30);if(b.id==='shag')b.spread=!b.spread&&Math.random()<0.5;}else takeOff(b);}
    b.g.position.copy(b.pos);b.g.rotation.set(0,b.yaw,0);b.legs.visible=true;b.pv.position.y=b.standY+Math.sin(now*3+b.seed)*0.006;
  }else if(b.mode==='water'){
    b.T-=dt;const tm=clock;const wy=waveY(b.pos.x,b.pos.z,tm);b.pos.x+=Math.sin(tm*0.3+b.seed)*0.08*dt;b.pos.y=wy;
    b.yaw+=Math.sin(tm*0.2+b.seed)*0.15*dt;b.g.position.copy(b.pos);b.g.rotation.set(0,b.yaw,Math.sin(tm*1.3+b.seed)*0.06);b.legs.visible=false;b.pv.position.y=s.body[1]*0.35;bodyPitch=-0.12;
    b.head.rotation.x=0.1;b.head.rotation.y=Math.sin(tm*0.7+b.seed)*0.5;
    if(b.T<=0){if(b.id==='gannet'){setFly(b,loops.far[(Math.random()*loops.far.length)|0]);b.vel.set(Math.sin(b.yaw)*5,4,Math.cos(b.yaw)*5);b.T=1e9;b.diveT=rand(8,16);}
      else if(Math.random()<0.55){b.mode='under';b.under=rand(2,4);b.g.visible=false;}else if(Math.random()<0.5){b.T=rand(10,30);}else{setFly(b);b.vel.set(Math.sin(b.yaw)*4,3,Math.cos(b.yaw)*4);}}
  }else if(b.mode==='under'){
    b.under-=dt;if(b.under<=0){b.g.visible=true;b.mode='water';b.pos.x+=rand(-3,3);b.pos.z+=rand(-2,2);b.T=rand(6,20);if(b.id==='gannet')b.T=rand(1.5,3);}
    return;
  }else if(b.mode==='dive'){
    b.vel.y-=14*dt;b.pos.addScaledVector(b.vel,dt);fold=0.82;
    const hp=Math.hypot(b.vel.x,b.vel.z);b.g.rotation.set(-Math.atan2(b.vel.y,hp),Math.atan2(b.vel.x,b.vel.z),0);b.g.position.copy(b.pos);b.legs.visible=false;b.pv.position.y=0;
    if(b.pos.y<=0.2){splash(b.pos.x,b.pos.z,b.pos.distanceTo(camera.position));b.mode='under';b.under=1.4;b.g.visible=false;b.pos.y=0;b.vel.set(0,0,0);}
  }else{ // fly
    let tgt=tmp.set(0,0,0),spd=s.speed;
    if(b.leaving){tgt.set(b.exitX,b.pos.y+4,b.pos.z-10);if(Math.abs(b.pos.x)>140||b.pos.y>90){removeBird(b);return;}}
    else if(b.landing&&b.T<=0){const sp=b.landing;tgt.set(sp.x,sp.y+(sp.kind==='water'?0.1:0.25),sp.z);const d=b.pos.distanceTo(tgt);spd=s.speed*clamp(d/6,0.25,1);
      if(d<3.5){fold=1-d/3.5*0.9;}
      if(d<0.35){if(sp.kind==='water'){b.mode='water';b.landing=null;b.T=rand(10,40);b.yaw=Math.atan2(b.vel.x,b.vel.z);b.pos.set(sp.x,0,sp.z);}else{b.landing=null;setStand(b,sp);}return;}}
    else if(b.chase){const pr=b.chase;if(pr.gone||pr.mode!=='fly'){b.chase=null;b.T=0;}else{tgt.copy(pr.vel).normalize().multiplyScalar(-2.4).add(pr.pos);tgt.y+=0.3;spd=Math.max(s.speed,pr.vel.length()*1.1);}}
    else if(b.hoverPt){const hp=b.hoverPt;tgt.set(hp.x,hp.y,hp.z);const d=b.pos.distanceTo(tgt);
      if(d<1.2){b.hovering=true;}if(b.hovering){spd=0.4;tgt.set(hp.x+Math.sin(now*1.3+b.seed)*0.3,hp.y+Math.sin(now*2.1+b.seed)*0.25,hp.z);}
      b.T-=dt;if(b.T<=0){b.hovering=false;b.T=rand(5,10);if(Math.random()<0.25){const sp=freeSpot('shore')||freeSpot('slope');if(sp){b.landing=sp;sp.taken=b;b.T=0;b.hoverPt=null;}}else b.hoverPt=hoverPts[(Math.random()*hoverPts.length)|0];}}
    if(!b.landing&&!b.chase&&!b.hoverPt&&!b.leaving){const l=b.loop||(b.loop=pickLoop(b));b.la+=dt*s.speed/Math.max(6,(l.rx+l.rz)*0.5)*(b.seed>50?1:-1);loopPt(l,b.la+(b.seed>50?0.5:-0.5),tgt);
      if(b.id==='petrel'){tgt.x+=Math.sin(now*3+b.seed)*2;tgt.y+=Math.sin(now*4.7+b.seed)*0.5;}
      b.T-=dt;if(b.T<=0){
        if(b.id==='gannet'){}
        else if(b.prey){b.prey=false;b.T=rand(8,16);}
        else{const kinds=Object.keys(s.habits).filter(k=>k==='slope'||k==='ledge'||k==='shore'||k==='wall');const sp=kinds.length&&Math.random()<0.65?freeSpot(kinds[(Math.random()*kinds.length)|0]):null;
          if(sp){b.landing=sp;sp.taken=b;b.T=0;if(b.id==='puffin')b.fish=Math.random()<fishP();}
          else if(s.habits.water&&Math.random()<0.5&&spots.water.length){const ws=spots.water[(Math.random()*spots.water.length)|0];b.landing={x:ws.x,y:0.1,z:ws.z,kind:'water'};b.T=0;}
          else if(s.habits.hover&&hoverPts.length){b.hoverPt=hoverPts[(Math.random()*hoverPts.length)|0];b.T=rand(5,10);}
          else{b.loop=pickLoop(b);b.T=rand(8,20);}}}
      if(b.id==='gannet'&&!b.leaving){b.diveT-=dt;if(b.diveT<=0&&S.wx!=='fog'&&S.wx!=='rain'&&b.pos.y>8){b.mode='dive';b.vel.set(b.vel.x*0.3,-4,b.vel.z*0.3);b.diveT=rand(8,18);}else if(b.diveT<=0)b.diveT=rand(4,8);}}
    if(b.mode!=='fly')return;
    const d=steer(b,tgt,dt,spd);
    const gy=groundY(b.pos.x,b.pos.z);const minY=Math.max(gy,0)+(b.landing&&d<4?0.05:1.0);if(b.pos.y<minY){b.pos.y=minY;if(b.vel.y<0)b.vel.y*=0.3;}
    const hpv=Math.hypot(b.vel.x,b.vel.z);const ny=hpv>0.3?Math.atan2(b.vel.x,b.vel.z):b.yaw;const dy=((ny-b.yaw+PI)%(2*PI)+2*PI)%(2*PI)-PI;b.yaw=lerpAngle(b.yaw,ny,1-Math.exp(-8*dt));
    const bank=clamp(-dy*4,-0.7,0.7);let pitch=-Math.atan2(b.vel.y,Math.max(hpv,0.5))*0.7;
    if(b.hovering){pitch=-0.75;flapAmp=1.0;flapHz=s.flapHz*1.6;}
    else{const gl=s.glide>0&&(Math.sin(now*0.4+b.seed)>-(s.glide*1.6-0.8));flapAmp=gl?0.06:0.85;if(gl)flapHz=0.6;if(b.vel.y>1.5)flapAmp=0.9;}
    if(!b.landing||d>3.5)fold=Math.max(0,b.fold-dt*4);
    b.g.position.copy(b.pos);b.g.rotation.set(pitch,b.yaw,bank*0.6);b.legs.visible=!!(b.landing&&d<3);b.pv.position.y=0;bodyPitch=0;
    b.head.rotation.x=-pitch*0.6;b.head.rotation.y=0;
  }
  b.fold+=(fold-b.fold)*(1-Math.exp(-7*dt));
  b.flap=Math.sin(b.phase*flapHz*2*PI)*flapAmp;
  b.pv.rotation.x+=(bodyPitch-b.pv.rotation.x)*(1-Math.exp(-6*dt));
  for(let i=0;i<2;i++){const sd=i?-1:1;const w=b.wings[i];w.rotation.set(b.fold*1.4,sd*b.fold*1.45,sd*b.flap*(1-b.fold*0.9));}
  if(b.fishMesh)b.fishMesh.visible=!!b.fish;
  const sc=b.appear<1?Math.sin(b.appear*PI*0.5):1;b.g.scale.setScalar(Math.max(0.01,sc));
}
function populate(){birds.forEach(b=>scene.remove(b.g));birds.length=0;const L=LOC();for(let i=0;i<Math.round(L.pop*0.85);i++)spawnBird(true);}

const FXM={water:basic('#f4f8fb',{fog:true}),drop:new THREE.LineBasicMaterial({color:'#e6edf5',transparent:true,opacity:0.55})};
const parts=[];for(let i=0;i<120;i++){const m=new THREE.Mesh(G.ico,FXM.water);m.visible=false;scene.add(m);parts.push({m,vx:0,vy:0,vz:0,t:0,life:0,s:0});}
let pi=0;
function splash(x,z,dist){for(let k=0;k<14;k++){const p=parts[pi=(pi+1)%parts.length];p.m.visible=true;p.m.position.set(x,0.2,z);const a=rand(0,2*PI);p.vx=Math.cos(a)*rand(0.5,2.5);p.vz=Math.sin(a)*rand(0.5,2.5);p.vy=rand(3,7);p.t=0;p.life=rand(0.6,1.1);p.s=rand(0.12,0.3);p.m.scale.setScalar(p.s);}if(dist<120)sfxSplash(clamp(1-dist/120,0.1,1));}
function updateParts(dt){for(const p of parts){if(!p.m.visible)continue;p.t+=dt;if(p.t>=p.life){p.m.visible=false;continue;}p.vy-=12*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;if(p.m.position.y<0)p.m.visible=false;p.m.scale.setScalar(p.s*(1-p.t/p.life));}}

let FOGN=60,FOGF=380,LIGHT=1;
function applyAtmos(){
  const T=TIME_SET[S.time],W=WX_SET[S.wx];const grey=new THREE.Color(W.grey);
  const dusk=S.time==='dusk';const top=new THREE.Color(T.top).lerp(grey.clone().multiplyScalar(dusk?0.5:1),W.mix*0.8);const hor=new THREE.Color(T.hor).lerp(dusk?grey.clone().multiplyScalar(0.62):grey,W.mix);
  setSky(top,hor);scene.fog.color.copy(hor);scene.background.copy(hor);
  FOGN=W.fog[0];FOGF=W.fog[1]*(dusk?0.8:1);scene.fog.near=FOGN;scene.fog.far=FOGF;
  sun.color.set(T.sun);sun.intensity=T.sunI*W.sunK;hemi.intensity=T.hemi*(1+W.mix*0.12);sun.position.set(...T.sunPos);
  seaMat.color.set(T.sea).lerp(hor,0.12+W.mix*0.25);
  LIGHT=T.L*W.L;windK=W.shake;
  starPts.visible=dusk&&S.wx!=='fog'&&S.wx!=='rain';rain.visible=S.wx==='rain';
  clouds.forEach(c=>c.children.forEach(m=>m.material.color.set(dusk?'#8c86a6':(W.mix>0.4?'#e9e8ee':'#f7f5fa'))));
  const lit=dusk||S.time==='evening';nightLights.forEach(m=>{if(m.material.isMeshBasicMaterial)m.visible=dusk||S.wx==='fog';else m.material=lit?basic(dusk?'#ffd98a':'#f6e3b0'):mat('#6f7f99');});
  if(beam)beam.visible=dusk||S.wx==='fog';
}

let camBase=new THREE.Vector3();
function placeCamera(){const L=LOC();const z=L.cam.z;const y=L.boat?2.3:groundY(0,z)+1.7;camBase.set(0,y,z);view.yaw=0;view.pitch=L.cam.pitch;view.zoom=view.zt=Math.min(view.zt||1,gv('lens'));}
function maxZoom(){return gv('lens');}
function fovFor(z){return 2*Math.atan(Math.tan(31*PI/180)/z)*180/PI;}
let shakeA=0;
function updateCamera(dt){
  const L=LOC();view.zt=clamp(view.zt,1,maxZoom());view.zoom+=(view.zt-view.zoom)*(1-Math.exp(-12*dt));
  const yawMax=1.2;view.yaw=clamp(view.yaw,-yawMax,yawMax);view.pitch=clamp(view.pitch,L.cam.pMin,L.cam.pMax);
  camera.fov=fovFor(view.zoom);camera.updateProjectionMatrix();
  const tri=gv('tri');shakeA=(0.0006+windK*0.0042+(L.boat?0.0018:0))*tri;
  const tm=clock;const sx=(vnoise(tm*2.6,3.1)-0.5)*2*shakeA,sy=(vnoise(tm*2.9,7.7)-0.5)*2*shakeA;
  let y=camBase.y,roll=0;if(L.boat){y+=Math.sin(tm*0.9)*0.25+Math.sin(tm*1.7)*0.08;roll=Math.sin(tm*0.7)*0.02;}
  camera.position.set(camBase.x,y,camBase.z);camera.rotation.set(view.pitch+sy,view.yaw+sx,roll);camera.updateMatrixWorld();
  if(boat){boat.position.y=y-2.3;boat.rotation.z=roll;boat.rotation.x=Math.sin(tm*0.9+1)*0.02;}
}

const aspect=()=>innerWidth/innerHeight;
function birdCenter(b,out){out.copy(b.g.position);if(b.mode==='stand')out.y+=b.S.rs*0.9;return out;}
function birdR(b){return (b.mode==='stand'&&!b.spread&&!(b.stretch>0))?b.S.rs:b.S.rf;}
const pv3=new THREE.Vector3();
function project(b){birdCenter(b,pv3);const d=pv3.distanceTo(camera.position);pv3.project(camera);return {x:pv3.x*aspect(),y:pv3.y,z:pv3.z,d};}
function pickSubject(maxR){const th=Math.tan(camera.fov*PI/360),A=aspect();let best=null,bs=0;
  for(const b of birds){if(b.gone||!b.g.visible||b.mode==='under'||b.appear<0.6)continue;const p=project(b);if(p.z>1||p.z<-1)continue;const f=birdR(b)/(p.d*th);
    if(Math.abs(p.x)>A+f*0.5||Math.abs(p.y)>1+f*0.5)continue;const dc=Math.hypot(p.x,p.y);if(maxR!=null&&dc>maxR+f*0.6)continue;
    const sc=Math.min(f,0.8)*(1.4-Math.min(dc,1.3)*0.8);if(sc>bs){bs=sc;best={b,p,f,dc};}}

    row.querySelector('.ef').textContent=gearEffect(g);
    const btn=row.querySelector('button');
    if(maxed){btn.textContent=t('gear.maxed');btn.className='max';btn.disabled=true;}
    else{btn.innerHTML=`<span class="coin"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></span><span>${fmt(c)}</span>`;btn.disabled=S.pts<c;btn.onclick=()=>buy(g);}
    el.appendChild(row);});
  $('#sound').textContent=t(S.sound?'snd.on':'snd.off');}
function buy(g){const l=S.gear[g.id];if(l>=g.lv.length-1)return;const c=g.cost[l];if(S.pts<c)return;S.pts-=c;S.gear[g.id]++;sfxBuy();bumpPts();renderGear();const r=document.getElementById('g-'+g.id);if(r)r.classList.add('flash');
  if(g.id==='lens')renderZoom();if(g.id==='wx'){applyAtmos();}renderGearDot();save();}
function renderGearDot(){$('#gearDot').hidden=!GEAR.some(g=>S.gear[g.id]<g.lv.length-1&&S.pts>=g.cost[S.gear[g.id]]);}
$('#sound').onclick=()=>{S.sound=!S.sound;syncSound();renderGear();save();};
let resetArm=0;$('#reset').onclick=()=>{const b=$('#reset');if(Date.now()-resetArm<3000){try{localStorage.removeItem(KEY);localStorage.removeItem(KEY_IMG);}catch(e){}location.reload();return;}resetArm=Date.now();b.textContent=t('reset.confirm');b.classList.add('warn');setTimeout(()=>{b.textContent=t('reset');b.classList.remove('warn');},3000);};
function showWin(){$('#winText').textContent=t('win.text',fmt(S.photos));openM('#winWrap');floatMid(t('fx.done'),'gold');sfxOpen();save();}
langHooks.push(()=>{renderTut();if(!$('#helpWrap').hidden)renderHelp();renderArea();renderNext();renderZoom();renderExif();lastLbl='';if(!$('#mapWrap').hidden)renderMap();if(!$('#bookWrap').hidden)renderBook();if(!$('#gearWrap').hidden)renderGear();$('#sound').textContent=t(S.sound?'snd.on':'snd.off');$('#pts').textContent=fmt(S.pts);});

/* ---------------- audio ---------------- */
let actx=null,noiseBuf=null,master=null,amb=null,lastCall=0;
function initAudio(){if(actx){if(actx.state==='suspended')actx.resume();return;}try{actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=S.sound?0.6:0;master.connect(actx.destination);
  noiseBuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);const d=noiseBuf.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+0.02*w)/1.02;d[i]=l*3.5;}sfxAmbience();}catch(e){actx=null;}}
function syncSound(){if(master)master.gain.value=S.sound?0.6:0;}
function sfxAmbience(){if(!actx)return;if(amb){try{amb.src.stop();}catch(e){}}const src=actx.createBufferSource();src.buffer=noiseBuf;src.loop=true;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=LOC().boat?700:450;const g=actx.createGain();g.gain.value=0.05+windK*0.05+(S.wx==='rain'?0.03:0);
  const lfo=actx.createOscillator();lfo.frequency.value=0.12;const lg=actx.createGain();lg.gain.value=0.025;lfo.connect(lg);lg.connect(g.gain);src.connect(f);f.connect(g);g.connect(master);src.start();lfo.start();amb={src,lfo};}
function tone(type,f0,f1,t0,dur,vol,dest){const o=actx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);const g=actx.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+Math.min(0.02,dur*0.3));g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+0.02);}
function sfxShutter(){if(!actx)return;const t0=actx.currentTime;[0,0.055].forEach((d,i)=>{const n=actx.createBufferSource();n.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=2400+i*1400;f.Q.value=3;const g=actx.createGain();g.gain.setValueAtTime(0.9,t0+d);g.gain.exponentialRampToValueAtTime(0.001,t0+d+0.045);n.connect(f);f.connect(g);g.connect(master);n.start(t0+d,rand(0,1));n.stop(t0+d+0.06);});}
function sfxBeep(){if(!actx)return;const t0=actx.currentTime;tone('sine',2200,0,t0,0.05,0.08);tone('sine',2200,0,t0+0.08,0.05,0.08);}
function sfxCoin(){if(!actx)return;const t0=actx.currentTime;[1320,1760].forEach((f,i)=>tone('sine',f,0,t0+i*0.06,0.15,0.1));}
function sfxNew(){if(!actx)return;const t0=actx.currentTime;[784,988,1175,1568].forEach((f,i)=>tone('triangle',f,0,t0+i*0.08,0.22,0.12));}
function sfxOpen(){if(!actx)return;const t0=actx.currentTime;[523,659,784,1047,1319].forEach((f,i)=>tone('triangle',f,0,t0+i*0.1,0.35,0.12));}
function sfxBuy(){if(!actx)return;const t0=actx.currentTime;[660,880,1100].forEach((f,i)=>tone('triangle',f,0,t0+i*0.05,0.12,0.14));}
function sfxSplash(v){if(!actx)return;const t0=actx.currentTime;const n=actx.createBufferSource();n.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3000,t0);f.frequency.exponentialRampToValueAtTime(300,t0+0.5);const g=actx.createGain();g.gain.setValueAtTime(0.5*v,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.55);n.connect(f);f.connect(g);g.connect(master);n.start(t0,rand(0,1));n.stop(t0+0.6);}
const CALLS={
 kittiwake:(t0,v)=>{tone('sine',1100,1700,t0,0.16,0.05*v);tone('sine',1700,1000,t0+0.18,0.32,0.06*v);},
 puffin:(t0,v)=>{const o=actx.createOscillator();o.type='sawtooth';o.frequency.value=120;const am=actx.createOscillator();am.frequency.value=18;const ag=actx.createGain();ag.gain.value=0.5;const g=actx.createGain();g.gain.value=0;am.connect(ag);ag.connect(g.gain);const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=500;o.connect(f);f.connect(g);g.connect(master);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(0.05*v,t0+0.1);g.gain.linearRampToValueAtTime(0.0001,t0+0.7);o.start(t0);am.start(t0);o.stop(t0+0.75);am.stop(t0+0.75);},
 tjaldur:(t0,v)=>{for(let i=0;i<4;i++)tone('sine',2700,2300,t0+i*0.14,0.09,0.05*v);},
 tern:(t0,v)=>{tone('square',2000,1400,t0,0.28,0.022*v);},
 fulmar:(t0,v)=>{for(let i=0;i<5;i++)tone('sawtooth',260,200,t0+i*0.07,0.06,0.025*v);},
 guillemot:(t0,v)=>{tone('sawtooth',300,220,t0,0.5,0.025*v);},
 skua:(t0,v)=>{tone('square',520,380,t0,0.2,0.025*v);tone('square',520,380,t0+0.25,0.2,0.025*v);},
 gannet:(t0,v)=>{tone('sawtooth',330,250,t0,0.25,0.02*v);},
 petrel:(t0,v)=>{const o=actx.createOscillator();o.type='sawtooth';o.frequency.value=180;const g=actx.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(0.03*v,t0+0.1);g.gain.linearRampToValueAtTime(0.0001,t0+1.4);const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=700;o.connect(f);f.connect(g);g.connect(master);o.start(t0);o.stop(t0+1.5);tone('sine',1400,0,t0+1.4,0.05,0.03*v);}
};
function ambientCalls(){if(!actx||!S.sound)return;if(clock-lastCall<rand(2.2,5))return;lastCall=clock;const near=birds.filter(b=>!b.gone&&b.mode!=='under'&&CALLS[b.id]);if(!near.length)return;const b=near[(Math.random()*near.length)|0];const d=b.pos.distanceTo(camera.position);const v=clamp(1.4-d/60,0.15,1);try{CALLS[b.id](actx.currentTime+0.02,v);}catch(e){}}

/* ---------------- loop ---------------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);
let last=performance.now(),saveT=0;
function frame(now){
  const dtR=Math.min(0.25,Math.max(0,(now-last)/1000));const dt=Math.min(0.05,dtR);last=now;clock+=dt;
  keyLook(dt);updateCamera(dt);updateSea(clock);
  for(const b of birds)if(!b.gone)updateBird(b,dt);
  updateSpawner(dt);updateParts(dt);updateRain(dt);updateFocus(dtR);updateTut(dtR);
  for(const c of clouds){c.position.x+=dt*(1.5+windK*6);if(c.position.x>300)c.position.x=-300;}
  if(beam&&beam.visible)beam.parent.rotation.y=clock*0.8;
  if(resT>0){resT-=dt;if(resT<=0){resEl.classList.remove('on');$('#exif').classList.remove('hide');}}
  exifT-=dt;if(exifT<=0){exifT=0.25;renderExif();}
  ambientCalls();
  saveT+=dt;if(saveT>5){saveT=0;save();}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function start(data){
  load(data&&data.S);S.loc=clamp(S.loc,0,LOCS.length-1);if(bookN()<LOC().need)S.loc=0;
  resize();setupVisit();bumpPts();renderGear();renderGearDot();$('#bookDot').hidden=bookN()<=S.seenBook;syncSound();
  renderTut();
  arrive();
  requestAnimationFrame(tm=>{last=tm;frame(tm);});
}
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S:JSON.parse(JSON.stringify(S))}));}catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
