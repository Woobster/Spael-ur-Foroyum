<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sheep Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed 3D hillside with the stone pen in front, HUD floats on top, shop docks right (bottom sheet on phones). Single committed look: pastel Faroese November. */
:root{
  --ink:#352f45;
  --ink-soft:#6c6580;
  --paper:rgba(251,249,253,.82);
  --paper-solid:#f7f4fa;
  --line:rgba(53,47,69,.12);
  --accent:#d9493a;      /* Merkið red */
  --accent-ink:#ffffff;
  --blue:#2c5597;        /* Merkið blue */
  --gold:#f0b23a;
  --mist:#dcd5e6;
  --white:#ffffff;
  --display:"Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --ui:"Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%;overflow:hidden;background:var(--mist);color:var(--ink);font-family:var(--ui)}
body{margin:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none;outline:none}
#hud{position:fixed;inset:0;pointer-events:none}

.topleft{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.money{display:flex;align-items:center;gap:8px;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 14px 7px 8px;border-radius:999px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;box-shadow:0 2px 10px rgba(53,47,69,.12)}
.money .coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a3,var(--gold) 60%,#c98a1c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.money small{font-size:13px;color:var(--ink-soft);font-weight:700}
.rate{font-size:12px;font-weight:700;color:var(--ink);background:var(--paper);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.unused-place{font-size:12px;font-weight:700;color:var(--ink);opacity:.75;padding-left:4px;letter-spacing:.02em}

.counter{position:absolute;left:50%;bottom:calc(12% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--display);color:var(--white);font-size:clamp(44px,7vw,84px);line-height:1;white-space:nowrap;text-shadow:0 3px 0 rgba(53,47,69,.18),0 6px 24px rgba(53,47,69,.25);display:flex;gap:.25em;align-items:baseline;font-variant-numeric:tabular-nums}
.counter span{font-size:.7em}
.ammo{position:absolute;left:50%;bottom:calc(4.5% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:auto;border:0;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:7px 14px;min-height:38px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 2px 10px rgba(53,47,69,.14);font:800 13px var(--ui);color:var(--ink)}
.shells{display:flex;gap:4px;align-items:flex-end}
.shell{width:9px;height:22px;border-radius:3px 3px 2px 2px;background:linear-gradient(180deg,#e0533f 0 68%,#d6a640 68% 100%);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.shell.spent{background:rgba(53,47,69,.15);box-shadow:none}
.shells .more{font-variant-numeric:tabular-nums;margin-left:4px}
.ammo.empty .shells{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.rl{display:none;position:relative;width:150px;height:22px;border-radius:99px;background:rgba(53,47,69,.12);overflow:hidden}
.rl i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold)}
.rl b{position:relative;display:block;text-align:center;line-height:22px;font-size:11px;letter-spacing:.14em}
.ammo.reloading .shells{display:none}.ammo.reloading .rl{display:block}
.ammo.inf .shells{display:none}.ammo.inf::after{content:"∞ FREE SHELLS";letter-spacing:.1em;color:var(--accent)}
.counter.bump b{display:inline-block;animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}

.combo{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.combo b{font-family:var(--display);font-size:40px;color:var(--white);text-shadow:0 3px 0 rgba(53,47,69,.25);line-height:1}
.combo .bar{width:140px;height:8px;border-radius:99px;background:rgba(255,255,255,.5);overflow:hidden}
.combo .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px}
.combo .lbl{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink);opacity:.7}

.frenzy{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(40px,8vw,96px);color:var(--gold);-webkit-text-stroke:3px var(--white);text-shadow:0 6px 0 rgba(217,73,58,.5);animation:frenzyIn .5s cubic-bezier(.2,1.6,.4,1) both, frenzyOut .4s ease-in 1.4s forwards;white-space:nowrap}
@keyframes frenzyIn{from{transform:translateX(-50%) scale(.2) rotate(-8deg);opacity:0}}
@keyframes frenzyOut{to{transform:translateX(-50%) translateY(-30px) scale(.9);opacity:0}}
body.in-frenzy #hud::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 120px 30px rgba(240,178,58,.45);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 0 160px 40px rgba(240,178,58,.6)}}

.hint{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:var(--paper);padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;text-align:center;box-shadow:0 4px 20px rgba(53,47,69,.15);transition:opacity .6s;max-width:min(86vw,420px)}
.hint small{display:block;font-weight:600;color:var(--ink-soft);font-size:12px;margin-top:3px}
.hint.gone{opacity:0}

.cross{position:absolute;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:2.5px solid var(--white);box-shadow:0 0 0 1.5px rgba(53,47,69,.45),inset 0 0 0 1.5px rgba(53,47,69,.45);transition:width .08s,height .08s,margin .08s,opacity .2s}
.cross::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--white);box-shadow:0 0 0 1.5px rgba(53,47,69,.45)}
.cross.kick{width:48px;height:48px;margin:-24px 0 0 -24px}
.cross.off{opacity:0}

#floaters{position:absolute;inset:0;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:22px;color:var(--white);text-shadow:0 2px 0 rgba(53,47,69,.3);white-space:nowrap;animation:floatUp 1s ease-out forwards}
.fl.kr{color:#ffe08a;font-size:20px}
.fl.gold{color:var(--gold);font-size:30px}
.fl.bad{color:#ffd2cc;font-size:20px}
.fl.pop{font-size:18px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

.areaBtn{pointer-events:auto;display:flex;align-items:baseline;gap:8px;border:0;cursor:pointer;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 6px 6px 12px;border-radius:999px;font:800 14px var(--ui);color:var(--ink);box-shadow:0 2px 10px rgba(53,47,69,.12)}
.areaBtn span{font-size:12px;font-weight:700;color:var(--ink-soft)}
.areaBtn .go{background:var(--blue);color:var(--white);padding:3px 9px;border-radius:99px;font-size:11px;letter-spacing:.06em}
.areaBtn.ready .go{background:var(--accent);animation:ready 1s ease-in-out infinite alternate}
@keyframes ready{to{transform:scale(1.08)}}
.next{display:flex;flex-direction:column;gap:3px;padding:0 4px;font-size:11.5px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.next i{display:block;width:190px;height:6px;border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden}
.next em{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .3s}
.next.ready em{background:var(--accent)}
.fl.white{color:#ffffff;font-size:30px;text-shadow:0 0 14px #9fc3ff,0 2px 0 rgba(53,47,69,.35)}
.arrive{position:absolute;left:50%;top:20%;transform:translateX(-50%);text-align:center;color:var(--white);text-shadow:0 3px 0 rgba(53,47,69,.25),0 6px 24px rgba(53,47,69,.3);animation:frenzyIn .6s cubic-bezier(.2,1.4,.4,1) both, frenzyOut .5s ease-in 2.2s forwards;white-space:nowrap}
.arrive b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,80px);line-height:1}
.arrive span{font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
#fade{position:fixed;inset:0;background:var(--mist);opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(53,47,69,.35);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .sheet{width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--paper-solid);border-radius:20px;box-shadow:0 20px 60px rgba(53,47,69,.35)}
.modal header{display:flex;align-items:baseline;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper-solid)}
.modal h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px}
.modal .sub{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em}
.modal .x{margin-left:auto;border:0;background:transparent;font-size:28px;line-height:1;cursor:pointer;color:var(--ink)}
#areas{display:flex;flex-direction:column;padding:8px 10px}
.area{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 10px;border-radius:14px}
.area+.area{border-top:1px solid var(--line)}
.area .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--white);color:var(--blue);box-shadow:inset 0 0 0 1px var(--line)}
.area.here{background:rgba(44,85,151,.08)}
.area.here .n{background:var(--blue);color:var(--white)}
.area.locked{opacity:.55}
.area .t{min-width:0}
.area .t b{font-size:16px;font-weight:800}
.area .t small{display:block;font-size:12px;color:var(--ink-soft);font-weight:700}
.area .t p{margin:3px 0 0;font-size:12.5px;line-height:1.35}
.area .t .mul{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;color:var(--blue);background:rgba(44,85,151,.1);padding:2px 7px;border-radius:99px}
.area button{border:0;border-radius:10px;padding:9px 12px;min-width:96px;font:800 13px var(--ui);background:var(--accent);color:var(--accent-ink);cursor:pointer;font-variant-numeric:tabular-nums}
.area button.go2{background:var(--blue)}
.area button:disabled{background:rgba(53,47,69,.12);color:var(--ink-soft);cursor:default}
.goal{margin:4px 20px 18px;padding:12px 14px;border-radius:14px;background:rgba(240,178,58,.18);font-size:13px;font-weight:700}
.goal i{display:block;height:8px;margin-top:8px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}
.goal em{display:block;height:100%;background:var(--gold)}
.win{text-align:center;padding:28px 24px 24px}
.win h2{font-size:40px}
.win p{font-size:15px;line-height:1.5;margin:10px auto 18px;max-width:40ch}
.win button{border:0;border-radius:12px;padding:12px 22px;font:400 20px var(--display);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.trophy{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff,#e9eef7 55%,#b9c7de);box-shadow:0 0 0 6px rgba(255,255,255,.7),0 8px 24px rgba(44,85,151,.3)}
/* Shop */
#shop{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:310px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--paper);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;box-shadow:0 8px 30px rgba(53,47,69,.18);overflow:hidden}
#shop header{display:flex;align-items:baseline;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#shop h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink);letter-spacing:.01em}
#shop .sub{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em}
#shopClose{margin-left:auto;display:none;border:0;background:transparent;font-size:26px;line-height:1;color:var(--ink);cursor:pointer;padding:0 4px}
#upgrades{overflow-y:auto;padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px}
.up{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px}
.up:hover{background:rgba(255,255,255,.55)}
.up .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--white);color:var(--blue);box-shadow:inset 0 0 0 1px var(--line)}
.up .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.up .tx{min-width:0}
.up .nm{font-weight:800;font-size:14px;display:flex;gap:6px;align-items:baseline}
.up .nm em{font-style:normal;font-size:11px;font-weight:800;color:var(--blue);background:rgba(44,85,151,.1);padding:1px 6px;border-radius:99px}
.up .en{font-size:11.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .ef{font-size:11.5px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.up button{border:0;border-radius:10px;padding:8px 10px;min-width:74px;font:800 13px var(--ui);font-variant-numeric:tabular-nums;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .08s,filter .15s}
.up button:hover{filter:brightness(1.07)}
.up button:active{transform:translateY(1px)}
.up button:disabled{background:rgba(53,47,69,.12);color:var(--ink-soft);box-shadow:none;cursor:default}
.up button.max{background:var(--gold);color:var(--ink)}
.up.flash{animation:rowflash .4s}
@keyframes rowflash{0%{background:rgba(240,178,58,.5)}}
#shop footer{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
#shop footer button{flex:1;border:0;border-radius:9px;padding:7px 8px;font:700 12px var(--ui);background:rgba(53,47,69,.08);color:var(--ink);cursor:pointer}
#shop footer button:hover{background:rgba(53,47,69,.14)}
#shop footer button.warn{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#shopOpen{display:none;position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;padding:12px 18px;font:400 20px var(--display);background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(53,47,69,.25);cursor:pointer}
#shopOpen .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle;box-shadow:0 0 0 2px var(--white)}

@media (max-width:760px){
  .next i{width:150px}
  .area{grid-template-columns:34px minmax(0,1fr);}
  .area button{grid-column:2;justify-self:start}
  #shop{top:auto;bottom:0;left:0;right:0;width:auto;max-height:58%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .25s ease}
  #shop.open{transform:none}
  #shopClose{display:block}
  #shopOpen{display:block}
  .counter{bottom:calc(16% + env(safe-area-inset-bottom,0px))}
  .money{font-size:17px}
  .combo b{font-size:32px}
}
@media (prefers-reduced-motion:reduce){
  .fl,.frenzy,body.in-frenzy #hud::before{animation-duration:.01s}
}
/* Sheep Season additions: flock call button replaces the shell belt */
.call{position:absolute;left:50%;bottom:calc(4.5% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:auto;border:0;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:6px 8px 6px 14px;min-height:40px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 2px 10px rgba(53,47,69,.14);font:800 13px var(--ui);color:var(--ink)}
.call .ctx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.call .ctx small{font-size:10.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.call .cbar{position:relative;width:90px;height:22px;border-radius:99px;background:rgba(53,47,69,.12);overflow:hidden}
.call .cbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue);border-radius:99px}
.call.ready .cbar i{background:var(--accent);width:100%!important}
.call.ready{animation:ready 1s ease-in-out infinite alternate}
.call.ready .cbar::after{content:"HOY!";position:absolute;inset:0;display:grid;place-items:center;color:var(--white);font:400 13px var(--display);letter-spacing:.08em}
.call.active .cbar i{background:var(--gold)}
.lang{pointer-events:auto;display:inline-flex;padding:3px;border-radius:999px;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(53,47,69,.12)}
.lang button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font:800 12px var(--ui);letter-spacing:.08em;color:var(--ink-soft);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--white)}
@media (min-width:761px){#shopClose{display:block}body.shop-closed #shop{display:none}body.shop-closed #shopOpen{display:block}}
@media (max-width:760px){.call{bottom:calc(4.5% + env(safe-area-inset-bottom,0px) + 4px)}}
</style>

<canvas id="game" tabindex="0" aria-label="Sheep roundup on a Faroese hillside. Click or tap behind the sheep to whistle, hold and drag to steer a dog, Space for the flock call."></canvas>
<div id="hud">
  <div class="topleft">
    <div class="money"><span class="coin"></span><b id="money">0</b><small>kr</small></div>
    <div class="rate" id="rate">0 kr/min</div>
    <button id="areaBtn" class="areaBtn" type="button"><b id="areaName">Kirkjubøur</b><span id="areaDate">20 September</span><span class="go" data-t="map">Map</span></button>
    <div class="lang" role="group" aria-label="Language"><button type="button" id="langEn" data-lang="en" aria-pressed="true">EN</button><button type="button" id="langFo" data-lang="fo" aria-pressed="false">FO</button></div>
    <div class="next" id="next"><span id="nextLbl"></span><i><em id="nextBar"></em></i></div>
  </div>
  <div id="combo" class="combo" hidden><b id="comboN">x2</b><div class="bar"><i id="comboBar"></i></div><div class="lbl" id="comboLbl">FRENZY</div></div>
  <div id="frenzyWrap"></div>
  <button id="call" class="call" type="button" aria-label="Flock call"><span class="ctx"><b data-t="call">Flock call</b><small id="callSub">Space</small></span><span class="cbar"><i id="callBar"></i></span></button>
  <div class="counter" id="counter"><b id="count">0</b><span data-t="sheepN">sheep</span></div>
  <div id="hint" class="hint"><span data-t="hint1">Click or tap behind the sheep to whistle</span><small data-t="hint2">The dogs drive them down into the rætt · hold and drag to steer a dog · Space for the flock call</small></div>
  <div id="floaters"></div>
  <div id="cross" class="cross off"></div>
</div>
<aside id="shop" aria-label="Upgrades">
  <header><h2 data-t="shop">Shop</h2><span class="sub" data-t="upgrades">Upgrades</span><button id="shopClose" aria-label="Close shop">×</button></header>
  <div id="upgrades"></div>
  <footer><button id="sound">Sound: on</button><button id="reset">Start over</button></footer>
</aside>

    const dx=s.tx-s.x,dz=s.tz-s.z,dd=Math.hypot(dx,dz);
    if(dd>0.4){const sp=s.leaving?1.05:0.5;wx=dx/dd*sp;wz=dz/dd*sp;}
    else{s.wait-=dt;if(s.wait<=0){s.wait=rand(1.5,5);s.tx=clamp(s.x+rand(-4,4),FX0,FX1);s.tz=clamp(s.z+rand(-3,3),FZ0,FZ1);}}
    const calm=1-Math.min(1,fear*1.6);
    let vx=wx*calm+fx*FLEE_SP+ax*1.8+sx*3,vz=wz*calm+fz*FLEE_SP+az*1.8+sz*3;
    if(cn){const k=0.12*(0.25+fear);vx+=clamp((cx/cn-s.x)*k,-1,1);vz+=clamp((cz/cn-s.z)*k,-1,1);}
    const vl=Math.hypot(vx,vz);if(vl>MAX_SP){vx*=MAX_SP/vl;vz*=MAX_SP/vl;}
    const blend=1-Math.exp(-5*dt);s.vx+=(vx-s.vx)*blend;s.vz+=(vz-s.vz)*blend;
    s.x+=s.vx*dt;s.z+=s.vz*dt;s.fear=fear;
    // stone wall of the rætt
    const ddx=s.x-PEN.x,ddz=s.z-PEN.z,dp=Math.hypot(ddx,ddz);
    if(dp<PEN.r+0.5){
      if(inGate(s.x,s.z)){if(dp<PEN.r-0.7){penSheep(s);continue;}}
      else if(dp>PEN.r-1){const nx=ddx/dp,nz=ddz/dp;s.x=PEN.x+nx*(PEN.r+0.5);s.z=PEN.z+nz*(PEN.r+0.5);const vn=s.vx*nx+s.vz*nz;if(vn<0){s.vx-=vn*nx;s.vz-=vn*nz;}}
      else{penSheep(s);continue;}
    }
    if(s.z>3){s.z=3;if(s.vz>0)s.vz=0;}
    if(s.x<-21||s.x>17.5||s.z<-45||groundY(s.x,s.z)<SEA_Y+0.2){escapeSheep(s);continue;}
    if(s.ram&&Math.random()<dt*5)burst(s.x+rand(-0.3,0.3),groundY(s.x,s.z)+1.2,s.z+rand(-0.3,0.3),FXM.star,1,0.3,0.05,1,0.6,0.5);
    if(fear>0.5&&Math.random()<dt*0.25)sfxBaa();
    animSheep(s,dt);
  }
  // in the rætt
  for(const s of sheep){
    if(s.state==='penned'){
      s.penT+=dt;
      const dx=s.tx-s.x,dz=s.tz-s.z,dd=Math.hypot(dx,dz);
      if(dd>0.25){const st=Math.min(dd,(s.penT<1?2:0.6)*dt);s.vx=dx/dd*st/dt;s.vz=dz/dd*st/dt;s.x+=dx/dd*st;s.z+=dz/dd*st;}else{s.vx=s.vz=0;s.wait-=dt;if(s.wait<=0){s.wait=rand(2,5);const a=rand(0,2*PI),r=rand(0,PEN.r-1.1);s.tx=PEN.x+Math.cos(a)*r;s.tz=PEN.z+Math.sin(a)*r+0.4;}}
      if(s.penT>11)retire(s);
      animSheep(s,dt);
    }else if(s.state==='gone'){
      s.shrink-=dt*3;s.g.scale.setScalar(Math.max(0.01,s.sz*s.shrink));if(s.shrink<=0)despawn(s);
    }
  }
}
function animSheep(s,dt){
  const sp=Math.hypot(s.vx,s.vz);const moving=sp>0.15;
  if(moving){s.yaw=lerpAngle(s.yaw,Math.atan2(s.vx,s.vz),1-Math.exp(-7*dt));s.phase+=dt*(2+sp*3.2);}
  const sw=moving?Math.sin(s.phase)*Math.min(0.7,0.25+sp*0.15):0;s.legs[0].rotation.x=s.legs[3].rotation.x=sw;s.legs[1].rotation.x=s.legs[2].rotation.x=-sw;
  s.pv.position.y=moving?Math.abs(Math.sin(s.phase))*0.1*Math.min(1,sp/2.5):0;
  const graze=!moving&&Math.sin(performance.now()*0.0007+s.x*3)>-0.2;s.head.rotation.x+=((graze?0.7:0)-s.head.rotation.x)*(1-Math.exp(-4*dt));
  s.g.position.set(s.x,groundY(s.x,s.z),s.z);s.g.rotation.y=s.yaw;
}

/* ---------------- camera rig ---------------- */
const CAM={x:0.6,z:9.5,h:5.4};
const baseQ=new THREE.Quaternion();
function placeCamera(){const y=groundY(CAM.x,CAM.z)+CAM.h;camera.position.set(CAM.x,y,CAM.z);camera.lookAt(-0.5,groundY(0,-20)-0.4,-20);baseQ.copy(camera.quaternion);}
function resize(){W=innerWidth;Hh=innerHeight;renderer.setSize(W,Hh,false);camera.aspect=W/Hh;camera.fov=camera.aspect<0.8?76:(camera.aspect<1.2?64:55);camera.updateProjectionMatrix();placeCamera();}
addEventListener('resize',resize);

/* ---------------- input ---------------- */
const cross=$('#cross');
function setAim(e){aimX=e.clientX;aimY=e.clientY;}
canvas.addEventListener('pointerdown',e=>{if(e.button===2||traveling){holding=false;return;}initAudio();if(actx&&actx.state==='suspended')actx.resume();setAim(e);touchMode=e.pointerType!=='mouse';holding=true;crossT=0.6;whistle();try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){touchMode=false;mouseOver=e.target===canvas;}if(e.target===canvas||holding)setAim(e);});
function release(){holding=false;holdDog=null;}
addEventListener('pointerup',release);addEventListener('pointercancel',release);
canvas.addEventListener('pointerleave',()=>{mouseOver=false;});
addEventListener('blur',release);
canvas.addEventListener('contextmenu',e=>{e.preventDefault();flockCall();});
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!(e.target&&e.target.tagName==='BUTTON')){e.preventDefault();flockCall();}});
let hintGone=false;function hideHint(){if(hintGone)return;hintGone=true;$('#hint').classList.add('gone');setTimeout(()=>$('#hint').hidden=true,700);}

/* ---------------- shop UI ---------------- */
const upEl=$('#upgrades');const rows={};
UP.forEach(u=>{const r=document.createElement('div');r.className='up';r.innerHTML=`<div class="ic"><svg viewBox="0 0 24 24">${ICON[u.icon]}</svg></div><div class="tx"><div class="nm"><span></span> <em></em></div><div class="en"></div><div class="ef"></div></div><button type="button" id="buy-${u.id}"></button>`;upEl.appendChild(r);const b=r.querySelector('button');b.addEventListener('click',()=>buy(u,r));rows[u.id]={r,b,nm:r.querySelector('.nm span'),en:r.querySelector('.en'),lv:r.querySelector('em'),ef:r.querySelector('.ef'),last:''};});
function buy(u,r){initAudio();const l=S.lv[u.id];if(l>=u.max)return;const c=cost(u);if(S.money<c)return;S.money-=c;S.lv[u.id]++;sfxBuy();r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash');applyCounts();dirty=true;save();}
let dirty=true;
function renderShop(){let any=false;for(const u of UP){const o=rows[u.id],l=S.lv[u.id],mx=l>=u.max,c=cost(u);if(!mx&&S.money>=c)any=true;const key=l+'|'+(mx?'m':(S.money>=c?'y':'n'))+'|'+c+'|'+S.area+'|'+S.lang;if(o.last===key&&!dirty)continue;o.last=key;const fo=S.lang==='fo'&&UPFO[u.id];o.nm.textContent=fo?fo[0]:u.name;o.en.textContent=fo?fo[1]:u.en;o.lv.textContent=l?(tr('lvl')+l):tr('isNew');o.ef.textContent=mx?tr('maxed'):u.ef(l);if(mx){o.b.textContent=tr('max');o.b.disabled=true;o.b.classList.add('max');}else{o.b.textContent=fmt(c)+' kr';o.b.disabled=S.money<c;o.b.classList.remove('max');}}
  $('#shopDot').hidden=!any;}
function applyCounts(){dogs.forEach((d,i)=>{const on=i<1+S.lv.dogs;if(on&&!d.on){d.on=true;d.g.visible=true;d.appear=0;burst(d.x,groundY(d.x,d.z)+0.6,d.z,FXM.smoke,10,2,0.2,1.5,0.6,0);}else if(!on&&d.on){d.on=false;d.g.visible=false;if(d.target&&d.target.claim===d.i)d.target.claim=-1;d.target=null;}});}
function setShop(open){$('#shop').classList.toggle('open',open);S.shopClosed=!open;document.body.classList.toggle('shop-closed',!open);save();}
$('#shopOpen').addEventListener('click',()=>setShop(true));
$('#shopClose').addEventListener('click',()=>setShop(false));
const soundBtn=$('#sound');function syncSound(){soundBtn.textContent=S.sound?tr('soundOn'):tr('soundOff');if(master)master.gain.value=S.sound?0.6:0;}
soundBtn.addEventListener('click',()=>{initAudio();S.sound=!S.sound;syncSound();save();});
let resetArm=0;const resetBtn=$('#reset');
resetBtn.addEventListener('click',()=>{if(performance.now()-resetArm<3000){S.money=0;S.count=0;S.lost=0;S.whistles=0;for(const k in S.lv)S.lv[k]=0;S.won=false;S.unlocked=0;callCdT=0;combo=0;frenzyCharge=0;
  if(S.area!==0){S.area=0;buildArea(AREAS[0]);placeHelpers();placeCamera();placeGateGlow();applyAreaHUD();}
  clearField();applyCounts();seedFlocks();save();resetBtn.textContent=tr('reset');resetBtn.classList.remove('warn');resetArm=0;dirty=true;}
  else{resetArm=performance.now();resetBtn.textContent=tr('confirm');resetBtn.classList.add('warn');setTimeout(()=>{if(performance.now()-resetArm>=2900){resetBtn.textContent=tr('reset');resetBtn.classList.remove('warn');}},3000);}});

/* ---------------- HUD ---------------- */
const moneyEl=$('#money'),countEl=$('#count'),rateEl=$('#rate'),comboEl=$('#combo'),comboN=$('#comboN'),comboBar=$('#comboBar'),comboLbl=$('#comboLbl');
const callEl=$('#call'),callBar=$('#callBar'),callSub=$('#callSub');
let shownMoney=0,hudT=0;
function updateHUD(dt){
  shownMoney+=(S.money-shownMoney)*(1-Math.exp(-10*dt));if(Math.abs(S.money-shownMoney)<0.5)shownMoney=S.money;
  moneyEl.textContent=fmt(shownMoney);countEl.textContent=fmt(S.count);
  hudT-=dt;if(hudT<=0){hudT=0.25;const now=performance.now();while(deliveries.length&&now-deliveries[0][0]>60000)deliveries.shift();const sum=deliveries.reduce((a,b)=>a+b[1],0);const span=deliveries.length?Math.max(10,(now-deliveries[0][0])/1000):60;rateEl.textContent='≈ '+fmt(sum*60/span)+' '+tr('perMin')+(S.lost?' · '+fmt(S.lost)+' '+tr('away'):'');renderShop();renderNext();dirty=false;}
  if(frenzyT>0){comboEl.hidden=false;comboN.textContent='x'+combo;comboBar.style.width=(frenzyT/FRENZY_LEN*100)+'%';comboLbl.textContent=tr('frenzyOn')+Math.ceil(frenzyT)+' s';}
  else if(combo>=2){comboEl.hidden=false;comboN.textContent='x'+combo;comboBar.style.width=(frenzyCharge/FRENZY_AT*100)+'%';comboLbl.textContent=tr('frenzy')+' '+frenzyCharge+'/'+FRENZY_AT;}
  else comboEl.hidden=true;
  const cd=callCD(S.lv.call);callEl.classList.toggle('ready',callCdT<=0&&callT<=0);callEl.classList.toggle('active',callT>0);
  callBar.style.width=(callT>0?100:(1-callCdT/cd)*100)+'%';callSub.textContent=callT>0?tr('comeBy'):(callCdT>0?Math.ceil(callCdT)+' s':(touchMode?tr('tap'):tr('space')));
  cross.style.transform=`translate(${aimX}px,${aimY}px)`;
  const showCross=touchMode?crossT>0:mouseOver;cross.classList.toggle('off',!showCross||holding);
}
callEl.addEventListener('click',e=>{e.stopPropagation();flockCall();});
callEl.addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------------- roundup map ---------------- */
const mapWrap=$('#mapWrap'),areasEl=$('#areas'),goalEl=$('#goal'),fadeEl=$('#fade');
let traveling=false,mapOpen=false;
function applyAreaHUD(){$('#areaName').textContent=A().name;$('#areaDate').textContent=AF(A()).date;}
let areasKey='';
function renderAreas(force){
  const nx=AREAS[S.unlocked+1];const key=S.area+'|'+S.unlocked+'|'+(nx&&S.money>=nx.cost)+'|'+S.lang;
  if(force||key!==areasKey){areasKey=key;areasEl.innerHTML=AREAS.map((a,i)=>{const here=i===S.area,open=i<=S.unlocked,nextUp=i===S.unlocked+1;
    let btn;if(here)btn=`<button type="button" class="go2" disabled>${tr('here')}</button>`;else if(open)btn=`<button type="button" class="go2" data-go="${i}">${tr('go')}</button>`;else if(nextUp)btn=`<button type="button" data-unlock="${i}" ${S.money<a.cost?'disabled':''}>${tr('unlock')} · ${fmt(a.cost)} kr</button>`;else btn=`<button type="button" disabled>${tr('locked')}</button>`;const af=AF(a);
    return `<div class="area${here?' here':''}${!open&&!nextUp?' locked':''}"><div class="n">${i+1}</div><div class="t"><b>${a.name}</b><small>${af.field} · ${af.date}</small><p>${af.fact}</p><span class="mul">×${a.value} ${tr('perSheep')} · ×${a.spawn} ${tr('flocks')}</span></div>${btn}</div>`;}).join('');}
  if(S.unlocked>=AREAS.length-1){const f=Math.min(1,S.money/WIN_AT);goalEl.innerHTML=S.won?tr('goalWon')(fmt(S.count)):`${tr('goalRec')(fmt(WIN_AT))}<i><em style="width:${f*100}%"></em></i>`;}
  else goalEl.textContent=tr('goalOpen');
}
areasEl.addEventListener('click',e=>{const g=e.target.closest('[data-go]'),u=e.target.closest('[data-unlock]');
  if(g)travel(+g.dataset.go);
  if(u){const i=+u.dataset.unlock,a=AREAS[i];if(S.money<a.cost||i!==S.unlocked+1)return;S.money-=a.cost;S.unlocked=i;sfxBuy();save();travel(i);}});
function openMap(){initAudio();mapOpen=true;release();renderAreas(true);mapWrap.hidden=false;}
function closeMap(){mapOpen=false;mapWrap.hidden=true;}
$('#areaBtn').addEventListener('click',openMap);$('#mapClose').addEventListener('click',closeMap);
mapWrap.addEventListener('pointerdown',e=>{if(e.target===mapWrap)closeMap();});
addEventListener('keydown',e=>{if(e.key==='Escape'){closeMap();$('#winWrap').hidden=true;}});
function clearField(){sheep.forEach(s=>{if(s.state!=='off')despawn(s);});dogs.forEach(d=>{d.target=null;d.cmdT=0;d.x=d.hx;d.z=d.hz;});push.k=0;callT=0;}
function seedFlocks(){for(let i=0;i<2;i++)spawnFlock();sheep.forEach(s=>{if(s.state==='field'){s.emerge=1;s.g.scale.setScalar(s.sz);s.g.position.set(s.x,groundY(s.x,s.z),s.z);}});}
function travel(i){if(traveling||i===S.area||i>S.unlocked)return;traveling=true;closeMap();release();fadeEl.classList.add('on');
  setTimeout(()=>{clearField();S.area=i;buildArea(AREAS[i]);placeHelpers();placeCamera();placeGateGlow();applyAreaHUD();spawnAcc=0;seedFlocks();save();dirty=true;
    setTimeout(()=>{fadeEl.classList.remove('on');traveling=false;const w=$('#frenzyWrap');w.innerHTML=`<div class="arrive"><b>${AREAS[i].name}</b><span>${AF(AREAS[i]).field} · ${AF(AREAS[i]).date}</span></div>`;setTimeout(()=>{w.innerHTML='';},2900);},120);},380);}
const nextEl=$('#next'),nextLbl=$('#nextLbl'),nextBar=$('#nextBar'),areaBtn=$('#areaBtn');
function renderNext(){let f,ready=false;
  if(S.unlocked<AREAS.length-1){const a=AREAS[S.unlocked+1];f=S.money/a.cost;ready=f>=1;nextLbl.textContent=ready?tr('ready')(a.name):`${tr('next')(a.name)} · ${fmt(S.money)} / ${fmt(a.cost)} kr`;}
  else if(!S.won){f=S.money/WIN_AT;nextLbl.textContent=`${tr('record')} · ${fmt(S.money)} / ${fmt(WIN_AT)} kr`;}
  else{f=1;nextLbl.textContent=tr('champ');}
  nextBar.style.width=Math.min(100,f*100)+'%';nextEl.classList.toggle('ready',ready);areaBtn.classList.toggle('ready',ready);
  if(S.unlocked>=AREAS.length-1&&!S.won&&S.money>=WIN_AT){S.won=true;save();release();$('#winText').textContent=tr('win')(fmt(S.count),fmt(S.lost));$('#winWrap').hidden=false;}
  if(mapOpen)renderAreas();}
$('#winClose').addEventListener('click',()=>{$('#winWrap').hidden=true;});

/* ---------------- language ---------------- */
function applyLang(){document.documentElement.lang=S.lang;document.querySelectorAll('[data-t]').forEach(el=>{const v=tr(el.dataset.t);if(typeof v==='string')el.textContent=v;});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang)));
  syncSound();if(!resetArm)resetBtn.textContent=tr('reset');applyAreaHUD();dirty=true;renderShop();renderNext();if(mapOpen)renderAreas(true);}
document.querySelectorAll('.lang button').forEach(b=>{b.addEventListener('pointerdown',e=>e.stopPropagation());b.addEventListener('click',e=>{e.stopPropagation();S.lang=b.dataset.lang;applyLang();save();});});

/* ---------------- main loop ---------------- */
let spawnAcc=0.5,last=performance.now(),saveT=0;
const qSway=new THREE.Quaternion(),eul=new THREE.Euler();
function frame(now){
  const dt=clamp((now-last)/1000,0.001,0.05);last=now;const t=now*0.001;
  const ax=aimX/W-0.5,ay=aimY/Hh-0.5;eul.set(-ay*0.04,-ax*0.07,0,'YXZ');qSway.setFromEuler(eul);camera.quaternion.copy(baseQ).multiply(qSway);camera.updateMatrixWorld();
  // whistle held: the push follows the pointer and so does the dog
  if(holding&&!traveling){const p=groundAtAim();if(p){push.x+=(p.x-push.x)*(1-Math.exp(-20*dt));push.z+=(p.z-push.z)*(1-Math.exp(-20*dt));push.k=1;push.r=whistleR(S.lv.whistle);if(holdDog){holdDog.cmdX=p.x;holdDog.cmdZ=p.z;holdDog.cmdT=Math.max(holdDog.cmdT,1.2);}}}
  else push.k*=Math.exp(-7*dt);
  if(push.k>0.03){aimRing.visible=true;aimRing.position.set(push.x,groundY(push.x,push.z)+0.14,push.z);aimRing.scale.setScalar(push.r);aimRing.material.opacity=0.45*push.k;}else aimRing.visible=false;
  crossT-=dt;
  if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;if(frenzyT<=0)frenzyCharge=Math.floor(frenzyCharge*0.5);}}
  if(frenzyT>0){frenzyT-=dt;if(frenzyT<=0)document.body.classList.remove('in-frenzy');}
  if(callT>0)callT-=dt;else if(callCdT>0)callCdT-=dt;
  gateGlow.scale.setScalar(PEN.r+gateR(S.lv.gate)+(frenzyT>0?2:0));gateGlow.material.opacity=(callT>0||frenzyT>0?0.55:0.18)+Math.sin(t*3)*0.06;
  spawnAcc+=dt*fpm(S.lv.spawn)*A().spawn/60*(frenzyT>0?2.5:1);while(spawnAcc>=1){spawnAcc-=1;spawnFlock();}
  updateSheep(dt);
  for(const d of dogs)updateDog(d,dt);
  updateHelpers(dt,t);updateParts(dt);updateRings(dt);
  for(const c of clouds){c.position.x+=dt*1.6;if(c.position.x>200)c.position.x=-200;}
  for(const g of gulls){const u=g.userData;u.a+=dt*u.sp;g.position.set(u.cx+Math.cos(u.a)*u.r,u.y+Math.sin(u.a*3)*1.5,u.cz+Math.sin(u.a)*u.r);g.rotation.y=-u.a+(u.sp>0?PI:0);const f=Math.sin(t*u.f)*0.5;u.wl.rotation.z=f;u.wr.rotation.z=-f;}
  updateHUD(dt);
  saveT+=dt;if(saveT>4){saveT=0;save();}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function start(data){
  load(data&&data.S);S.area=clamp(S.area,0,AREAS.length-1);S.unlocked=clamp(Math.max(S.unlocked,S.area),0,AREAS.length-1);if(S.area!==0)buildArea(AREAS[S.area]);placeHelpers();placeGateGlow();applyAreaHUD();syncSound();resize();applyCounts();
  if(S.whistles>0)hideHint();
  if(S.shopClosed&&innerWidth>760)document.body.classList.add('shop-closed');
  applyLang();seedFlocks();
  requestAnimationFrame(t=>{last=t;frame(t);});
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S:JSON.parse(JSON.stringify(S))}));}catch(e){}
addEventListener('pagehide',save);
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>

</body></html>
