<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cozy Faroese Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;700;800&display=swap">
<style>
  /* Look shared with Hare Season: pastel Faroese palette, floating pill HUD, Bagel Fat One + Figtree.
     (Fonts load from Google Fonts when online; the game falls back to system fonts offline.) */
  :root {
    --ink: #352f45; --ink-soft: #6c6580;
    --paper: rgba(251,249,253,.84); --paper-solid: #f7f4fa;
    --line: rgba(53,47,69,.12);
    --accent: #d9493a; --accent-ink: #fff;   /* Merkið red */
    --blue: #2c5597;                          /* Merkið blue */
    --gold: #f0b23a; --mist: #dcd5e6; --white: #fff;
    --turf: #8ea56a; --turf-dark: #6f8a55;
    --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    --top-h: 0px;
    --radius: 14px;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--mist); }
  body { font-family: var(--ui); color: var(--ink); user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  #fx { pointer-events: none; z-index: 30; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* ---------- floating HUD (top-left column) ---------- */
  #topbar { position: fixed; top: calc(14px + env(safe-area-inset-top,0px)); left: calc(14px + env(safe-area-inset-left,0px)); z-index: 20; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; }
  #title { display: none; }
  #resources { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  #resources .small { display: flex; gap: 6px; flex-wrap: wrap; }
  .res { display: flex; align-items: center; gap: 7px; background: var(--paper); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 4px 12px 4px 5px; border-radius: 999px; box-shadow: 0 2px 10px rgba(53,47,69,.12); transition: transform .12s ease; }
  .res .ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: var(--white); box-shadow: inset 0 0 0 1px var(--line); flex: none; }
  .res .lbl { font-size: 10px; font-weight: 800; color: var(--ink-soft); line-height: 1; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
  .res .val { font-size: 14px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .res.bump { transform: scale(1.08); }
  .res.full .val { color: var(--accent); }
  /* money pill, as in Hare Season */
  #res-money { padding: 7px 14px 7px 8px; gap: 8px; }
  #res-money .ico { width: 24px; height: 24px; font-size: 0; background: radial-gradient(circle at 35% 35%, #ffe7a3, var(--gold) 60%, #c98a1c); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
  #res-money .lbl { display: none; }
  #res-money .val { font-size: 20px; }
  #savedot { font-size: 11px; font-weight: 800; color: var(--ink); background: var(--paper); padding: 3px 10px; border-radius: 999px; opacity: 0; transition: opacity .4s; }
  #savedot.show { opacity: 1; }

  /* big carried-hay counter, bottom centre */
  #counter { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom,0px)); transform: translateX(-50%); z-index: 20; pointer-events: none;
    font-family: var(--display); color: var(--white); font-size: clamp(36px, 5.5vw, 64px); line-height: 1; white-space: nowrap;
    text-shadow: 0 3px 0 rgba(53,47,69,.2), 0 6px 24px rgba(53,47,69,.28); display: flex; gap: .22em; align-items: baseline; font-variant-numeric: tabular-nums; }
  #counter span { font-size: .55em; }
  #counter.full b { color: #ffd2cc; }
  #counter.bump b { display: inline-block; animation: bump .18s ease-out; }
  @keyframes bump { 50% { transform: scale(1.12); } }

  /* Menu pill, bottom-left */
  #menubtn { position: fixed; left: calc(14px + env(safe-area-inset-left,0px)); bottom: calc(14px + env(safe-area-inset-bottom,0px)); z-index: 25; pointer-events: auto;
    border: 0; border-radius: 999px; padding: 11px 20px; font: 400 19px var(--display); background: var(--blue); color: var(--white); box-shadow: 0 4px 14px rgba(53,47,69,.25); cursor: pointer; }
  #menubtn:hover { filter: brightness(1.08); }

  /* ---------- farmhouse / menu window (Hare Season modal sheet) ---------- */
  #backdrop { position: fixed; inset: 0; background: rgba(53,47,69,.35); z-index: 35; display: none; }
  #panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(780px, 94vw); height: min(690px, calc(100vh - 28px));
    background: var(--paper-solid); border-radius: 20px; box-shadow: 0 20px 60px rgba(53,47,69,.35); overflow: hidden;
    display: none; flex-direction: column; z-index: 36; }
  body.open #panel { display: flex; } body.open #backdrop { display: block; }
  #phead { display: flex; align-items: baseline; gap: 10px; padding: 18px 20px 6px; }
  #ptitle { flex: 1; font-family: var(--display); font-size: 28px; line-height: 1.05; }
  #ptitle small { display: block; font-family: var(--ui); font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }
  #pclose { border: 0; background: transparent; font-size: 28px; line-height: 1; cursor: pointer; color: var(--ink); padding: 0 4px; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 14px 10px; border-bottom: 1px solid var(--line); }
  .tab { flex: 1 1 70px; border: none; background: transparent; border-radius: 12px; padding: 6px 2px 5px; font: 800 11.5px var(--ui); color: var(--ink-soft); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab .ti { font-size: 17px; line-height: 1; }
  .tab:hover { background: rgba(53,47,69,.06); color: var(--ink); }
  .tab.active { background: var(--blue); color: var(--white); }
  .tab.locked { opacity: .45; }
  #content { flex: 1; overflow-y: auto; padding: 14px 16px 24px; -webkit-overflow-scrolling: touch; }
  #content::-webkit-scrollbar { width: 8px; } #content::-webkit-scrollbar-thumb { background: rgba(53,47,69,.15); border-radius: 4px; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 4px 0 10px; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-soft); margin: 18px 0 8px; font-weight: 800; }
  .card { background: rgba(255,255,255,.7); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; box-shadow: inset 0 0 0 1px var(--line); }
  .card:hover { background: rgba(255,255,255,.95); }
  .card.locked { background: rgba(255,255,255,.35); }
  .card.locked .name, .card.locked .desc { color: var(--ink-soft); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-weight: 800; font-size: 14px; }
  .lvl { font-size: 11px; font-weight: 800; color: var(--blue); background: rgba(44,85,151,.1); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .desc { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin: 4px 0 8px; line-height: 1.45; }
  .effect { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .effect b { color: var(--blue); }
  .req { font-size: 12px; font-weight: 700; color: #a2702a; }
  button.buy, button.btn { font: 800 13px var(--ui); font-variant-numeric: tabular-nums; cursor: pointer; border-radius: 10px; padding: 8px 12px; min-width: 74px; border: 0;
    background: var(--accent); color: var(--accent-ink); white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.15); transition: transform .08s, filter .15s; }
  button.buy:hover:not(:disabled), button.btn:hover:not(:disabled) { filter: brightness(1.07); }
  button.buy:active:not(:disabled), button.btn:active:not(:disabled) { transform: translateY(1px); }
  button.buy:disabled, button.btn:disabled { background: rgba(53,47,69,.12); color: var(--ink-soft); box-shadow: none; cursor: default; }
  button.buy:disabled:not([data-need]) { background: var(--gold); color: var(--ink); } /* "Maxed" */
  button.btn.secondary { background: rgba(53,47,69,.08); color: var(--ink); box-shadow: none; }
  button.btn.danger { background: var(--accent); }
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line); border-radius: 12px; padding: 9px 10px; }
  .stat .k { font-size: 11px; font-weight: 700; color: var(--ink-soft); }
  .stat .v { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .equip { display: flex; gap: 12px; align-items: center; }
  .equip .big { font-size: 30px; width: 52px; height: 52px; display: grid; place-items: center; background: var(--white); box-shadow: inset 0 0 0 1px var(--line); border-radius: 13px; flex: none; }
  .hint { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.5; background: rgba(240,178,58,.18); border-radius: 14px; padding: 10px 12px; margin: 8px 0; }
  .keys b { display: inline-block; min-width: 20px; padding: 0 5px; border-radius: 5px; background: var(--white); box-shadow: inset 0 0 0 1px var(--line), 0 1px 0 var(--line); font-size: 11px; text-align: center; color: var(--ink); }
  .bar { height: 8px; background: rgba(255,255,255,.8); box-shadow: inset 0 0 0 1px var(--line); border-radius: 99px; overflow: hidden; margin-top: 7px; display: flex; }
  .bar i { display: block; height: 100%; }
  .slider { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; font-weight: 700; }
  .slider label { width: 90px; }
  .slider input[type=range] { flex: 1; accent-color: var(--blue); }
  .slider input[type=checkbox] { accent-color: var(--blue); width: 16px; height: 16px; }
  .slider .pct { width: 36px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .soon { text-align: center; padding: 26px 10px; color: var(--ink-soft); font-size: 13px; font-weight: 700; line-height: 1.5; }
  .soon .ti { font-size: 40px; display: block; margin-bottom: 8px; }
  .confirm { margin-top: 10px; padding: 10px; border-radius: 12px; background: rgba(217,73,58,.12); font-size: 13px; font-weight: 700; }
  .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .cardgrid .card { margin-bottom: 0; }

  /* ---------- action pill (like Hare Season's "Flock call") ---------- */
  #act { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom,0px)); transform: translateX(-50%); z-index: 25;
    border: 0; background: var(--paper); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 999px; padding: 6px 6px 6px 16px; min-height: 44px;
    display: none; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 2px 10px rgba(53,47,69,.16); font: 800 14px var(--ui); color: var(--ink); white-space: nowrap; }
  #act.show { display: flex; }
  #act .k { font: 400 15px var(--display); background: var(--accent); color: var(--white); border-radius: 999px; padding: 6px 14px; letter-spacing: .04em; }
  #act:active:not(:disabled) { transform: translateX(-50%) translateY(1px); }
  #act:disabled { cursor: default; color: var(--ink-soft); }
  #act:disabled .k { background: rgba(53,47,69,.15); color: var(--ink-soft); }

  #toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top,0px)); transform: translateX(-50%) translateY(-10px);
    background: var(--paper); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--ink); padding: 10px 18px; border-radius: 14px;
    font-weight: 800; font-size: 14px; box-shadow: 0 4px 20px rgba(53,47,69,.15); opacity: 0; transition: all .3s; z-index: 40; pointer-events: none; max-width: min(86vw, 520px); text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #audiohint { position: fixed; right: 14px; bottom: 14px; z-index: 25; font-size: 12px; font-weight: 800; background: var(--paper); padding: 6px 12px; border-radius: 999px; color: var(--ink-soft);
    box-shadow: 0 2px 10px rgba(53,47,69,.12); transition: opacity .5s; pointer-events: none; }
  @media (max-width: 640px) {
    #res-money .val { font-size: 17px; }
    .res .lbl { display: none; }
    #counter { bottom: calc(70px + env(safe-area-inset-bottom,0px)); }
    #menubtn { padding: 9px 15px; font-size: 16px; }
    #act { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { #counter.bump b { animation: none; } }
</style>

</head>
<body>
<canvas id="scene"></canvas>
<canvas id="fx"></canvas>

<div id="topbar">
  <div id="title"><div class="flag"><i class="v"></i><i class="h"></i></div><span class="t">Cozy Faroese Farm</span></div>
  <div id="resources"></div>
  <div id="savedot">✓ Saved</div>
</div>
<button id="menubtn" title="Farm info, statistics & settings">Farm</button>
<div id="counter"><b id="cnt">0</b><span id="cntunit">hay</span></div>

<div id="backdrop"></div>
<div id="panel">
  <div id="phead"><div id="ptitle"></div><button id="pclose" title="Close (Esc)">✕</button></div>
  <div id="tabs"></div>
  <div id="content"></div>
</div>

<button id="act"><span id="actlabel"></span><span class="k">E</span></button>
<div id="toast"></div>
<div id="audiohint">🔈 Click or tap to enable sound</div>

<script>
"use strict";
/* =====================================================================
   COZY FAROESE FARM — walkable farm edition
   A farmer walks around (keyboard / touch / mouse-hold). Standing in the
   meadow, the harvest ring at his feet fills; each full circle cuts grass
   into his basket. Barn = store & dry hay. Horse cart = carries hay to Tórshavn to sell.
   Systems: CONFIG · WORLD · RESOURCES · UPGRADES · STATE/SAVE · SOUND ·
            CAMERA · SCENERY · FIELD · PLAYER · HARVESTER · PLACES · FX ·
            INPUT · UI · LOOP
   ===================================================================== */

/* ----------------------------- CONFIG -------------------------------- */
const CONFIG = {
  baseCycleTime: 2.5,       // seconds per harvest action with bare hands
  baseYield: 1,             // hay per action on fully grown grass
  baseRegrowTime: 30 / Math.pow(0.84, 6), // ≈ 85 s; max Seaweed Fertiliser brings it to exactly 30 s       // seconds for cut grass to fully regrow
  baseSellPrice: 1,         // kr per fresh hay
  driedBonus: 1.5,          // dried barn hay sells for this × fresh price
  baseRunSpeed: 150,        // world units per second
  baseBasket: 10,           // hay the farmer can carry
  baseBarnCap: 50,          // hay the barn can hold
  baseDryRate: 0.5,         // hay per second that dries in the barn
  hayPerPatch: 0.27,        // hay from one fully grown patch of grass (cut early, you get less)
  cellW: 12, cellH: 10.2,   // grass grid cell size (fixed so the field can grow cell by cell)
  autosaveSeconds: 20,
  saveKey: "cozyFaroeseFarm.save.v2",
};

/* ------------------------------ WORLD -------------------------------- */
// Everything lives in fixed world units and is scaled to fit the screen.
// The world runs from x0 (west) to w (east) and from the sky down to h.
const WORLD = {
  x0: -720, w: 1400, h: 1320, horizon: 290, seaBot: 345,
  walk: { x0: -700, x1: 1382, y0: 378, y1: 1300 },
  // meadows: Bøur by the farmyard, and Heygarður (bought later) down the hill to the south-west.
  // Each grows right and down with its own "Expand" upgrade (levelId); unlock = upgrade that buys it.
  fields: [
    { id: "bour", name: "Bøur", x: 70, y: 432, w: 264, h: 173, levelId: "field", unlock: null },
    { id: "heygardur", name: "Heygarður", x: -640, y: 900, w: 264, h: 173, levelId: "field2", unlock: "buyfield2" },
  ],
  hub: { x: 700, y: 648 },     // farmyard crossroads south-west of the barn
  south: { x: 700, y: 848 },   // where the track down to Heygarður leaves the farmyard
  barn:  { x: 916, y: 585, door: { x: 916, y: 612 }, r: 72 },
  cart:  { park: { x: 1185, y: 590 }, r: 92, exitX: 1720 },
  station: { x: 880, y: 812, door: { x: 862, y: 838 }, r: 60 }, // research station (built later)
  shed:  { x: 250, y: 1012, door: { x: 250, y: 1036 }, r: 64 }, // Heygarður hay shed (bought later)
  house: { x: 1010, y: 482, door: { x: 1010, y: 508 }, r: 62 },
  start: { x: 430, y: 560 },
};

WORLD.field = WORLD.fields[0]; // the home meadow

// Drying racks (hesjur) stand in a 2 × 2 block on the left side of the barn.
const RACK_SLOTS = [{ x: 760, y: 530 }, { x: 696, y: 530 }, { x: 760, y: 458 }, { x: 696, y: 458 }];
const RACK_W = 56;
const rackCount = () => 1 + lvl("rackcount");
// The hay shed by Heygarður has its own little block of racks on its right side.
const SHED_RACKS = [{ x: 352, y: 1012 }, { x: 416, y: 1012 }, { x: 352, y: 944 }, { x: 416, y: 944 }];
const hasShed = () => lvl("shed") >= 1;
const shedRackCount = () => hasShed() ? 2 + lvl("shedracks") : 0;

// Solid footprints the farmer can't walk through (world units, at ground level).
// Footprints include the visible side walls and the ground behind each building,
// so the farmer can never slip out of sight behind a wall.
const OBSTACLES = [];
function rebuildObstacles() {
  const b = WORLD.barn;
  OBSTACLES.length = 0;
  OBSTACLES.push({ x0: b.x - 96, x1: b.x + 118, y0: 400, y1: 594 });   // barn
  OBSTACLES.push({ x0: 936, x1: 1106, y0: 400, y1: 490 });             // farmhouse
  for (let i = 0; i < rackCount(); i++) { const r = RACK_SLOTS[i]; OBSTACLES.push({ x0: r.x - 3, x1: r.x + RACK_W + 3, y0: r.y - 14, y1: r.y + 2 }); }
  if (lvl("station") >= 1) { const st = WORLD.station; OBSTACLES.push({ x0: st.x - 66, x1: st.x + 86, y0: st.y - 118, y1: st.y + 9 }); }
  if (hasShed()) {
    const sh = WORLD.shed; OBSTACLES.push({ x0: sh.x - 74, x1: sh.x + 94, y0: sh.y - 132, y1: sh.y + 9 });
    for (let i = 0; i < shedRackCount(); i++) { const r = SHED_RACKS[i]; OBSTACLES.push({ x0: r.x - 3, x1: r.x + RACK_W + 3, y0: r.y - 14, y1: r.y + 2 }); }
  }
}
const blocked = (x, y) => OBSTACLES.some(o => x > o.x0 && x < o.x1 && y > o.y0 && y < o.y1);

// Top edge of the walkable land: just above the meadow on the left, level with the farmhouse on the right,
// so the farmer never wanders up to the far-off village houses.
function walkTop(x) { const a = 420, b = 470, t = Math.max(0, Math.min(1, (x - 690) / 80)); return a + (b - a) * t; }
// Mild perspective: the farmer is a little smaller higher up the slope.
const depthScale = y => 0.84 + 0.16 * Math.max(0, Math.min(1, (y - 420) / 230));

// Workers are 75% as effective as you with the same upgrades; their upgrades cost 90% of yours
// (one purchase equips every worker, but they lose time walking hay to the barn).
const WORKER_EFF = 0.75, WORKER_COST = 0.9;

const FIELD_STAGES = [[22, 17], [26, 20], [30, 23], [34, 26], [38, 29], [42, 32], [46, 34], [50, 36]];
function applyFieldSize() {
  for (const f of WORLD.fields) { const [c, r] = FIELD_STAGES[lvl(f.levelId)]; f.w = c * CONFIG.cellW; f.h = +(r * CONFIG.cellH).toFixed(2); }
}

/* ---------------------------- VEHICLES ------------------------------- */
// The farm's transport to Tórshavn. Each tier: name, icon, base load capacity, base trip time (s).
const VEHICLES = [
  { name: "Pony cart",        icon: "🐴", cap: 20,   trip: 8,   motor: false },
  { name: "Horse carriage",   icon: "🐎", cap: 55,   trip: 7.5, motor: false },
  { name: "Pickup truck",     icon: "🛻", cap: 150,  trip: 6.5, motor: true },
  { name: "Pickup + trailer", icon: "🛻", cap: 380,  trip: 6.5, motor: true },
  { name: "Lorry",            icon: "🚚", cap: 1000, trip: 6,   motor: true },
  { name: "Lorry + trailer",  icon: "🚛", cap: 2600, trip: 6,   motor: true },
];

/* ---------------------------- RESOURCES ------------------------------ */
const RESOURCES = [
  { id: "money", name: "Króna",  icon: "🪙", label: () => "Króna", value: () => fmt(state.money) + " kr" },
  { id: "carry", name: "Carrying", icon: "🧺", icon2: () => currentTool().kind === "ride" ? currentTool().icon : currentCarrier().icon,
    label: () => (currentTool().kind === "ride" ? "Tank" : currentCarrier().name) + (state.carry.dried > 0.05 ? ` · ${fmt(state.carry.dried)} dried` : ""),
    value: () => `${fmt(carryTotal())} / ${fmt(getStats().basket)}`, full: () => carryTotal() >= getStats().basket - 1e-6 },
  { id: "barn",  name: "Barn",   icon: "🛖", label: () => state.barn.dried > 0 ? `Barn · ${fmt(state.barn.dried)} dried` : "Barn",
    value: () => `${fmt(barnTotal())} / ${fmt(getStats().barnCap)}`, full: () => barnTotal() >= getStats().barnCap - 1e-6 },
  { id: "cart",  name: "Cart",   icon: "🐴", icon2: () => getStats().vehicle.icon, label: () => getStats().vehicle.name,
    value: () => Cart.state === "parked" ? `${fmt(cartTotal())} / ${fmt(getStats().cartCap)}` : `away · ${Math.ceil(Cart.eta())}s` },
  { id: "research", name: "Research", icon: "🔬", hide: () => !state.research.active,
    label: () => state.research.active ? RESEARCH_BY_ID[state.research.active.id].name : "Research",
    value: () => { const a = state.research.active; return a ? fmtTime(Math.max(0, RESEARCH_BY_ID[a.id].time - a.t)) : ""; } },
];

/* ------------------------------ TOOLS -------------------------------- */
// The ONLY way to grow the harvest ring is a better tool. Bought in order at the farmhouse.
// radius: ring size · cycle: × harvest time · yield: × hay per action · carry: extra hopper/bag
// capacity on top of the basket · run: × movement speed · motor: buzzes when cutting.

// What the farmer carries hay in. Bought in order at the farmhouse, like tools.
// style "back" = worn on the back; "pull" = pulled along behind. Machines' tanks/bags add on top.
// Hay comes from the land: a cut gives hayPerPatch for every grown patch inside the ring,
// times the tool's "gather" (balers and harvesters pack and waste less). Bigger tools cover more grass,
// but a meadow can only grow so much — so land, regrowth and a second meadow matter.
const GATHER = { reel: 1.1, push: 1.15, selfprop: 1.15, sickbar: 1.2, twowheel: 1.25, lawntrac: 1.3, ztr: 1.35, flail: 1.4,
  disc: 1.5, tedder: 1.7, sqbaler: 2.0, rdbaler: 2.5, swather: 2.8, forage: 3.1, combine: 3.5 };
const ringPatches = r => Math.PI * r * r / (CONFIG.cellW * CONFIG.cellH);
const fullYield = (r, gather) => +(ringPatches(r) * CONFIG.hayPerPatch * gather).toFixed(1);
for (const t of TOOLS) { t.gather = GATHER[t.id] || 1; t.yield = fullYield(t.radius, t.gather); }

function defaultState() {

    settings: { master: 0.7, sfx: 0.8, ambience: 0.5, engine: 0.7, sfxOn: true, ambienceOn: true, engineOn: true },
  };
}
let state = defaultState();

function mergeInto(base, saved) {
  for (const k in saved) {
    if (saved[k] && typeof saved[k] === "object" && !Array.isArray(saved[k]) && base[k] && typeof base[k] === "object") mergeInto(base[k], saved[k]);
    else if (k in base && typeof saved[k] === typeof base[k]) base[k] = saved[k];
  }
  return base;
}
const Save = {
  save(silent) {
    state.player.x = Player.x; state.player.y = Player.y;
    try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(state)); if (!silent) flashSaved(); return true; }
    catch (e) { if (!silent) toast("Couldn't save — storage unavailable"); return false; }
  },
  load() {
    try {
      const raw = localStorage.getItem(CONFIG.saveKey); if (!raw) return false;
      const saved = JSON.parse(raw);
      state = mergeInto(defaultState(), saved);
      // "Wider Reach" was removed (tools set the reach now) — refund what was spent on it
      const oldReach = saved.upgrades && saved.upgrades.radius | 0;
      if (oldReach > 0 && !saved.reachRefunded) { for (let l = 0; l < oldReach; l++) state.money += Math.ceil(20 * Math.pow(2.05, l)); setTimeout(() => toast("Wider Reach was replaced by tools — your króna for it were refunded"), 800); }
      state.reachRefunded = true;
      // "Bigger Armfuls" and "Bigger Basket" were removed (tools set the yield, carriers the capacity) — refund them
      if (!saved.refund2) {
        const u = saved.upgrades || {}; let back = 0;
        for (let l = 0; l < (u.yield | 0); l++) back += Math.ceil(8 * Math.pow(1.72, l));
        for (let l = 0; l < (u.basket | 0); l++) back += Math.ceil(10 * Math.pow(1.85, l));
        if (back > 0) { state.money += back; setTimeout(() => toast(`Bigger Armfuls & Bigger Basket were replaced — ${fmt(back)} kr refunded`), 1600); }
      }
      state.refund2 = true;
      if ((saved.research && (saved.research.active || Object.values(saved.research.done || {}).some(Boolean))) && !state.upgrades.station) state.upgrades.station = 1;
      if (!saved.workersV2 && (state.upgrades.cutters > 0) && !state.upgrades.w_tool) state.upgrades.w_tool = TOOL_INDEX.scythe; // they used scythes before
      state.workersV2 = true;
      if (!(state.carrier in CARRIER_INDEX)) state.carrier = "leypur";
      if (!(state.equipment in TOOL_INDEX)) state.equipment = "hands";
      for (const u of UPGRADES) state.upgrades[u.id] = Math.max(0, Math.min(u.maxLevel, state.upgrades[u.id] | 0));
      Player.place(state.player.x, state.player.y);
      if (state.cart.pending > 0) { state.money += state.cart.pending; state.stats.totalMoney += state.cart.pending; state.cart.pending = 0; }
      Cart.reset(); onFieldChanged(false); Helpers.list = []; Helpers.sync();
      return true;
    } catch (e) { return false; }
  },
  reset() {
    try { localStorage.removeItem(CONFIG.saveKey); } catch (e) {}
    const settings = state.settings; state = defaultState(); state.settings = settings;
    Player.place(WORLD.start.x, WORLD.start.y);
    Cart.reset(); onFieldChanged(false); Helpers.list = []; Helpers.sync();
  },
};

/* ---------------------------- FORMATTING ----------------------------- */
function fmt(n) {
  if (n < 0.05) return "0";
  if (n < 10) return (Math.floor(n * 10) / 10).toFixed(1).replace(/\.0$/, "");
  if (n < 10000) return Math.floor(n).toLocaleString("en-US");
  const units = ["k", "M", "B", "T"]; let i = -1;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 100 ? 2 : 1) + units[i];
}
function fmtTime(s) {
  s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
}

const Sound = {
  ctx: null, master: null, buses: {}, noise: null, started: false,
  init() {
    if (this.started) { this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
    for (const b of ["sfx", "ambience", "engine"]) { const g = this.ctx.createGain(); g.connect(this.master); this.buses[b] = g; }
    const len = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf; this.started = true;
    this.applySettings(); this.startWind(); this.scheduleBird();
    document.getElementById("audiohint").style.opacity = 0;
  },
  applySettings() {
    if (!this.started) return;
    const s = state.settings, t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(s.master, t, 0.05);
    this.buses.sfx.gain.setTargetAtTime(s.sfxOn ? s.sfx : 0, t, 0.05);
    this.buses.ambience.gain.setTargetAtTime(s.ambienceOn ? s.ambience : 0, t, 0.05);
    this.buses.engine.gain.setTargetAtTime(s.engineOn ? s.engine : 0, t, 0.05);
  },
  startWind() {
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 380; lp.Q.value = 0.6;
    const g = c.createGain(); g.gain.value = 0.18;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.07;
    const lg = c.createGain(); lg.gain.value = 0.11; lfo.connect(lg).connect(g.gain);
    const lfo2 = c.createOscillator(); lfo2.frequency.value = 0.05;
    const l2 = c.createGain(); l2.gain.value = 160; lfo2.connect(l2).connect(lp.frequency);
    src.connect(lp).connect(g).connect(this.buses.ambience);
    src.start(); lfo.start(); lfo2.start();
  },
  scheduleBird() { setTimeout(() => { if (this.started) { this.bird(); this.scheduleBird(); } }, 4000 + Math.random() * 9000); },
  bird() {
    const c = this.ctx, t0 = c.currentTime, n = 2 + Math.floor(Math.random() * 4), base = 2800 + Math.random() * 1400;
    const pan = c.createStereoPanner ? c.createStereoPanner() : null;
    if (pan) { pan.pan.value = Math.random() * 1.6 - 0.8; pan.connect(this.buses.ambience); }
    for (let i = 0; i < n; i++) {
      const t = t0 + i * (0.09 + Math.random() * 0.05), o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(base * (1 + Math.random() * 0.15), t);
      o.frequency.exponentialRampToValueAtTime(base * (0.75 + Math.random() * 0.5), t + 0.07);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.connect(g).connect(pan || this.buses.ambience); o.start(t); o.stop(t + 0.1);
    }
  },
  noiseHit(t, f0, f1, dur, vol, type = "bandpass", q = 1.2) {
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.7);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(this.buses.sfx); src.start(t, Math.random()); src.stop(t + dur + 0.05);
  },
  tones(freqs, step, type, vol, dur = 0.35) {
    if (!this.started) return;

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

// One grass meadow. The farm can own several (WORLD.fields); `Field` below manages them all.
class Plot {
  constructor(def) { this.f = def; this.cols = 0; this.rows = 0; this.growth = null; this.blades = null; }
  get unlocked() { return !this.f.unlock || lvl(this.f.unlock) >= 1; }
  // (Re)build the grass grid. When the meadow grows, existing cells keep their growth
  // and the new strip starts as fresh sprouts (newGrowth).
  build(keep, newGrowth = 1) {
    const f = this.f, oldCols = this.cols, oldRows = this.rows, old = this.growth;
    this.cw = CONFIG.cellW; this.ch = CONFIG.cellH;
    this.cols = Math.round(f.w / this.cw); this.rows = Math.round(f.h / this.ch);
    const n = this.cols * this.rows; this.growth = new Float32Array(n).fill(newGrowth);
    if (keep && old) for (let r = 0; r < Math.min(oldRows, this.rows); r++) for (let c = 0; c < Math.min(oldCols, this.cols); c++) this.growth[r * this.cols + c] = old[r * oldCols + c];

      this.blades[k++] = (R() - 0.5) * 0.6; this.blades[k++] = R() * Math.PI * 2;
      this.blades[k++] = R() < 0.5 ? 0 : 1; this.blades[k++] = 0.75 + R() * 0.5;

  contains(x, y) { const f = this.f; return x >= f.x && x <= f.x + f.w && y >= f.y && y <= f.y + f.h; }
  forCells(cx, cy, r, fn) {

    const c0 = Math.max(0, Math.floor((cx - r - f.x) / this.cw)), c1 = Math.min(this.cols - 1, Math.floor((cx + r - f.x) / this.cw));
    const r0 = Math.max(0, Math.floor((cy - r - f.y) / this.ch)), r1 = Math.min(this.rows - 1, Math.floor((cy + r - f.y) / this.ch));

  pilePos() { const f = this.f, g = this.gate(); return { x: f.x + f.w + 36, y: g.y1 + 34 }; }

  hubRoute() { const go = this.gateOut(); return this.f.id === "bour" ? [WORLD.hub] : [{ x: go.x + 30, y: WORLD.south.y }, WORLD.south, WORLD.hub]; }

    const inF = this.contains(Player.x, Player.y), mx = inF ? Player.x : -9999, my = inF ? Player.y : -9999, pr = 34;

  }
}
// All the farm's meadows, treated as one surface for harvesting.
const Field = {

  plotAt(x, y) { return this.active().find(p => p.contains(x, y)) || null; },
  byId(id) { return this.plots.find(p => p.f.id === id); },
  contains(x, y) { return !!this.plotAt(x, y); },
  build(keep, newGrowth) { for (const p of this.plots) p.build(keep, newGrowth); },
  update(dt, regrowTime) { for (const p of this.active()) p.update(dt, regrowTime); },

  freshnessAt(cx, cy, r) { let s = 0, c = 0; for (const p of this.active()) p.forCells(cx, cy, r, i => { s += p.growth[i]; c++; }); return c ? s / c : 0; },
  draw(g, t) { for (const p of this.active()) p.draw(g, t); },

  get growth() { return this.plots[0].growth; }, get cols() { return this.plots[0].cols; }, get rows() { return this.plots[0].rows; },
};

// All tool art is drawn facing right (+x) in local coordinates; callers flip with scale(face, 1).
function drawHead(g, x, hy, f, flop) {
  // low-poly head: a heptagon with a lit and a shaded half, white beard, stocking cap (húgva)
  const hep = (cx, cy, r, sx = 1, sy = 1) => { g.beginPath(); for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2 - Math.PI / 2; g.lineTo(cx + Math.cos(a) * r * sx, cy + Math.sin(a) * r * sy); } g.closePath(); };

  g.fillStyle = "#e79e86"; g.fillRect(x + f * 4.6 - 1.4, hy + 0.2, 2.8, 2.4); // nose
  g.fillStyle = "#1f1b22"; g.fillRect(x + f * 2.8 - 0.9, hy - 2.4, 1.8, 2.2); // eye

  const stripes = (path, k) => {

/* ------------------------------ PLAYER ------------------------------- */
const Player = {
  x: WORLD.start.x, y: WORLD.start.y, vx: 0, vy: 0, face: 1, walk: 0, moving: false, lastStep: 0, swing: 0,
  clamp(x, y) { const w = WORLD.walk; this.x = Math.max(w.x0, Math.min(w.x1, x)); this.y = Math.max(walkTop(this.x), Math.min(w.y1, y)); },
  place(x, y) { if (blocked(x, y)) { x = WORLD.start.x; y = WORLD.start.y; } this.clamp(x, y); this.vx = this.vy = 0; }, // teleport (load / reset)
  update(dt, dir, speed) {
    const tx = dir.x * speed, ty = dir.y * speed, a = Math.min(1, dt * 12);
    this.vx += (tx - this.vx) * a; this.vy += (ty - this.vy) * a;
    const ox = this.x, oy = this.y;
    const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
    // move each axis separately so the farmer slides along walls instead of sticking
    if (blocked(nx, this.y)) this.vx = 0; else this.x = nx;
    if (blocked(this.x, ny)) this.vy = 0; else this.y = ny;
    const cx = this.x, cy = this.y; this.clamp(cx, cy);
    if (this.x !== cx) this.vx = 0; // stop against the edge of the walkable area
    if (this.y !== cy) this.vy = 0;
    const sp = Math.hypot(this.vx, this.vy);
    this.moving = sp > 12;
    state.stats.distance += Math.hypot(this.x - ox, this.y - oy);
    if (Math.abs(this.vx) > 8) this.face = this.vx > 0 ? 1 : -1;
    if (this.moving) {
      this.walk += dt * (6 + sp / 22);
      const step = Math.floor(this.walk / Math.PI);
      if (step !== this.lastStep) { this.lastStep = step; Sound.step(step & 1); if (!Field.contains(this.x, this.y)) FX.dust(this.x - this.face * 6, this.y); }
    } else this.walk += (Math.round(this.walk / Math.PI) * Math.PI - this.walk) * Math.min(1, dt * 10);
  },
  draw(g, t) {
    const x = this.x, y = this.y, f = this.face, mv = this.moving ? 1 : 0, ph = this.walk;
    const tool = currentTool(), s = getStats();
    const harvesting = Field.contains(x, y) && carryTotal() < s.basket - 1e-6;
    const a = this.x / 9 * f;
    g.save();
    const ds = depthScale(y); g.translate(x, y); g.scale(ds, ds); g.translate(-x, -y);
    if (tool.kind === "ride") {
      const sw = Math.min(150, 40 + tool.radius * 0.8);
      g.fillStyle = "rgba(20,30,15,0.28)"; g.beginPath(); g.ellipse(x - f * sw * 0.15, y, sw * 0.6, 7, 0, 0, Math.PI * 2); g.fill();
      g.translate(x, y); g.scale(f, 1);
      RIDE_ART[tool.art](g, t, a, mv, harvesting);
      g.restore(); return;
    }
    const bob = -Math.abs(Math.sin(ph)) * 2.2 * mv;
    const load = Math.min(1, carryTotal() / s.basket);
    g.fillStyle = "rgba(20,30,15,0.28)"; g.beginPath(); g.ellipse(x, y, 14, 4.5, 0, 0, Math.PI * 2); g.fill();
    // legs
    const legSwing = Math.sin(ph) * 7 * mv;
    g.lineCap = "round"; g.strokeStyle = "#5d4b40"; g.lineWidth = 5.5;
    for (const sd of [-1, 1]) {
      const hipX = x + sd * 3.5, footX = hipX + sd * legSwing * f, lift = Math.max(0, -Math.sin(ph) * sd) * 3 * mv;
      g.beginPath(); g.moveTo(hipX, y - 17 + bob); g.lineTo(footX, y - 2 - lift); g.stroke();
      g.fillStyle = "#2f2c35"; g.beginPath(); g.ellipse(footX + f * 2, y - 1.5 - lift, 4.5, 2.6, 0, 0, Math.PI * 2); g.fill();
    }
    const by = y - 17 + bob;
    drawCarrier(g, currentCarrier(), x, y, by, f, load, t, a, mv);
    sweater(g, x, by - 22, 22);
    
    if (tool.kind === "walk") {
      // pushing a machine: it rolls along in front, both hands on the handle
      g.save(); g.translate(x + f * 30, y); g.scale(f, 1);
      const grip = WALK_ART[tool.art](g, t, a, false, harvesting);
      g.strokeStyle = "#6c6580"; g.lineWidth = 2.4; g.beginPath(); g.moveTo(grip.hx, grip.hy); g.lineTo(-20, by - y - 9); g.stroke();
      g.restore();
      g.strokeStyle = "#3e4c78"; g.lineWidth = 5; g.lineCap = "round";
      g.beginPath(); g.moveTo(x + f * 5, by - 17); g.lineTo(x + f * 11, by - 10); g.stroke();
      g.fillStyle = "#efbf9b"; g.beginPath(); g.arc(x + f * 11, by - 9, 2.6, 0, Math.PI * 2); g.fill();
    } else {
      // arms: swing when walking, sweeping motion when harvesting; tool in hand
      const cut = harvesting && !this.moving;
      const armSwing = cut ? Math.sin(Harvester.progress * Math.PI * 2) * 8 : Math.sin(ph) * 6 * mv;
      const hx = x + f * (9 + Math.max(0, armSwing) * 0.4), hy = by - 6 + armSwing * 0.3;
      g.strokeStyle = "#3e4c78"; g.lineWidth = 5;
      g.beginPath(); g.moveTo(x + f * 6, by - 18); g.lineTo(hx, hy - 1); g.stroke();
      if (HELD_ART[tool.art]) {
        g.save(); g.translate(hx, hy); g.scale(f, 1); g.rotate(cut ? Math.sin(Harvester.progress * Math.PI * 2) * 0.45 : 0);
        HELD_ART[tool.art](g, t, harvesting); g.restore();
      }
      g.fillStyle = "#efbf9b"; g.beginPath(); g.arc(hx, hy, 2.6, 0, Math.PI * 2); g.fill();
    }
    drawHead(g, x, by - 30, f, Math.sin(ph * 0.5 + t) * 1.5 * mv);
    g.restore();
  },
};

/* ---------------------------- HARVESTER ------------------------------ */
const Harvester = {
  progress: 0, pulse: 0, fullWarned: false,
  active() { return Field.contains(Player.x, Player.y); },
  update(dt) {
    const s = getStats(), full = carryTotal() >= s.basket - 1e-6;
    if (!this.active()) return;
    if (full) {
      if (!this.fullWarned) { this.fullWarned = true; toast("🧺 Basket full — store it at the barn or load it onto the cart"); Sound.bump(); }
      return;
    }
    this.fullWarned = false;
    this.progress += dt / s.cycleTime;
    if (this.progress >= 1) { this.progress -= 1; this.complete(s); }
  },
  complete(s) {
    const { freshness, cut, sum } = Field.harvest(Player.x, Player.y, s.radius);
    const gained = Math.min(sum * CONFIG.hayPerPatch * s.gather, s.basket - carryTotal());
    state.carry.fresh += gained; state.stats.totalHay += gained; state.stats.actions++;
    this.pulse = 1;
    FX.harvestBurst(Player.x, Player.y, s.radius, cut, gained, freshness);
    Sound.cut(s.tool.art, freshness);
    UI.onHarvest();
  },
  draw(g, t) {
    if (!this.active()) return;
    const s = getStats(), r = s.radius, x = Player.x, y = Player.y;
    const full = carryTotal() >= s.basket - 1e-6, fresh = Field.freshnessAt(x, y, r);
    g.save();
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    // ring styled like Hare Season's crosshair: white with an ink outline, gold progress
    g.fillStyle = full ? "rgba(217,73,58,0.10)" : "rgba(255,255,255,0.10)"; g.fill();
    g.lineWidth = 8; g.strokeStyle = "rgba(53,47,69,0.42)"; g.stroke();
    g.lineWidth = 4.5; g.strokeStyle = full ? "#ffd2cc" : "rgba(255,255,255,0.92)";
    if (full) g.setLineDash([6, 6]);
    g.stroke(); g.setLineDash([]);
    const p = Math.min(1, this.progress);
    if (!full && p > 0.002) {
      g.beginPath(); g.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2);
      g.lineWidth = 6; g.lineCap = "round"; g.strokeStyle = fresh > 0.5 ? "#f0b23a" : "#f6d79a"; g.stroke();
      const a = -Math.PI / 2 + p * Math.PI * 2; g.fillStyle = "#fff";
      g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, 3.5, 0, Math.PI * 2); g.fill();
      g.lineWidth = 1.5; g.strokeStyle = "rgba(53,47,69,0.45)"; g.stroke();
    }
    g.restore();
    if (this.pulse > 0) {
      g.beginPath(); g.arc(x, y, r * (1 + (1 - this.pulse) * 0.6), 0, Math.PI * 2);
      g.lineWidth = 3 * this.pulse; g.strokeStyle = `rgba(240,178,58,${this.pulse})`; g.stroke();
    }
  },
};

/* ------------------------------ HELPERS ------------------------------ */
// Neighbours you can hire. Cutters scythe the meadow and carry the grass to the barn;
// haulers carry dried hay from the barn to the cart and send it to Tórshavn when it's full.
// Their tools scale with yours so they stay useful all game, but they're slower than you.
const HELPER_LOOKS = (() => {
  const names = ["Jógvan", "Turið", "Sjúrður", "Marjun", "Rógvi", "Guðrun", "Sámal", "Bára", "Óli", "Sunnvá",
                 "Rakul", "Hanus", "Elin", "Pætur", "Ragna", "Heðin", "Jónleif", "Tróndur", "Durita", "Eyðun"];
  const cols = ["#7a3b45", "#4d6a55", "#5b4d7a", "#8a5a3c", "#6b6b48"];
  return names.map((name, i) => ({ name, sweater: cols[(i + Math.floor(i / 5)) % cols.length] }));
})();

const Helpers = {
  list: [], swishT: 0,
  // everything a worker can do is WORKER_EFF of what you'd do with the same upgrades
  tool() { return TOOLS[lvl("w_tool")] || TOOLS[0]; },
  carrier() { return CARRIERS[lvl("w_carrier")] || CARRIERS[0]; },
  cutterStats() {
    const t = this.tool(), e = WORKER_EFF;
    return { tool: t, radius: Math.max(9, Math.round(t.radius * e)), cycle: stat("w_speed") * t.cycle * rMult("cycle") / e, gather: t.gather * rMult("gather"), yield: fullYield(Math.max(9, Math.round(t.radius * e)), t.gather * rMult("gather")),
      cap: Math.max(6, Math.round((this.carrier().cap + t.carry) * e)), speed: stat("w_boots") * t.run * e };
  },
  haulerCap() { return Math.max(6, Math.round(this.carrier().cap * WORKER_EFF * rMult("haul"))); },
  speed(h) { return h.role === "cutter" ? this.cutterStats().speed : stat("w_boots") * WORKER_EFF; },
  // keep the crew in step with the hired counts
  sync() {
    const want = [];
    for (let i = 0; i < lvl("cutters"); i++) want.push("cutter");
    for (let i = 0; i < lvl("haulers"); i++) want.push("hauler");
    while (this.list.length > want.length) this.list.pop();
    want.forEach((role, i) => {
      const look = HELPER_LOOKS[(role === "cutter" ? 0 : 10) + want.slice(0, i).filter(r => r === role).length];
      if (this.list[i] && this.list[i].role === role) { this.list[i].look = look; return; }
      const d = WORLD.barn.door;
      this.list[i] = { role, look: HELPER_LOOKS[(role === "cutter" ? 0 : 10) + want.slice(0, i).filter(r => r === role).length],
        x: d.x - 30 + (i % 7) * 22, y: d.y + 26 + Math.floor(i / 7) * 14, face: 1, walk: 0, moving: false, state: "idle", dest: "barn", src: "barn", reserve: 0, route: [], load: 0, prog: 0, wait: 0, tx: 0, ty: 0, pop: 0, bubble: "" };
    });
  },
  // walk along a list of waypoints; returns true on arrival at the last one
  follow(h, dt) {
    if (!h.route.length) { h.moving = false; return true; }
    const p = h.route[0], dx = p.x - h.x, dy = p.y - h.y, d = Math.hypot(dx, dy), step = this.speed(h) * dt;
    if (d <= step) { h.x = p.x; h.y = p.y; h.route.shift(); }
    else { h.x += dx / d * step; h.y += dy / d * step; if (Math.abs(dx) > 2) h.face = dx > 0 ? 1 : -1; }
    h.moving = true; h.walk += dt * 11;
    return !h.route.length;
  },
  // ---- routes: through field gates, along the farm tracks via the farmyard hub ----
  doorSpot() { const d = WORLD.barn.door; return { x: d.x - 24, y: d.y + 12 }; },
  homeSpot(h) { const d = WORLD.barn.door, i = this.list.filter(o => o.role === "hauler").indexOf(h); return { x: d.x + 34 + (i % 5) * 22, y: d.y + 18 + Math.floor(i / 5) * 22 + (i % 2) * 5 }; },
  // from wherever the worker is to just inside a plot's gate
  routeToPlot(h, plot) {
    const here = Field.plotAt(h.x, h.y);
    if (here === plot) return [];
    const r = here ? [here.gateIn(), here.gateOut(), ...here.hubRoute()] : [WORLD.hub];
    return [...r, ...plot.hubRoute().slice().reverse(), plot.gateOut(), plot.gateIn()];
  },
  pileSpot(plot) { const p = plot.pilePos(); return { x: p.x + 16, y: p.y + 8 }; },
  // each cutter works one meadow; they share them out when you own more than one
  plotFor(h) { const plots = Field.active(), cutters = this.list.filter(o => o.role === "cutter"); return plots[cutters.indexOf(h) % plots.length]; },
  // pick a patch of tall grass in the cutter's own meadow, avoiding the farmer and the other cutters
  // how far apart two cutters must work: their rings must not overlap, and a riding machine is drawn
  // much wider than its ring (mower bars, balers), so give machines room for their bodywork too
  spacing() { const cs = this.cutterStats(), t = cs.tool; return Math.max(cs.radius * 1.9, t.kind === "ride" ? Math.min(150, 40 + t.radius * 0.8) * 1.25 : t.kind === "walk" ? 55 : 34); },
  pickPatch(h) {
    const plot = this.plotFor(h), f = plot.f, cs = this.cutterStats(); let best = null, bs = -1e9;
    // each cutter keeps its own patch: spots near where another cutter stands or is heading are
    // ruled out (rings may only just touch), so they spread out instead of crowding the last green bit
    const others = this.list.filter(o => o !== h && o.role === "cutter" && this.plotFor(o) === plot), D = this.spacing();
    for (let k = 0; k < 40; k++) {
      const x = f.x + cs.radius * 0.6 + Math.random() * Math.max(1, f.w - cs.radius * 1.2), y = f.y + cs.radius * 0.6 + Math.random() * Math.max(1, f.h - cs.radius * 1.2);
      const fr = Field.freshnessAt(x, y, cs.radius);
      let sc = fr - Math.hypot(x - h.x, y - h.y) / 3000;
      if (Math.hypot(x - Player.x, y - Player.y) < getStats().radius + cs.radius) sc -= 0.6;
      for (const o of others) {
        const busy = o.state === "cutting" || o.state === "toField" || o.state === "waitGrass";
        if (!busy) continue;
        const d = Math.min(Math.hypot(x - o.tx, y - o.ty), o.state === "toField" ? 1e9 : Math.hypot(x - o.x, y - o.y));
        if (d < D) sc -= 3 + (1 - d / D);
      }
      if (sc > bs) { bs = sc; best = { x, y, fr }; }
    }
    return best;
  },
  update(dt) {
    this.swishT -= dt;
    for (const h of this.list) {
      h.pop = Math.min(1, h.pop + dt * 3); h.bubble = "";
      if (h.role === "cutter") this.updateCutter(h, dt); else this.updateHauler(h, dt);
      if (!h.moving) h.walk += (Math.round(h.walk / Math.PI) * Math.PI - h.walk) * Math.min(1, dt * 10);
    }
    // one speech bubble per message, so idle haulers standing together don't stack the same text
    const seen = new Set(); for (const h of this.list) { if (!h.bubble) continue; if (seen.has(h.bubble)) h.bubble = ""; else seen.add(h.bubble); }
    this.sendCheck(dt);
  },
  updateCutter(h, dt) {
    const cs = this.cutterStats(), plot = this.plotFor(h);
    if (h.state === "idle") { const tgt = this.pickPatch(h); h.tx = tgt.x; h.ty = tgt.y; h.route = [...this.routeToPlot(h, plot), tgt]; h.state = "toField"; }
    else if (h.state === "waitGrass") { // the meadow is cut short: stand on your own patch and let it grow back
      h.moving = false; h.bubble = "Letting the grass grow…"; h.wait -= dt;
      if (Field.plotAt(h.x, h.y) !== plot) { h.state = "idle"; return; }

function drawHelper(g, h, t) {

/* ------------------------------ PLACES ------------------------------- */
// Interactive locations. Add new buildings here with a zone, prompt and action.
const Places = {
  near: null,
  update() {
    const nb = dist(Player, WORLD.barn.door) < WORLD.barn.r, nc = dist(Player, WORLD.cart.park) < WORLD.cart.r, nh = dist(Player, WORLD.house.door) < WORLD.house.r;
    this.near = nb ? "barn" : nh ? "house" : nc ? "cart" : null;
    if (!this.near && hasShed() && dist(Player, WORLD.shed.door) < WORLD.shed.r) this.near = "shed";
    if (!this.near && lvl("station") >= 1 && dist(Player, WORLD.station.door) < WORLD.station.r) this.near = "station";
    if (!this.near) for (const plot of Field.active()) if (dist(Player, plot.pilePos()) < 46) { this.near = "pile:" + plot.f.id; break; }
  },
  prompt() {
    const s = getStats();
    if (this.near === "station") { const a = state.research.active; return { label: a ? `🔬 ${RESEARCH_BY_ID[a.id].name} · ${fmtTime(Math.max(0, RESEARCH_BY_ID[a.id].time - a.t))} left` : "🔬 Choose research", ok: true }; }
    if (this.near === "barn" || this.near === "shed") {
      const id = this.near, nm = id === "barn" ? "Barn" : "Shed", c = carryTotal(), b = Stores.total(id), space = Stores.space(id);
      if (c > 0.05) return space > 0.05 ? { label: `🛖 Store ${fmt(Math.min(c, space))} hay`, ok: true } : { label: `${nm} is full`, ok: false };
      if (b > 0.05) return { label: `🧺 Load ${fmt(Math.min(b, s.basket))} hay`, ok: true };
      return { label: `${nm} is empty`, ok: false };
    }
    if (this.near === "cart") {
      if (Cart.state !== "parked") return { label: `${s.vehicle.icon} In Tórshavn · back in ${Math.ceil(Cart.eta())}s`, ok: false };
      if (Cart.leaveIn >= 0) return { label: `${s.vehicle.icon} Setting off…`, ok: false };
      const space = s.cartCap - cartTotal();
      if (carryTotal() > 0.05 && space > 0.05) return { label: `${s.vehicle.icon} Load ${fmt(Math.min(carryTotal(), space))} hay`, ok: true };
      if (cartTotal() > 0.05) return { label: `${s.vehicle.icon} Send ${fmt(cartTotal())} hay to Tórshavn`, ok: true };
      return { label: `${s.vehicle.icon} Empty — bring hay`, ok: false };
    }
    if (this.near === "house") return { label: "🏠 Go inside · upgrades", ok: true };
    if (this.near && this.near.startsWith("pile:")) {
      const n = state.piles[this.near.slice(5)] || 0, room = s.basket - carryTotal();
      if (state.carry.fresh > 0.05) return { label: `🌾 Drop ${fmt(state.carry.fresh)} hay on the pile`, ok: true };
      if (n > 0.05 && room > 0.05) return { label: `🧺 Load ${fmt(Math.min(n, room))} hay from the pile`, ok: true };
      return { label: n > 0.05 ? "Your carrier is full" : "The pile is empty", ok: false };
    }
    return null;
  },
};
function interact() {
  if (Places.near === "barn" || Places.near === "shed") storeAction(Places.near);
  else if (Places.near === "house") UI.open("home");
  else if (Places.near === "station") UI.open("home", "research");
  else if (Places.near && Places.near.startsWith("pile:")) pileAction(Places.near.slice(5));
  else if (Places.near === "cart") {
    if (Cart.state !== "parked" || Cart.leaveIn >= 0) return;
    if (carryTotal() > 0.05 && cartTotal() < getStats().cartCap - 0.05) loadCart(); else Cart.send();
  }
}

function barnAction() { if (Places.near === "barn" || Places.near === "shed") storeAction(Places.near); }
function storeAction(id) {
  const st = state[id], door = Stores.door(id), s = getStats(), c = carryTotal(), space = Stores.space(id);
  if (c > 0.05) {
    if (space <= 0.05) { Sound.bump(); toast(id === "barn" ? "The barn is full — buy a Barn Loft upgrade or take hay to the cart" : "The shed is full — take hay to the barn or the cart"); return; }
    let amt = Math.min(c, space), moved = amt;
    const fromDried = Math.min(state.carry.dried, amt); state.carry.dried -= fromDried; st.dried += fromDried; amt -= fromDried;
    state.carry.fresh -= amt; st.fresh += amt;
    clean(state.carry);
    state.stats.timesStored++; state.stats.hayStored += moved;
    FX.haul(Player.x, Player.y - 30, door.x, door.y - 50, moved);
    FX.float(door.x, WORLD[id].y - 120, `Stored ${fmt(moved)} 🌾`, "#fff3c4");
    Sound.store();
    if (state.stats.timesStored === 1) { toast("Hay in the barn dries into hay worth 50% more"); UI.render(); }
  } else {
    let room = s.basket, total = 0;
    const d = Math.min(st.dried, room); st.dried -= d; state.carry.dried += d; room -= d; total += d;

/* ------------------------------- CART -------------------------------- */
// State machine: parked → leaving (drives off east) → away (in Tórshavn) → returning → parked (sells).
const Cart = {
  state: "parked", t: 0, x: WORLD.cart.park.x, dir: 1, leaveIn: -1, out: 1.6, away: 4, dust: 0,
  reset() { this.state = "parked"; this.t = 0; this.x = WORLD.cart.park.x; this.dir = 1; this.leaveIn = -1; },
  moving() { return this.state === "leaving" || this.state === "returning"; },
  eta() {
    if (this.state === "leaving") return this.out - this.t + this.away + this.out;
    if (this.state === "away") return this.away - this.t + this.out;
    if (this.state === "returning") return this.out - this.t;
    return 0;
  },
  send() {
    if (this.state !== "parked" || this.leaveIn >= 0) return;
    if (cartTotal() < 0.05) { Sound.bump(); return; }
    this.leaveIn = 0.15;
  },
  depart() {
    const s = getStats(), T = s.tripTime;
    this.out = Math.min(1.8, T * 0.25); this.away = Math.max(0.5, T - 2 * this.out);
    this.state = "leaving"; this.t = 0; this.dir = 1;
    Sound.depart(s.vehicle.motor, this.out + 0.3);
  },
  update(dt) {
    const P = WORLD.cart.park.x, E = WORLD.cart.exitX;
    if (this.leaveIn >= 0) { this.leaveIn -= dt; if (this.leaveIn < 0) this.depart(); }
    if (this.state === "leaving") {
      this.t += dt; const u = Math.min(1, this.t / this.out);
      this.x = P + u * u * (E - P);
      if (u >= 1) { this.state = "away"; this.t = 0; this.unload(); }
    } else if (this.state === "away") {
      this.t += dt;
      if (this.t >= this.away) { this.state = "returning"; this.t = 0; this.dir = -1; Sound.depart(getStats().vehicle.motor, this.out + 0.3); }
    } else if (this.state === "returning") {
      this.t += dt; const u = Math.min(1, this.t / this.out);
      this.x = E + (1 - (1 - u) * (1 - u)) * (P - E);
      if (u >= 1) { this.reset(); this.payOut(); }
    }
    if (this.moving()) { this.dust -= dt; if (this.dust <= 0) { this.dust = 0.12; FX.dust(this.x - this.dir * 40, WORLD.cart.park.y); } }
  },
  // The load was sold in Tórshavn; the money arrives with the cart.
  // In Tórshavn: the load is sold and the cart is emptied. The money rides home with it.
  unload() {
    const s = getStats(), fresh = state.cart.fresh, dried = state.cart.dried;
    if (fresh + dried < 0.05) return;
    state.cart.pending += (fresh + dried * CONFIG.driedBonus) * s.sellPrice;
    state.cart.pendingDried = dried > 0.05;
    state.cart.fresh = 0; state.cart.dried = 0;
    state.stats.haySold += fresh + dried; state.stats.timesSold++;
  },
  // Back at the farm: the takings are paid out.
  payOut() {
    const earned = state.cart.pending; if (earned < 0.01) return;
    const dried = state.cart.pendingDried;
    state.cart.pending = 0; state.cart.pendingDried = false;
    state.money += earned; state.stats.totalMoney += earned;
    Sound.coin(); UI.bump("money"); UI.bump("cart");
    const p = WORLD.cart.park;
    FX.coins(p.x, p.y - 50, Math.min(12, 3 + Math.round(earned / 8)));
    FX.float(p.x, p.y - 100, `+${fmt(earned)} kr`, "#ffe58a");
    if (dried) FX.float(p.x, p.y - 124, "dried hay bonus!", "#f3f0dc");
    if (state.stats.timesSold === 1) { toast("Sold in Tórshavn! New Transport upgrades unlocked"); UI.render(); }
  },
};

// All FX positions are in world units, except coins that fly to the top-bar counter (screen units).
const FX = {
  parts: [], straws: [], texts: [], coinsArr: [],
  harvestBurst(x, y, r, cut, gained, freshness) {
    for (let i = 0; i < Math.min(cut.length, 45); i++) {
      const c = cut[(Math.random() * cut.length) | 0];
      this.parts.push({ x: c[0], y: c[1] - 4, vx: (c[0] - x) * 1.8 + (Math.random() - 0.5) * 40, vy: -60 - Math.random() * 90, life: 0.8 + Math.random() * 0.4, age: 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, col: Math.random() < 0.5 ? "#9bbd56" : "#c9c27a", kind: "clip" });
    }
    const n = Math.max(1, Math.round(2 + freshness * 4));
    for (let i = 0; i < n; i++) this.straws.push({ sx: x + (Math.random() - 0.5) * r, sy: y + (Math.random() - 0.5) * r * 0.6, follow: true, cx: x + (Math.random() - 0.5) * 80, cy: y - 60 - Math.random() * 40, t: -i * 0.04, dur: 0.45 + Math.random() * 0.2, rot: Math.random() * 3 });
    this.float(x, y - r - 30, "+" + fmt(gained) + " 🌾", freshness > 0.6 ? "#ffe9a0" : "#f3f0dc");
    if (this.parts.length > 400) this.parts.splice(0, this.parts.length - 400);
  },
  haul(x0, y0, x1, y1, amount) {
    const n = Math.min(14, 4 + Math.round(amount / 3));
    for (let i = 0; i < n; i++) this.straws.push({ sx: x0 + (Math.random() - 0.5) * 16, sy: y0, tx: x1 + (Math.random() - 0.5) * 20, ty: y1, cx: (x0 + x1) / 2 + (Math.random() - 0.5) * 40, cy: Math.min(y0, y1) - 50 - Math.random() * 40, t: -i * 0.03, dur: 0.5 + Math.random() * 0.2, rot: Math.random() * 3 });
  },
  coins(x, y, n) {

  },

  float(x, y, txt, col) { this.texts.push({ x, y, txt, col, age: 0 }); },
  update(dt) {

  drawWorld(g) {

    }
  },
};

const keys = new Set();
const Input = {
  joy: null,     // touch joystick {id, sx, sy, x, y}
  hold: null,    // mouse click-and-hold target {id, x, y}
  dir() {
    let x = 0, y = 0;
    if (UI.isOpen) return { x, y };
    if (keys.has("ArrowLeft") || keys.has("KeyA")) x -= 1;
    if (keys.has("ArrowRight") || keys.has("KeyD")) x += 1;
    if (keys.has("ArrowUp") || keys.has("KeyW")) y -= 1;
    if (keys.has("ArrowDown") || keys.has("KeyS")) y += 1;
    if (this.joy) {
      const dx = this.joy.x - this.joy.sx, dy = this.joy.y - this.joy.sy, d = Math.hypot(dx, dy);
      if (d > 8) { const m = Math.min(1, d / 50); x += dx / d * m; y += dy / d * m; }
    } else if (this.hold) {
      const w = toWorld(this.hold.x, this.hold.y), dx = w.x - Player.x, dy = w.y - Player.y, d = Math.hypot(dx, dy);
      if (d > 6) { x += dx / d * Math.min(1, d / 30); y += dy / d * Math.min(1, d / 30); }
    }
    const d = Math.hypot(x, y); if (d > 1) { x /= d; y /= d; }
    return { x, y };
  },
};
window.addEventListener("keydown", e => {
  Sound.init();
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  if (e.target.tagName === "INPUT") return;
  if (UI.isOpen) { if ((e.code === "Escape" || e.code === "KeyE") && !e.repeat) UI.close(); return; }
  keys.add(e.code);
  if ((e.code === "KeyE" || e.code === "Space" || e.code === "Enter") && !e.repeat) interact();
});
window.addEventListener("keyup", e => keys.delete(e.code));
window.addEventListener("blur", () => { keys.clear(); Input.joy = null; Input.hold = null; });
// Click / tap a building or the cart you're standing next to = same as pressing E.
const HITBOXES = {
  barn:  () => ({ x0: WORLD.barn.x - 100, x1: WORLD.barn.x + 100, y0: 440, y1: 600 }),
  house: () => ({ x0: 930, x1: 1090, y0: 380, y1: 495 }),
  cart:  () => ({ x0: Cart.x - 110, x1: Cart.x + 90, y0: WORLD.cart.park.y - 80, y1: WORLD.cart.park.y + 12 }),
};
function hitPlace(sx, sy) {
  const w = toWorld(sx, sy);
  for (const id in HITBOXES) { const b = HITBOXES[id](); if (w.x > b.x0 && w.x < b.x1 && w.y > b.y0 && w.y < b.y1) return id; }
  return null;
}
sceneCanvas.addEventListener("pointerdown", e => {
  Sound.init();
  const hit = hitPlace(e.clientX, e.clientY);
  if (hit && hit === Places.near) { interact(); return; }
  if (e.pointerType === "touch") { document.body.classList.add("touch"); Input.joy = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY }; }
  else Input.hold = { id: e.pointerId, x: e.clientX, y: e.clientY };
  sceneCanvas.setPointerCapture(e.pointerId);
});
sceneCanvas.addEventListener("pointermove", e => {
  if (Input.joy && e.pointerId === Input.joy.id) { Input.joy.x = e.clientX; Input.joy.y = e.clientY; }
  if (Input.hold && e.pointerId === Input.hold.id) { Input.hold.x = e.clientX; Input.hold.y = e.clientY; }
});
const endPointer = e => { if (Input.joy && e.pointerId === Input.joy.id) Input.joy = null; if (Input.hold && e.pointerId === Input.hold.id) Input.hold = null; };
sceneCanvas.addEventListener("pointerup", endPointer);
sceneCanvas.addEventListener("pointercancel", endPointer);
document.addEventListener("pointerdown", () => Sound.init(), { passive: true });
document.getElementById("act").addEventListener("click", e => { e.stopPropagation(); e.currentTarget.blur(); interact(); });
sceneCanvas.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || Input.hold) return;
  const hit = hitPlace(e.clientX, e.clientY);
  sceneCanvas.style.cursor = hit && hit === Places.near ? "pointer" : "default";
});

function drawJoystick(g) {
  const j = Input.joy; if (!j) return;
  let dx = j.x - j.sx, dy = j.y - j.sy; const d = Math.hypot(dx, dy); if (d > 50) { dx = dx / d * 50; dy = dy / d * 50; }
  g.fillStyle = "rgba(255,255,255,0.18)"; g.strokeStyle = "rgba(255,255,255,0.6)"; g.lineWidth = 2;
  g.beginPath(); g.arc(j.sx, j.sy, 52, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = "rgba(255,255,255,0.75)"; g.beginPath(); g.arc(j.sx + dx, j.sy + dy, 22, 0, Math.PI * 2); g.fill();
}

        <div class="btnrow"><button class="btn" data-act="save">Save now</button><button class="btn secondary" data-act="load">Load last save</button><button class="btn danger" data-act="reset">Reset…</button></div>
        ${this.confirmReset ? `<div class="confirm"><b>Start over?</b> This permanently deletes your hay, money and upgrades.<div class="btnrow" style="margin-top:8px"><button class="btn danger" data-act="reset-yes">Yes, reset</button><button class="btn secondary" data-act="reset-no">Cancel</button></div></div>` : ""}
      </div>`;
  },
  onClick(e) {
    const b = e.target.closest("button[data-act]"); if (!b || b.disabled) return;
    b.blur(); // keep keyboard focus off buttons so Space/E don't re-trigger them
    const act = b.dataset.act;
    if (act === "buy") return buyUpgrade(b.dataset.id);
    if (act === "buytool") return buyTool();
    if (act === "buycarrier") return buyCarrier();
    if (act === "research") return Research.start(b.dataset.id);
    if (act === "sow") return sowSeed(b.dataset.field, b.dataset.seed);
    if (act === "save") { Save.save(); toast("Game saved"); }
    if (act === "load") { if (Save.load()) { Sound.applySettings(); updateCamera(true); toast("Loaded last save"); this.render(); } else toast("No save found"); }
    if (act === "reset") { this.confirmReset = true; this.render(); }
    if (act === "reset-no") { this.confirmReset = false; this.render(); }
    if (act === "reset-yes") { Save.reset(); updateCamera(true); this.confirmReset = false; this.tab = "farm"; Save.save(true); toast("A fresh start on the meadow"); this.render(); }
  },
  onInput(e) {
    const k = e.target.dataset.set; if (!k) return;
    state.settings[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value / 100;
    const pct = e.target.parentElement.querySelector(".pct"); if (pct && e.target.type === "range") pct.textContent = e.target.value + "%";
    Sound.applySettings();
  },
  refreshLive(force) {
    const c = document.getElementById("content");
    c.querySelectorAll("[data-live]").forEach(el => { const f = LIVE[el.dataset.live]; if (f) { const v = String(f()); if (el.textContent !== v) el.textContent = v; } });
    c.querySelectorAll("[data-bar]").forEach(el => { const v = LIVE_BARS[el.dataset.bar](); el.children[0].style.width = (Math.min(1, v[0]) * 100) + "%"; el.children[1].style.width = (Math.min(1, v[1]) * 100) + "%"; });
    const key = String(state.money);
    if (!force && key === this.lastAfford) return; this.lastAfford = key;
    c.querySelectorAll("button[data-need=up]").forEach(b => { b.disabled = state.money < upgradeCost(UPGRADE_BY_ID[b.dataset.id]); });
    c.querySelectorAll("button[data-need=tool]").forEach(b => { const n = nextTool(); b.disabled = !n || state.money < n.cost; });
    c.querySelectorAll("button[data-need=carrier]").forEach(b => { const n = nextCarrier(); b.disabled = !n || state.money < n.cost; });
    c.querySelectorAll("button[data-need=research]").forEach(b => { b.disabled = !!state.research.active || state.money < RESEARCH_BY_ID[b.dataset.id].cost; });
    c.querySelectorAll("button[data-need=sow]").forEach(b => { b.disabled = state.money < +b.dataset.cost; });
  },
};

const Research = {
  update(dt) {
    const a = state.research.active; if (!a) return;
    const n = RESEARCH_BY_ID[a.id]; if (!n) { state.research.active = null; return; }
    a.t += dt;
    if (a.t >= n.time) {
      state.research.done[n.id] = true; state.research.active = null;
      Sound.upgrade(); toast(`${n.icon} Research done: ${n.name}` + (n.fx.seed ? " — sow it from the Land tab" : ""));
      Save.save(true); if (UI.isOpen) UI.render();
    }
  },
  start(id) {
    const n = RESEARCH_BY_ID[id]; if (!n || !researchReady(n) || state.research.active || !researchOpen()) return;
    if (!(UI.isOpen && UI.mode === "home") && !window.__testBuyAnywhere) { toast("🏠 Research is started from your farmhouse"); return; }
    if (state.money < n.cost) { Sound.bump(); return; }
    state.money -= n.cost; state.research.active = { id, t: 0 };
    Sound.upgrade(); UI.bump("money"); toast(`🔬 Researching ${n.name} — ${fmtTime(n.time)}`); Save.save(true); UI.render();
  },
};
// Sow a meadow with a researched seed mix: the meadow starts again as sprouts.
const sowCost = (plot, sd) => Math.round(plot.growth.length * sd.price);
function sowSeed(fieldId, seedId) {
  const plot = Field.byId(fieldId), sd = SEED_BY_ID[seedId];
  if (!plot || !plot.unlocked || !sd || state.seeds[fieldId] === seedId || (sd.research && !researched(sd.research))) return;
  if (!(UI.isOpen && UI.mode === "home") && !window.__testBuyAnywhere) { toast("🏠 Seed is ordered from your farmhouse"); return; }
  const cost = sowCost(plot, sd); if (state.money < cost) { Sound.bump(); return; }
  state.money -= cost; state.seeds[fieldId] = seedId; plot.growth.fill(0.05);
  Sound.upgrade(); UI.bump("money"); toast(`${sd.icon} ${plot.f.name} is sown with ${sd.name} — watch it come up`); Save.save(true); UI.render();
}
function buyUpgrade(id) {
  const u = UPGRADE_BY_ID[id]; if (!u || !isUnlocked(u) || lvl(id) >= u.maxLevel) return;
  if (!(UI.isOpen && UI.mode === "home") && !window.__testBuyAnywhere) { toast("🏠 Upgrades are bought inside your farmhouse"); return; }
  const cost = upgradeCost(u);
  if (state.money < cost) { Sound.bump(); return; }
  state.money -= cost; state.upgrades[id]++; state.stats.upgradesBought++;
  Sound.upgrade(); UI.bump("money");
  if (id === "cutters" || id === "haulers") { Helpers.sync(); toast(id === "cutters" ? "🌾 A neighbour has come to help cut the meadow" : "🧺 A neighbour will carry dried hay to the cart"); }
  else if (id === "buyfield2") { onFieldChanged(true); Helpers.list.forEach(h => { if (h.role === "cutter") h.state = "idle"; }); toast("🌾 Heygarður is yours — follow the track down the hill to the south-west"); }
  else if (id === "field2") { onFieldChanged(true); toast("🌱 Heygarður's wall moves out — new grass is sprouting"); }
  else if (id === "station") { rebuildObstacles(); if (bgCache) buildBackground(); toast("🔬 The research station is open — start a project in the Research tab, or press E at the station"); }
  else if (id === "shed") { rebuildObstacles(); if (bgCache) buildBackground(); toast("🛖 The hay shed is up beside Heygarður — Heygarður's hay dries there now"); }
  else if (id === "shedracks") { rebuildObstacles(); toast(`🪵 A new hesja beside the shed — ${shedRackCount()} racks there`); }
  else if (id === "rackcount") { rebuildObstacles(); toast(`🪵 A new hesja stands beside the barn — ${rackCount()} racks drying hay`); }
  else if (id === "field") { onFieldChanged(true); toast("🌱 The stone wall moves out — new grass is sprouting"); }
  else if (id === "vehicle") toast(`${getStats().vehicle.icon} Your new ${getStats().vehicle.name} is waiting by the road`);
  else toast(`${u.name} → level ${state.upgrades[id]}`);
  Save.save(true); UI.render();
}
function buyTool() {
  const n = nextTool(); if (!n) return;
  if (!(UI.isOpen && UI.mode === "home") && !window.__testBuyAnywhere) { toast("🏠 Tools are bought inside your farmhouse"); return; }
  if (state.money < n.cost) { Sound.bump(); return; }
  state.money -= n.cost; state.equipment = n.id; state.stats.upgradesBought++;
  Sound.upgrade(); UI.bump("money"); toast(`${n.icon} New tool: ${n.name}!`);
  Save.save(true); UI.render();
}
function buyCarrier() {
  const n = nextCarrier(); if (!n) return;
  if (!(UI.isOpen && UI.mode === "home") && !window.__testBuyAnywhere) { toast("🏠 Carriers are bought inside your farmhouse"); return; }
  if (state.money < n.cost) { Sound.bump(); return; }
  state.money -= n.cost; state.carrier = n.id; state.stats.upgradesBought++;
  Sound.upgrade(); UI.bump("money"); UI.bump("carry"); toast(`${n.icon} ${n.name} — carry ${n.cap} hay!`);
  Save.save(true); UI.render();
}
// Resize the meadow to the current expansion level. grow=true keeps cut/grown state and sprouts the new strip.
function onFieldChanged(grow) {
  applyFieldSize();
  Field.build(grow, grow ? 0.25 : 1);
  rebuildObstacles();
  if (bgCache) buildBackground();
}
let toastTimer = null;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }
function flashSaved() { const d = document.getElementById("savedot"); d.classList.add("show"); setTimeout(() => d.classList.remove("show"), 1500); }

/* ------------------------------ RESIZE ------------------------------- */
function onResize() { computeLayout(); buildBackground(); buildClouds(); }
window.addEventListener("resize", () => { clearTimeout(onResize._t); onResize._t = setTimeout(onResize, 120); });

/* ------------------------------- LOOP -------------------------------- */
let last = performance.now(), saveTimer = 0, uiTimer = 0, time = 0, unlockCheck = "";
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; time += dt;
  const s = getStats();

  // --- update
  Player.update(dt, Input.dir(), s.runSpeed);
  Places.update();
  Cart.update(dt);
  Helpers.update(dt);
  Field.update(dt, s.regrowTime);
  Harvester.update(dt);
  { const tl = currentTool(), cutting = Harvester.active() && carryTotal() < s.basket - 1e-6; Sound.updateEngine(tl.motor ? tl.art : null, cutting, Player.moving, dt); }
  { const d = Math.min(state.barn.fresh, s.dryRate * dt); state.barn.fresh -= d; state.barn.dried += d; }
  Research.update(dt);
  if (hasShed()) { const d = Math.min(state.shed.fresh, s.shedDryRate * dt); state.shed.fresh -= d; state.shed.dried += d; }
  FX.update(dt);
  for (const c of clouds) { c.x += c.v * dt; if (c.x > BG.x1) c.x = BG.x0 - c.w; }
  birdTimer -= dt;
  if (birdTimer <= 0) { birdTimer = 8 + Math.random() * 14; const dir = Math.random() < 0.5 ? 1 : -1; birds.push({ x: dir > 0 ? BG.x0 : BG.x1, y: -120 + Math.random() * 300, v: (35 + Math.random() * 25) * dir, ph: Math.random() * 6, s: 0.8 + Math.random() * 0.5 }); }
  for (const b of birds) { b.x += b.v * dt; b.ph += dt * 7; }
  for (let i = birds.length - 1; i >= 0; i--) if (birds[i].x < BG.x0 - 20 || birds[i].x > BG.x1 + 20) birds.splice(i, 1);
  if (document.visibilityState === "visible") state.stats.playTime += dt;
  updateCamera(false);

  // --- draw (world space)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#7f9db0"; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(DPR * cam.k, 0, 0, DPR * cam.k, DPR * cam.ox, DPR * cam.oy);
  ctx.drawImage(bgCache, BG.x0, BG.y0, BG.x1 - BG.x0, BG.y1 - BG.y0);
  for (const c of clouds) ctx.drawImage(c.img, c.x, c.y, c.w, c.h);
  ctx.strokeStyle = "rgba(60,64,70,0.75)"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
  for (const b of birds) { // gulls: white wings with dark tips, as in Hare Season
    const f = Math.sin(b.ph) * 4 * b.s, w = 9 * b.s;
    for (const sd of [-1, 1]) {
      ctx.fillStyle = sd < 0 ? "#f4f2f6" : "#e3dfea"; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + sd * w * 0.75, b.y - f - 1.5 * b.s); ctx.lineTo(b.x + sd * w * 0.7, b.y - f + 1.2 * b.s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#3a3540"; ctx.beginPath(); ctx.moveTo(b.x + sd * w * 0.72, b.y - f - 1.4 * b.s); ctx.lineTo(b.x + sd * w, b.y - f); ctx.lineTo(b.x + sd * w * 0.7, b.y - f + 1.1 * b.s); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#f4f2f6"; ctx.beginPath(); ctx.ellipse(b.x, b.y, 2.2 * b.s, 1.4 * b.s, 0, 0, Math.PI * 2); ctx.fill();
  }
  const mistA = 0.10 + 0.08 * Math.sin(time * 0.05), hz = WORLD.horizon;
  const mist = ctx.createLinearGradient(0, hz - 90, 0, hz + 30);
  mist.addColorStop(0, "rgba(235,240,240,0)"); mist.addColorStop(0.6, `rgba(235,240,240,${mistA})`); mist.addColorStop(1, "rgba(235,240,240,0)");
  ctx.fillStyle = mist; ctx.fillRect(BG.x0, hz - 90, BG.x1 - BG.x0, 120);

  Field.draw(ctx, time);
  Harvester.draw(ctx, time);
  // y-sorted world objects
  const objs = [{ y: WORLD.barn.y, d: drawBarn }, { y: WORLD.cart.park.y, d: drawCart }, { y: WORLD.house.y, d: drawHouse }, { y: Player.y, d: (g, t) => Player.draw(g, t) }, ...Helpers.drawList(),
    ...RACK_SLOTS.slice(0, rackCount()).map((r, i) => ({ y: r.y, d: (g, t) => drawRack(g, i, t) })),
    ...(lvl("station") >= 1 ? [{ y: WORLD.station.y, d: drawStation }] : []),
    ...(hasShed() ? [{ y: WORLD.shed.y, d: drawShed }, ...SHED_RACKS.slice(0, shedRackCount()).map((r, i) => ({ y: r.y, d: (g, t) => drawRack(g, i, t, SHED_RACKS, "shed") }))] : []),
    ...Field.active().map(pl => ({ y: pl.pilePos().y, d: (g, t) => drawPile(g, pl, t) }))];
  objs.sort((a, b) => a.y - b.y).forEach(o => o.d(ctx, time));
  FX.drawWorld(ctx);
  if (state.stats.actions === 0 && !Field.contains(Player.x, Player.y)) {
    const a = 0.75 + 0.25 * Math.sin(time * 2.5);
    const msg = document.body.classList.contains("touch") ? "← Drag to walk into the meadow" : "← Walk into the meadow (WASD / arrow keys)";
    let tx = Player.x; const ty = Player.y - 92;
    ctx.font = "800 15px Figtree, 'Segoe UI', system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const tw = ctx.measureText(msg).width + 28;
    { const vl = (0 - cam.ox) / cam.k + tw / 2 + 12, vr = (W - cam.ox) / cam.k - tw / 2 - 12; tx = Math.max(vl, Math.min(vr, tx)); } // keep the pill on screen
    ctx.globalAlpha = 0.85 + 0.15 * a;
    roundRect(ctx, tx - tw / 2, ty - 14, tw, 34, 14); ctx.fillStyle = "rgba(53,47,69,0.12)"; ctx.fill();
    roundRect(ctx, tx - tw / 2, ty - 17, tw, 34, 14); ctx.fillStyle = "rgba(251,249,253,0.94)"; ctx.fill();
    ctx.fillStyle = "#352f45"; ctx.fillText(msg, tx, ty + 0.5); ctx.globalAlpha = 1;
  }

  // --- screen-space fx
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.clearRect(0, 0, W, H);
  FX.drawScreen(fctx); drawJoystick(fctx);

  // --- ui & save
  UI.updateResources();
  uiTimer += dt;
  if (uiTimer > 0.15) {
    uiTimer = 0; UI.refreshLive();
    const u = UPGRADES.map(isUnlocked).join(""); // re-render when an upgrade unlocks
    if (u !== unlockCheck) { if (unlockCheck && ["farmer", "land", "buildings", "transport", "workers", "research"].includes(UI.tab)) UI.render(); unlockCheck = u; }
    UI.crewT = (UI.crewT || 0) + 0.15; if (UI.isOpen && UI.tab === "workers" && UI.crewT > 1) { UI.crewT = 0; UI.render(); } // live crew status
  }
  saveTimer += dt; if (saveTimer > CONFIG.autosaveSeconds) { saveTimer = 0; Save.save(); }
  requestAnimationFrame(frame);
}

/* ------------------------------- BOOT -------------------------------- */
Field.init();
Save.load();
onFieldChanged(false);
UI.init();
computeLayout(); buildBackground(); buildClouds();
window.addEventListener("pagehide", () => Save.save(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") Save.save(true); });
requestAnimationFrame(t => { last = t; frame(t); });

// Exposed for testing from the browser console.
window.__farm = { get state() { return state; }, getStats, Helpers, Sound, Field, Player, Places, Harvester, Cart, UI, TOOLS, buyTool, CARRIERS, buyCarrier, cam, WORLD, UPGRADES, buyUpgrade, barnAction, interact, Save };
</script>
