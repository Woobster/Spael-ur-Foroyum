<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ferry Season – Strandferðsla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-bleed low-poly 2D map of the real Faroes, HUD floats on top, vessel dock bottom-centre. Single committed look: pastel Faroese November. */
:root{
  --ink:#352f45;--ink-soft:#6c6580;
  --paper:rgba(251,249,253,.82);--paper-solid:#f7f4fa;--line:rgba(53,47,69,.12);
  --accent:#d9493a;--accent-ink:#fff;--blue:#2c5597;--gold:#f0b23a;--mist:#dcd5e6;--white:#fff;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --ui:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--mist);color:var(--ink);font-family:var(--ui)}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:var(--ui)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:fixed;inset:0;pointer-events:none}

.topleft{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.money{display:flex;align-items:center;gap:8px;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 14px 7px 8px;border-radius:999px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;box-shadow:0 2px 10px rgba(53,47,69,.12);transition:transform .12s}
.money .coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a3,var(--gold) 60%,#c98a1c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.money small{font-size:13px;color:var(--ink-soft);font-weight:700}
.money.over b{color:var(--accent)}
.money.bump{transform:scale(1.08)}
.rate{font-size:12px;font-weight:700;color:var(--ink);background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums;box-shadow:0 2px 10px rgba(53,47,69,.08)}
.rate b{font-weight:800}
.rate .late{color:var(--accent)}
.areaBtn{pointer-events:auto;display:flex;align-items:baseline;gap:8px;border:0;cursor:pointer;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 6px 6px 12px;border-radius:999px;font:800 14px var(--ui);color:var(--ink);box-shadow:0 2px 10px rgba(53,47,69,.12)}
.areaBtn span{font-size:12px;font-weight:700;color:var(--ink-soft)}
.areaBtn .go{background:var(--blue);color:var(--white);padding:3px 9px;border-radius:99px;font-size:11px;letter-spacing:.06em}

.topright{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:center}
.lang{pointer-events:auto;display:inline-flex;padding:3px;border-radius:999px;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(53,47,69,.12)}
.lang button{border:0;background:transparent;border-radius:999px;padding:6px 10px;font:800 12px var(--ui);letter-spacing:.08em;color:var(--ink-soft);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.iconBtn{pointer-events:auto;width:40px;height:40px;border:0;border-radius:50%;background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(53,47,69,.12);display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
.iconBtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconBtn:hover{filter:brightness(1.04)}

.counter{position:absolute;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--display);color:var(--white);font-size:clamp(34px,5.5vw,62px);line-height:1;white-space:nowrap;text-shadow:0 3px 0 rgba(53,47,69,.18),0 6px 24px rgba(53,47,69,.25);display:flex;gap:.22em;align-items:baseline;font-variant-numeric:tabular-nums}
.counter span{font-size:.48em}
.counter.bump b{display:inline-block;animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}

#floaters{position:absolute;inset:0;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:20px;color:#ffe08a;text-shadow:0 2px 0 rgba(53,47,69,.3);white-space:nowrap;animation:floatUp 1s ease-out forwards}
.fl.gold{color:var(--gold);font-size:26px}
.fl.bad{color:#ffd2cc;font-size:18px}
.fl.white{color:#fff;font-size:24px;text-shadow:0 0 14px #9fc3ff,0 2px 0 rgba(53,47,69,.35)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

.hint{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;text-align:center;box-shadow:0 4px 20px rgba(53,47,69,.15);transition:opacity .6s;width:max-content;max-width:min(88vw,440px)}
.hint small{display:block;font-weight:600;color:var(--ink-soft);font-size:12px;margin-top:3px}
.hint.gone{opacity:0}

#toasts{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(90vw,440px)}
.toast{background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:9px 16px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 4px 20px rgba(53,47,69,.15);text-align:center;animation:tin .3s ease both}
.toast small{display:block;font-weight:600;font-size:12px;color:var(--ink-soft)}
.toast.warn{box-shadow:inset 0 0 0 2px rgba(217,73,58,.35),0 4px 20px rgba(53,47,69,.15)}
.toast.out{animation:tout .4s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

/* dock */
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--paper);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(53,47,69,.18);white-space:nowrap}
#toks{display:flex;gap:2px}
.tok{position:relative;border:0;background:transparent;border-radius:999px;height:46px;padding:0 12px 0 8px;display:flex;align-items:center;gap:6px;font:800 13px var(--ui);color:var(--ink);cursor:pointer;transition:background .15s}
.tok:hover{background:rgba(53,47,69,.06)}
.tok svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tok em{font-style:normal;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:99px;background:rgba(44,85,151,.1);color:var(--blue);display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.tok.sel{background:var(--blue);color:var(--white)}
.tok.sel em{background:rgba(255,255,255,.22);color:var(--white)}
.tok.empty em{background:rgba(53,47,69,.1);color:var(--ink-soft)}
.goBtn{border:0;border-radius:999px;height:46px;padding:0 18px;font:400 18px var(--display);background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:6px;transition:transform .08s,filter .15s}
.goBtn:hover{filter:brightness(1.07)}
.goBtn:active{transform:translateY(1px)}
.goBtn svg{width:18px;height:18px;fill:currentColor}
.goBtn.ready{animation:ready 1s ease-in-out infinite alternate}
.goBtn.run{background:rgba(53,47,69,.08);color:var(--ink);box-shadow:none;font:800 14px var(--ui);padding:0 14px}
@keyframes ready{to{transform:scale(1.06)}}
.spdBtn{border:0;border-radius:999px;height:46px;min-width:50px;background:rgba(53,47,69,.08);font:800 14px var(--ui);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.spdBtn.fast{background:rgba(240,178,58,.3)}

/* pop-up cards */
.pop{position:fixed;z-index:5;width:max-content;min-width:200px;max-width:min(300px,88vw);background:var(--paper-solid);border-radius:16px;box-shadow:0 10px 34px rgba(53,47,69,.28);padding:12px 14px;font-size:13px;font-weight:600;animation:popIn .22s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.85)}}
.pop h3{margin:0;font:400 21px var(--display);line-height:1.1}
.pop .sub{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.pop p{margin:8px 0 0;line-height:1.4}
.pop .pill{display:inline-block;font-size:11px;font-weight:800;color:var(--blue);background:rgba(44,85,151,.1);padding:2px 8px;border-radius:99px;margin-top:6px}
.pop ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.pop li{display:flex;align-items:center;gap:6px}
.pop .dot{width:10px;height:10px;border-radius:3px;flex:none}
.pop button.rm{margin-top:10px;width:100%;border:0;border-radius:10px;padding:9px;font:800 13px var(--ui);background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}

/* modals (Sheep Season sheets) */
#fade{position:fixed;inset:0;background:var(--mist);opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(53,47,69,.35);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .sheet{width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--paper-solid);border-radius:20px;box-shadow:0 20px 60px rgba(53,47,69,.35);animation:popIn .3s cubic-bezier(.2,1.4,.4,1) both}
.modal header{display:flex;align-items:baseline;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper-solid);z-index:1}
.modal h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05}
.modal .sub{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em}
.modal .x{margin-left:auto;border:0;background:transparent;font-size:28px;line-height:1;cursor:pointer;color:var(--ink);padding:0 4px}
#levels{display:flex;flex-direction:column;padding:8px 10px}
.area{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 10px;border-radius:14px}
.area+.area{border-top:1px solid var(--line)}
.area .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--white);color:var(--blue);box-shadow:inset 0 0 0 1px var(--line)}
.area.here{background:rgba(44,85,151,.08)}
.area.here .n{background:var(--blue);color:var(--white)}
.area.locked{opacity:.55}
.area .t{min-width:0}
.area .t b{font-size:16px;font-weight:800}
.area .t small{display:block;font-size:12px;color:var(--ink-soft);font-weight:700}
.area .t p{margin:3px 0 0;font-size:12.5px;line-height:1.35;font-weight:600}
.area .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center}
.area .mul{display:inline-block;font-size:11px;font-weight:800;color:var(--blue);background:rgba(44,85,151,.1);padding:2px 7px;border-radius:99px}
.mini-stars{font-size:14px;letter-spacing:1px;color:rgba(53,47,69,.2)}
.mini-stars i{font-style:normal}
.mini-stars i.on{color:var(--gold)}
.area button{border:0;border-radius:10px;padding:9px 12px;min-width:86px;font:800 13px var(--ui);background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.area button.go2{background:var(--blue)}
.area button:disabled{background:rgba(53,47,69,.12);color:var(--ink-soft);cursor:default;box-shadow:none}
.goal{margin:4px 20px 18px;padding:12px 14px;border-radius:14px;background:rgba(240,178,58,.18);font-size:13px;font-weight:700;line-height:1.45}
.brief{padding:14px 20px 20px}
.brief .teach{padding:12px 14px;border-radius:14px;background:rgba(240,178,58,.18);font-size:14px;font-weight:700;line-height:1.45}
.brief dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:14px 0 6px;font-size:14px}
.brief dt{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;padding-top:3px}
.brief dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.brief .fact{font-size:12.5px;color:var(--ink-soft);font-weight:600;line-height:1.4;margin:10px 0 16px}
.bigBtn{border:0;border-radius:12px;padding:12px 22px;font:400 20px var(--display);background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bigBtn.blue{background:var(--blue)}
.bigBtn.soft{background:rgba(53,47,69,.08);color:var(--ink);box-shadow:none;font:800 15px var(--ui)}
.win{text-align:center;padding:28px 24px 24px;position:relative;overflow:hidden}
.win h2{font-size:38px}
.win p{font-size:15px;line-height:1.5;margin:10px auto 6px;max-width:40ch;font-weight:600}
.trophy{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff,#e9eef7 55%,#b9c7de);box-shadow:0 0 0 6px rgba(255,255,255,.7),0 8px 24px rgba(44,85,151,.3);display:grid;place-items:center}
.trophy svg{width:36px;height:36px;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stars{display:flex;justify-content:center;gap:10px;margin:10px 0 6px}
.star{width:46px;height:46px;background:rgba(53,47,69,.14);clip-path:polygon(50% 2%,62% 36%,98% 37%,69% 59%,80% 95%,50% 74%,20% 95%,31% 59%,2% 37%,38% 36%)}
.star.on{background:linear-gradient(180deg,#ffe7a3,var(--gold) 60%,#d8962a);animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starIn{from{transform:scale(.2) rotate(-20deg);opacity:0}}
.checks{list-style:none;padding:0;margin:8px auto 18px;max-width:340px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.checks li{display:flex;gap:8px;align-items:baseline}
.checks li b{width:20px;flex:none;text-align:center}
.checks li.no{color:var(--ink-soft)}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.confetti{position:absolute;left:50%;top:64px;width:10px;height:10px;pointer-events:none;clip-path:polygon(50% 0,100% 100%,0 100%);animation:conf 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (max-width:760px){
  .area{grid-template-columns:34px minmax(0,1fr)}
  .area button{grid-column:2;justify-self:start}
  .money{font-size:17px}
  #toasts{top:calc(126px + env(safe-area-inset-top,0px))}
}
@media (max-width:520px){
  .tok .tl{display:none}
  .tok{padding:0 8px 0 6px}
  .goBtn{padding:0 14px;font-size:16px}
  .counter{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .hint{bottom:calc(136px + env(safe-area-inset-bottom,0px));font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .fl,.goBtn.ready,.star.on,.confetti,.pop{animation-duration:.01s!important}
}
</style>
</head>
<body>
<canvas id="map" tabindex="0" aria-label="Map of the Faroe Islands. Drag from one harbour or helipad to another to draw a route."></canvas>
<div id="hud">
  <div class="topleft">
    <div class="money" id="moneyPill"><span class="coin"></span><b id="budget">0</b><small id="budgetLbl">kr left</small></div>
    <div class="rate" id="clock">07:00</div>
    <button id="areaBtn" class="areaBtn" type="button"><b id="lvName">Nólsoy</b><span id="lvDate">3 November</span><span class="go" data-t="map">Map</span></button>
  </div>
  <div class="topright">
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="fo" aria-pressed="false">FO</button></div>
    <button id="restartBtn" class="iconBtn" type="button" aria-label="Restart level"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    <button id="soundBtn" class="iconBtn" type="button" aria-label="Sound"><svg viewBox="0 0 24 24" id="soundIco"></svg></button>
  </div>
  <div id="toasts"></div>
  <div class="counter" id="counter"><b id="count">0</b><span id="countUnit">/ 0 delivered</span></div>
  <div id="hint" class="hint" hidden></div>
  <div id="floaters"></div>
</div>
<div id="dock"><div id="toks"></div><button id="goBtn" class="goBtn" type="button"></button><button id="spdBtn" class="spdBtn" type="button" aria-label="Speed">×1</button></div>
<div id="pop" class="pop" hidden></div>
<div id="fade"></div>

<div id="briefWrap" class="modal" hidden><div class="sheet" role="dialog" aria-labelledby="briefTitle"><header><h2 id="briefTitle"></h2><span class="sub" id="briefSub"></span></header><div class="brief" id="brief"></div></div></div>
<div id="levelsWrap" class="modal" hidden><div class="sheet" role="dialog" aria-labelledby="levelsTitle"><header><h2 id="levelsTitle">Strandferðsla</h2><span class="sub" data-t="span">3 Nov – 12 Mar</span><button class="x" id="levelsClose" aria-label="Close">×</button></header><div id="levels"></div><div class="goal" id="levelsGoal"></div></div></div>
<div id="winWrap" class="modal" hidden><div class="sheet win" role="dialog" aria-labelledby="winTitle"><div class="trophy"><svg viewBox="0 0 24 24"><path d="M3 15l2 4h14l2-4z"/><path d="M6 15v-4h9l3 4"/><path d="M9 11V8h4v3"/></svg></div><h2 id="winTitle"></h2><div class="stars" id="winStars"></div><ul class="checks" id="winChecks"></ul><div class="btnrow" id="winBtns"></div></div></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ======================= GEOGRAPHY ======================= */
// Real coordinates (lon, lat), projected to kilometres. Outlines are simplified on purpose.
const proj=(lon,lat)=>({x:(lon+7.80)*52.3,y:(62.42-lat)*111.2});
const ISLAND_LL={

function pip(P,x,y){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c;}return c;}

function segDist(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;let t=((px-a.x)*dx+(py-a.y)*dy)/l2;t=clamp(t,0,1);return Math.hypot(px-a.x-dx*t,py-a.y-dy*t);}
function edgeDist(P,x,y){let m=1e9;for(let i=0,j=P.length-1;i<P.length;j=i++)m=Math.min(m,segDist(x,y,P[j],P[i]));return m;}

/* ======================= POLYLINES ======================= */
function polyLen(P){let s=0;for(let i=1;i<P.length;i++)s+=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);return s;}
function pointAt(P,d){for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],l=Math.hypot(b.x-a.x,b.y-a.y);if(d<=l||i===P.length-1){const t=l?clamp(d/l,0,1):0;return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,ang:Math.atan2(b.y-a.y,b.x-a.x)};}d-=l;}return {x:P[0].x,y:P[0].y,ang:0};}
function samples(P,step){const out=[];const L=polyLen(P);for(let d=0;d<=L;d+=step)out.push(pointAt(P,d));out.push(P[P.length-1]);return out;}
function rdp(P,eps){if(P.length<3)return P.slice();let m=0,idx=0;const a=P[0],b=P[P.length-1];for(let i=1;i<P.length-1;i++){const d=segDist(P[i].x,P[i].y,a,b);if(d>m){m=d;idx=i;}}
  if(m>eps){const l=rdp(P.slice(0,idx+1),eps),r=rdp(P.slice(idx),eps);return l.slice(0,-1).concat(r);}return [a,b];}
function overLand(P,a,b,ex){const EX=ex||0.85;for(const s of samples(P,0.2)){if(Math.hypot(s.x-a.x,s.y-a.y)<EX||Math.hypot(s.x-b.x,s.y-b.y)<EX)continue;if(landAt(s.x,s.y))return true;}return false;}
function makeRoute(kind,stops,segs,id){
  const segsR=segs.map(s=>s.slice().reverse());const lens=segs.map(polyLen);const len=lens.reduce((a,b)=>a+b,0);
  return {id,kind,stops,segs,segsR,lens,len,cost:routeCost(kind,len)};
}

/* ======================= SIMULATION ======================= */
// Pure, deterministic; the game runs one and the par solver runs another to set targets.
function Sim(L,opt){
  opt=opt||{};const ev=opt.ev||{};
  const S={t:0,items:[],vessels:[],routes:[],done:false,finish:null,delivered:0};
  const cache=new Map();
  let iid=0,vid=0;
  for(const [type,from,to,n,at] of L.demand)for(let i=0;i<n;i++)S.items.push({id:iid++,type,from,to,at:at||0,node:from,state:(at||0)>0?'pending':'wait',v:null,alight:null});
  const fogs=L.fogs.map(f=>Object.assign({},f,{began:false})),storms=L.storms.map(s=>Object.assign({},s,{warned:false,began:false,ended:false})),breaks=L.breaks.map(b=>Object.assign({},b,{fired:false}));
  S.fogs=fogs;S.storms=storms;
  const fogI=(f,t)=>t<f.t0||t>f.t1?0:Math.min(1,(t-f.t0)/25,(f.t1-t)/25);
  const fogC=(f,t)=>({x:f.x+f.vx*Math.max(0,t-f.t0),y:f.y+f.vy*Math.max(0,t-f.t0)});
  S.fogI=fogI;S.fogC=fogC;
  function inFog(x,y){for(const f of fogs){const I=fogI(f,S.t);if(I<0.35)continue;const c=fogC(f,S.t);if(((x-c.x)/f.rx)**2+((y-c.y)/f.ry)**2<1)return true;}return false;}
  const stormOn=s=>S.t>=s.t0&&S.t<s.t1;
  function inStorm(x,y){for(const s of storms){if(!stormOn(s))continue;if(((x-s.x)/s.rx)**2+((y-s.y)/s.ry)**2<1)return true;}return false;}
  function dist(dest,type){const key=dest+type;let D=cache.get(key);if(D)return D;
    const adj={};for(const r of S.routes){if(!KIND[r.kind].carries.includes(type))continue;for(const a of r.stops){adj[a]=adj[a]||new Set();for(const b of r.stops)if(a!==b)adj[a].add(b);}}
    D=new Map([[dest,0]]);const q=[dest];while(q.length){const a=q.shift();for(const b of (adj[a]||[]))if(!D.has(b)){D.set(b,D.get(a)+1);q.push(b);}}
    cache.set(key,D);return D;}
  function boardTarget(it,r,node){if(!KIND[r.kind].carries.includes(it.type))return null;const D=dist(it.to,it.type);let best=D.has(node)?D.get(node):Infinity,bs=null;
    for(const s of r.stops){if(s===node)continue;const d=D.has(s)?D.get(s):Infinity;if(d<best||(d===best&&bs!==null&&s===it.to)){best=d;bs=s;}}return bs;}
  const loadSize=v=>v.load.reduce((a,i)=>a+SIZE[i.type],0);
  function unloadAt(v,node){let n=0;for(const it of v.load.slice()){if(it.to===node){it.state='done';it.node=node;it.v=null;v.load.splice(v.load.indexOf(it),1);S.delivered++;n++;ev.deliver&&ev.deliver(it,node,v);}
      else if(it.alight===node){it.state='wait';it.node=node;it.v=null;it.alight=null;v.load.splice(v.load.indexOf(it),1);n++;}}return n;}
  function loadAt(v,node){const K=KIND[v.kind];let used=loadSize(v),n=0;
    for(const it of S.items){if(it.state!=='wait'||it.node!==node)continue;if(used+SIZE[it.type]>K.cap)continue;const tg=boardTarget(it,v.r,node);if(tg==null)continue;
      it.state='aboard';it.v=v;it.alight=tg===it.to?null:tg;v.load.push(it);used+=SIZE[it.type];n++;}return n;}
  function workStops(r){const out=[];r.stops.forEach((s,k)=>{for(const it of S.items)if(it.state==='wait'&&it.node===s&&boardTarget(it,r,s)!=null){out.push(k);break;}});return out;}
  function leg(r,a,b){return b>a?r.segs[a]:r.segsR[b];}
  function blocked(v,P){const K=KIND[v.kind];const sm=samples(P,0.5);
    if(storms.some(stormOn)&&sm.some(p=>inStorm(p.x,p.y)))return 'storm';
    if(!K.sea&&(inFog(v.x,v.y)||sm.some(p=>inFog(p.x,p.y))))return 'fog';return null;}
  S.addRoute=function(r){S.routes.push(r);cache.clear();const K=KIND[r.kind];const used=S.vessels.filter(v=>v.kind===r.kind).length;const n0=NODES[r.stops[0]];
    const v={id:vid++,r,kind:r.kind,name:K.names[used%K.names.length],x:n0.x,y:n0.y,ang:-Math.PI/2,k:0,dir:1,state:'dock',timer:1.5,load:[],hold:null,brokenT:0,breakPending:0,from:0,to:0,leg:null,legLen:0,d:0};
    if(r.segs[0]){const p=pointAt(r.segs[0],0.3);v.ang=p.ang;}
    S.vessels.push(v);r.v=v;return v;};
  S.removeRoute=function(r){const i=S.routes.indexOf(r);if(i<0)return;S.routes.splice(i,1);cache.clear();const v=r.v;
    if(v){const at=v.state==='sail'?r.stops[v.d<v.legLen/2?v.from:v.to]:r.stops[v.k];for(const it of v.load){it.state='wait';it.node=at;it.v=null;it.alight=null;}v.load.length=0;S.vessels.splice(S.vessels.indexOf(v),1);}
    for(const w of S.vessels)for(const it of w.load)if(it.alight&&!w.r.stops.includes(it.alight))it.alight=null;};
  S.inFog=inFog;S.inStorm=inStorm;S.stormOn=stormOn;S.loadSize=loadSize;
  // cargo that no current route (or chain of routes) can carry to its destination
  S.stranded=it=>it.state==='wait'&&!dist(it.to,it.type).has(it.node);
  function updateVessel(v,h){
    const r=v.r,K=KIND[v.kind];
    if(v.state==='broken'){v.brokenT-=h;if(v.brokenT<=0){v.state='dock';v.timer=1;ev.fixed&&ev.fixed(v);}return;}
    if(v.state!=='sail'){
      if(v.breakPending>0){v.state='broken';v.brokenT=v.breakPending;v.breakPending=0;v.hold=null;return;}
      const node=r.stops[v.k];const n=loadAt(v,node);if(n)v.timer=Math.max(v.timer,0)+0.4*n;
      if(v.state==='dock'){v.timer-=h;if(v.timer>0)return;v.state='idle';}
      if(!v.load.length){const w=workStops(r);if(!w.length){v.state='idle';v.hold=null;return;}
        let best=w[0];for(const k of w)if(Math.abs(k-v.k)<Math.abs(best-v.k))best=k;if(best>v.k)v.dir=1;else if(best<v.k)v.dir=-1;}
      let nk=v.k+v.dir;if(nk<0||nk>=r.stops.length){v.dir*=-1;nk=v.k+v.dir;}
      const P=leg(r,v.k,nk);const why=blocked(v,P);if(why){v.state='hold';v.hold=why;return;}

// Build the leg from the last stop to harbour `id`. Sea legs try the drawn path as-is, then with the wobble inside the snap circle trimmed.
function legTo(d,id){const a=NODES[d.stops[d.stops.length-1]],b=NODES[id];
  if(!KIND[d.kind].sea)return [{x:a.x,y:a.y},{x:b.x,y:b.y}];

function drawFog(g,t){const sim=G.sim;for(const f of sim.fogs){const I=sim.fogI(f,sim.t);if(I<=0.01)continue;const c=sim.fogC(f,sim.t);const s=toS(c.x,c.y),rx=f.rx*VIEW.k,ry=f.ry*VIEW.k;

function drawStorms(g,t){const sim=G.sim;for(const st of sim.storms){const s=toS(st.x,st.y),rx=st.rx*VIEW.k,ry=st.ry*VIEW.k;

function landRuns(d){// which parts of the drawn path are over land (ignoring the area right around harbours)

  return P.map(p=>{if(Math.hypot(p.x-a.x,p.y-a.y)<ex)return false;const q=toS(p.x,p.y);return !!landAt(p.x,p.y)&&!nodeAt(q.x,q.y,SNAP*0.9);});}
function drawPreview(g,t){const d=G.draw;if(!d)return;const K=KIND[d.kind];const bad=d.partBad;
  const pts=[];d.segs.forEach((sg,i)=>sg.forEach((p,j)=>{if(i>0&&j===0)return;pts.push(p);}));const last=NODES[d.stops[d.stops.length-1]];
  if(!pts.length)pts.push({x:last.x,y:last.y});
  if(K.sea)pts.push(...d.raw);pts.push(d.cur);
  g.lineCap='round';g.lineJoin='round';g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=9;g.setLineDash([]);
  const stroke=()=>{g.beginPath();pts.forEach((p,i)=>{const s=toS(p.x,p.y);i?g.lineTo(s.x,s.y):g.moveTo(s.x,s.y);});g.stroke();};stroke();
  g.strokeStyle=K.col;g.globalAlpha=0.85;g.lineWidth=5;g.setLineDash(d.kind==='heli'?[7,7]:[]);stroke();g.setLineDash([]);g.globalAlpha=1;

  let len=0;for(const sg of d.segs)len+=polyLen(sg);len+=polyLen([{x:last.x,y:last.y},...(K.sea?d.raw:[]),d.cur]);

  const bx=clamp(c.x-w/2,6,W-w-6),by=clamp(c.y-(bad?86:62),6,H-h-6);g.fillStyle=bad?'#e8352a':'rgba(251,249,253,.94)';g.beginPath();g.roundRect?g.roundRect(bx,by,w,h,h/2):g.rect(bx,by,w,h);g.fill();
  g.fillStyle=bad?'#ffffff':'#352f45';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,bx+w/2,by+h/2+0.5);

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-(frame.last||now))/1000);frame.last=now;const t=now/1000;
  if(!G)return;
  if(G.phase==='run'&&!G.paused&&!anyModal())G.sim.step(dt*4*G.speed);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.drawImage(cache,0,0,W,H);
  // glints
  ctx.strokeStyle='#f4f8fb';ctx.lineWidth=1.4;ctx.lineCap='round';for(const gl of G.glints){const a=Math.max(0,Math.sin(t*0.7+gl.ph));if(a<0.05)continue;ctx.globalAlpha=a*0.7;ctx.beginPath();ctx.moveTo(gl.x-gl.l/2,gl.y);ctx.lineTo(gl.x+gl.l/2,gl.y);ctx.stroke();}ctx.globalAlpha=1;
  // routes
  for(const r of G.routes){const grow=clamp((now-r.born)/350,0,1);drawRoutePath(ctx,r,0.9,reduceMotion?1:1-Math.pow(1-grow,3));}
  // wakes
  for(const v of G.sim.vessels){if(v.state==='sail'&&KIND[v.kind].sea&&G.phase==='run'&&!G.paused&&Math.random()<0.5){G.wakes.push({x:v.x-Math.cos(v.ang)*0.4,y:v.y-Math.sin(v.ang)*0.4,t:0,s:rand(0.6,1.2)});}}
  ctx.fillStyle='#fff';for(const w of G.wakes){w.t+=dt;const s=toS(w.x,w.y);ctx.globalAlpha=0.55*(1-w.t/1.1);ctx.beginPath();ctx.arc(s.x,s.y,(1.2+w.t*4)*w.s,0,7);ctx.fill();}ctx.globalAlpha=1;G.wakes=G.wakes.filter(w=>w.t<1.1);if(G.wakes.length>240)G.wakes.splice(0,G.wakes.length-240);
  // ripples
  for(const r of G.ripples){r.t+=dt;const s=toS(r.x,r.y),k=r.t/0.8;ctx.globalAlpha=0.85*(1-k);ctx.strokeStyle=r.c;ctx.lineWidth=3*(1-k)+0.5;ctx.beginPath();ctx.arc(s.x,s.y,10+k*28,0,7);ctx.stroke();}ctx.globalAlpha=1;G.ripples=G.ripples.filter(r=>r.t<0.8);

$('#levels').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;closeLevels();travel(+b.dataset.go);});
function travel(i){const f=$('#fade');f.classList.add('on');setTimeout(()=>{loadLevel(i,true);applyStatic();setTimeout(()=>f.classList.remove('on'),80);},360);}

/* win */
function showWin(){if(!G||G.phase!=='done'||!$('#winWrap').hidden)return;const L=G.L,sim=G.sim;
  const okB=G.spent<=L.budget,okT=sim.finish<=L.target;const stars=1+(okB?1:0)+(okB&&okT?1:0);
  if(stars>(SAVE.stars[G.idx]|0))SAVE.stars[G.idx]=stars;save();
  const last=G.idx===LEVELS.length-1;$('#winTitle').textContent=L.win?(LANG==='fo'?L.winFo:L.win):(last?tr('winFinal'):tr('winT'));
  $('#winStars').innerHTML=[0,1,2].map(i=>`<div class="star${i<stars?' on':''}" style="animation-delay:${0.25+i*0.28}s"></div>`).join('');
  $('#winChecks').innerHTML=`<li><b>✓</b>${tr('chk1')}</li><li class="${okB?'':'no'}"><b>${okB?'✓':'–'}</b>${tr('chk2')(G.spent,L.budget)}</li><li class="${okT?'':'no'}"><b>${okT?'✓':'–'}</b>${tr('chk3')(fmtClock(sim.finish),fmtClock(L.target))}</li>`;
  const hasNext=!last;$('#winBtns').innerHTML=`<button type="button" class="bigBtn soft" data-w="replay">${tr('replay')}</button>${hasNext?`<button type="button" class="bigBtn" data-w="next">${tr('next')}</button>`:`<button type="button" class="bigBtn blue" data-w="levels">${tr('levels')}</button>`}`;
  $('#winWrap').hidden=false;sfx.win();for(let i=0;i<stars;i++)setTimeout(()=>sfx.star(i),300+i*280);
  const sh=$('#winWrap .win');sh.querySelectorAll('.confetti').forEach(c=>c.remove());if(!reduceMotion)for(let i=0;i<28;i++){const c=document.createElement('i');c.className='confetti';const a=rand(0,Math.PI*2),d=rand(70,180);c.style.setProperty('--dx',Math.cos(a)*d+'px');c.style.setProperty('--dy',Math.sin(a)*d*0.7+40+'px');c.style.setProperty('--r',rand(-400,400)+'deg');c.style.background=['#f0b23a','#d9493a','#2c5597','#a9b77f','#ffffff'][i%5];c.style.animationDelay=rand(0,0.15)+'s';sh.appendChild(c);}}
$('#winBtns').addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;$('#winWrap').hidden=true;const w=b.dataset.w;if(w==='replay')travel(G.idx);else if(w==='next')travel(G.idx+1);else openLevels();});

/* misc buttons */
$('#restartBtn').addEventListener('click',()=>{initAudio();travel(G.idx);});
$('#soundBtn').addEventListener('click',()=>{initAudio();SAVE.sound=!SAVE.sound;if(master)master.gain.value=SAVE.sound?0.55:0;save();applyStatic();});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;save();applyStatic();renderDock();applyHUD();updateHint();if(G.pop)closePop();if(!$('#levelsWrap').hidden)renderLevels();if(!$('#briefWrap').hidden)openBrief();buildStatic();}));
addEventListener('pagehide',save);

/* ======================= START ======================= */
resize();
loadLevel(clamp(unlocked(SAVE.last)?SAVE.last:0,0,LEVELS.length-1),true);
applyStatic();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(G)buildStatic();});
requestAnimationFrame(frame);

window.__ferry={get G(){return G;},LEVELS,NODES,loadLevel,startRun,
  build(kind,stops){const segs=[];for(let k=1;k<stops.length;k++)segs.push([{x:NODES[stops[k-1]].x,y:NODES[stops[k-1]].y},{x:NODES[stops[k]].x,y:NODES[stops[k]].y}]);return addRoute(kind,stops,segs);},
  step(min){G.sim.step(min);},landAt,toS,overLand};
})();
</script>

     Edit this block in shared/spael-bar.html, then run:  python3 tools/sync-bar.py
     That copies it into every game, so all games stay the same. -->
<style>

   --spael-left / --spael-bottom (desktop, bottom-left)   --spael-m-top / --spael-m-left / --spael-m-right (phones) */
#spaelBar{position:fixed;z-index:60;left:var(--spael-left,calc(14px + env(safe-area-inset-left,0px)));bottom:var(--spael-bottom,calc(14px + env(safe-area-inset-bottom,0px)));display:flex;gap:4px;align-items:center;padding:4px;border-radius:999px;background:rgba(251,249,253,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(53,47,69,.16);font:800 13px Figtree,"Segoe UI",system-ui,sans-serif;color:#352f45;-webkit-user-select:none;user-select:none}
#spaelBar a,#spaelBar button{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border-radius:999px;cursor:pointer;color:inherit;font:inherit;line-height:1;white-space:nowrap}
#spaelBar a{padding:0 13px 0 10px;background:#2c5597;color:#fff}
#spaelBar a:hover{filter:brightness(1.1)}

#spaelBar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#spaelBar .off{color:rgba(53,47,69,.42)}
#spaelBar .slash{display:none}
#spaelBar .off .slash{display:inline}
#spaelBar .lbl{display:none}
@media (min-width:900px){#spaelBar button .lbl{display:inline;font-size:12px;font-weight:700}}
#spaelMore{display:none!important}
@media (max-width:760px){
 #spaelBar{bottom:auto;top:var(--spael-m-top,calc(12px + env(safe-area-inset-top,0px)));left:var(--spael-m-left,auto);right:var(--spael-m-right,calc(12px + env(safe-area-inset-right,0px)));flex-direction:column;align-items:stretch;padding:3px;border-radius:22px}
 #spaelMore{display:inline-flex!important}
 #spaelBar:not(.open)>:not(#spaelMore){display:none}
 #spaelBar .ic-x{display:none}#spaelBar.open .ic-x{display:inline}#spaelBar.open .ic-dots{display:none}
}

<nav id="spaelBar" aria-label="Game menu">
  <button id="spaelMore" type="button" aria-expanded="false" aria-controls="spaelBar"><svg viewBox="0 0 24 24"><g class="ic-dots"><path d="M4 7h16M4 12h16M4 17h16"/></g><g class="ic-x"><path d="M6 6l12 12M18 6L6 18"/></g></svg></button>
  <a id="spaelHome" href="../index.html"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="spaelHomeT">Menu</span></a>
  <button id="spaelMusic" type="button" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path class="slash" d="M3 3l18 18"/></svg><span class="lbl" id="spaelMusicT">Music</span></button>
  <button id="spaelSfx" type="button" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/><path class="slash" d="M3 3l18 18"/></svg><span class="lbl" id="spaelSfxT">Effects</span></button>
</nav>
<script>
/* Shared menu bar. Settings are shared by every game on the site:
   spael-music / spael-sfx = 'on' | 'off'. The game listens for the "spael:sfx" event to mute its own effects. */
(function(){
"use strict";
const TXT={en:{home:'Menu',homeA:'Back to all games',music:'Music',sfx:'Effects',on:'on',off:'off',more:'Menu, music and sound'},
           fo:{home:'Forsíða',homeA:'Aftur til øll spølini',music:'Tónleikur',sfx:'Ljóð',on:'tendrað',off:'sløkt',more:'Forsíða, tónleikur og ljóð'}};
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v==='on';}catch(e){return d;}};
const put=(k,v)=>{try{localStorage.setItem(k,v?'on':'off');}catch(e){}};
let music=get('spael-music',true),sfx=get('spael-sfx',true);
const $=id=>document.getElementById(id);
const L=()=>((document.documentElement.lang||'en').toLowerCase().startsWith('fo')?TXT.fo:TXT.en);
function paint(){const t=L();$('spaelMore').setAttribute('aria-label',t.more);$('spaelMore').title=t.more;$('spaelHomeT').textContent=t.home;$('spaelHome').setAttribute('aria-label',t.homeA);$('spaelHome').title=t.homeA;
  $('spaelMusicT').textContent=t.music;$('spaelSfxT').textContent=t.sfx;
  [['spaelMusic',music,t.music],['spaelSfx',sfx,t.sfx]].forEach(([id,on,name])=>{const b=$(id);b.classList.toggle('off',!on);b.setAttribute('aria-pressed',String(on));const lab=name+': '+(on?t.on:t.off);b.setAttribute('aria-label',lab);b.title=lab;});}
function tellGame(){window.dispatchEvent(new CustomEvent('spael:sfx',{detail:sfx}));}
/* keep clicks on the bar from reaching the game underneath */
['pointerdown','mousedown','touchstart','click'].forEach(ev=>$('spaelBar').addEventListener(ev,e=>e.stopPropagation()));
$('spaelBar').addEventListener('keydown',e=>e.stopPropagation());

/* ---------- music: a soft, looping folk tune made in the browser ---------- */
let ac=null,out=null,timer=null,next=0,step=0,last=7,playing=false;
const BPM=80,E8=60/BPM/2;                       // one eighth note
const SCALE=[50,52,53,55,57,60,62,64,65,67,69,72,74]; // D dorian-ish, MIDI
const CHORDS=[[50,57,62,65],[48,55,60,64],[53,60,65,69],[48,55,60,64],[50,57,62,65],[45,52,57,60],[46,53,58,62],[48,55,60,64]]; // Dm C F C Dm Am Bb C
const hz=m=>440*Math.pow(2,(m-69)/12);
function audio(){if(ac)return true;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return false;}
  out=ac.createGain();out.gain.value=0;out.connect(ac.destination);
  const d=ac.createDelay(1);d.delayTime.value=E8*3;const fb=ac.createGain();fb.gain.value=0.32;const wet=ac.createGain();wet.gain.value=0.28;
  d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(out);out.echo=d;return true;}
function voice(type,m,t,dur,vol,att,dest,cut){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);
  let node=o;if(cut){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;o.connect(f);node=f;}
  node.connect(g);g.connect(dest||out);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.05);}
function pluck(m,t,vol){voice('triangle',m,t,1.1,vol,0.006);voice('sine',m+12,t,0.5,vol*0.35,0.004);const g=ac.createGain();g.gain.value=1;
  const o=ac.createOscillator();o.type='triangle';o.frequency.value=hz(m);const eg=ac.createGain();eg.gain.setValueAtTime(0.0001,t);eg.gain.linearRampToValueAtTime(vol*0.5,t+0.006);eg.gain.exponentialRampToValueAtTime(0.0001,t+0.8);o.connect(eg);eg.connect(out.echo);o.start(t);o.stop(t+0.85);}
function schedule(){while(next<ac.currentTime+0.3){const bar=Math.floor(step/8)%CHORDS.length,b8=step%8,ch=CHORDS[bar],phrase=Math.floor(step/64)%4;
    if(b8===0){ch.slice(1).forEach(m=>voice('triangle',m,next,E8*8.6,0.035,0.9,null,900));voice('sine',ch[0]-12,next,E8*8.4,0.09,0.25);}
    if(b8===4)voice('sine',ch[0]-12,next,E8*4.2,0.05,0.1);
    const quiet=phrase===3;                       // every fourth phrase rests, so the loop breathes
    const chance=b8%2===0?0.78:0.28;
    if(!quiet&&Math.random()<chance){let i=last+[-2,-1,-1,0,1,1,2][(Math.random()*7)|0];i=Math.max(2,Math.min(SCALE.length-1,i));
      if(b8===0){const tones=ch.map(c=>c%12);let best=i,bd=99;for(let k=Math.max(0,i-2);k<=Math.min(SCALE.length-1,i+2);k++)if(tones.includes(SCALE[k]%12)&&Math.abs(k-i)<bd){bd=Math.abs(k-i);best=k;}i=best;}
      last=i;pluck(SCALE[i]+12,next,b8===0?0.085:0.06);}
    next+=E8;step++;}}
function startMusic(){if(!music||playing||!audio())return;if(ac.state==='suspended')ac.resume();playing=true;next=ac.currentTime+0.1;
  out.gain.cancelScheduledValues(ac.currentTime);out.gain.setValueAtTime(out.gain.value,ac.currentTime);out.gain.linearRampToValueAtTime(0.5,ac.currentTime+2.5);
  schedule();timer=setInterval(schedule,100);}
function stopMusic(){if(!playing)return;playing=false;clearInterval(timer);const t=ac.currentTime;out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(out.gain.value,t);out.gain.linearRampToValueAtTime(0,t+0.4);}
/* browsers only allow sound after the first tap or key press */
const kick=()=>{startMusic();};
['pointerdown','keydown','touchend'].forEach(ev=>window.addEventListener(ev,kick,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden){clearInterval(timer);ac.suspend();}else if(playing){ac.resume();next=ac.currentTime+0.1;timer=setInterval(schedule,100);}});

/* phones: the bar folds into one round button */
const bar=$('spaelBar');
function fold(open){bar.classList.toggle('open',open);$('spaelMore').setAttribute('aria-expanded',String(open));}
$('spaelMore').addEventListener('click',()=>fold(!bar.classList.contains('open')));
document.addEventListener('pointerdown',e=>{if(bar.classList.contains('open')&&!bar.contains(e.target))fold(false);},true);
$('spaelMusic').addEventListener('click',()=>{music=!music;put('spael-music',music);paint();if(music)startMusic();else stopMusic();});
$('spaelSfx').addEventListener('click',()=>{sfx=!sfx;put('spael-sfx',sfx);paint();tellGame();});
new MutationObserver(paint).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
paint();tellGame();
})();
</script>
<!-- SPAEL-BAR END -->
